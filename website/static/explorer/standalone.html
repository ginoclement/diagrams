<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Explorer — Authentication</title>
<meta name="description" content="Interactive, self-contained walkthrough of 35 authentication flows with per-step request/response and DevTools guidance.">
</head>
<body>
<style>:root{
  --bg:#f4f7fb; --panel:#ffffff; --panel-2:#eef2f8; --ink:#111823; --muted:#586576;
  --line:#dde4ee; --brand:#3a63d8; --brand-soft:#e6edfb;
  --get:#1f9d6b; --post:#b9821f; --redir:#3a63d8; --ok:#1f9d6b; --err:#d1495b; --back:#7a6cf0;
  --user:#8a5cf6; --agent:#2563c9; --idp:#0f9d6b; --api:#b9821f;
  --radius:12px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Cascadia Code",monospace;
  --sans:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0c1017; --panel:#141b26; --panel-2:#0f1621; --ink:#e8eef7; --muted:#93a1b4;
    --line:#243040; --brand:#6f97ff; --brand-soft:#182541;
    --get:#39c08a; --post:#e0a63f; --redir:#6f97ff; --ok:#39c08a; --err:#f0748a; --back:#a394ff;
    --user:#b79bff; --agent:#6f97ff; --idp:#39c08a; --api:#e0a63f; }
}
:root[data-theme="light"]{ --bg:#f4f7fb; --panel:#ffffff; --panel-2:#eef2f8; --ink:#111823; --muted:#586576;
  --line:#dde4ee; --brand:#3a63d8; --brand-soft:#e6edfb; --get:#1f9d6b; --post:#b9821f; --redir:#3a63d8;
  --ok:#1f9d6b; --err:#d1495b; --back:#7a6cf0; --user:#8a5cf6; --agent:#2563c9; --idp:#0f9d6b; --api:#b9821f; }
:root[data-theme="dark"]{ --bg:#0c1017; --panel:#141b26; --panel-2:#0f1621; --ink:#e8eef7; --muted:#93a1b4;
  --line:#243040; --brand:#6f97ff; --brand-soft:#182541; --get:#39c08a; --post:#e0a63f; --redir:#6f97ff;
  --ok:#39c08a; --err:#f0748a; --back:#a394ff; --user:#b79bff; --agent:#6f97ff; --idp:#39c08a; --api:#e0a63f; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-size:15px}
.wrap{max-width:1160px;margin:0 auto;padding:20px 20px 48px}
a{color:var(--brand)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
header.top h1{font-size:22px;margin:.2em 0 0;letter-spacing:-.01em;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13.5px;margin-top:2px;max-width:70ch}
.controls{display:flex;align-items:center;gap:10px}
.counter{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px;color:var(--muted);min-width:74px;text-align:center}
button.nav{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer;transition:.15s}
button.nav:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
button.nav:disabled{opacity:.4;cursor:not-allowed}
button.nav:focus-visible,.step:focus-visible,.card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.progress{height:4px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress > i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s ease}

.grid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}

ol.timeline{list-style:none;margin:0;padding:0;position:relative}
ol.timeline::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:var(--line)}
.step{position:relative;display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:9px 8px 9px 42px;border-radius:9px;color:var(--ink);font:inherit}
.step:hover{background:var(--panel-2)}
.step .dot{position:absolute;left:8px;top:11px;width:16px;height:16px;border-radius:50%;
  background:var(--panel);border:2px solid var(--line);z-index:1}
.step.active{background:var(--panel)}
.step.active .dot{border-color:var(--brand);background:var(--brand)}
.step.done .dot{border-color:var(--brand)}
.step .lbl{font-size:13.5px;font-weight:600;line-height:1.3}
.step.active .lbl{color:var(--brand)}
.step .hop{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;
  padding:1px 6px;border-radius:5px;vertical-align:middle;margin-left:6px}
.tag.back{color:var(--back);background:color-mix(in srgb,var(--back) 15%,transparent)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel + .panel{margin-top:16px}
.panel > .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.panel > .head h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--muted)}
.panel > .body{padding:14px 16px}
.lede{margin:0 0 4px;font-size:15.5px}
.actors{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:12px}
.chip{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;background:var(--muted)}
.chip.User{background:var(--user)} .chip.App{background:var(--agent)} .chip.Browser{background:var(--agent)}
.chip.IdP{background:var(--idp)} .chip.API{background:var(--api)} .chip.SP{background:var(--agent)}
.chip.Directory{background:var(--api)} .chip.Client{background:var(--agent)} .chip.Server{background:var(--idp)}
.chip.SP2{background:var(--user)}
.arrow{color:var(--muted)}

.method{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:6px;color:#fff}
.method.GET{background:var(--get)} .method.POST{background:var(--post)} .method.PUT{background:var(--post)}
.method.DELETE{background:var(--err)} .method.n3{background:var(--redir)}
.url{font-family:var(--mono);font-size:12.5px;word-break:break-all;color:var(--ink)}
.status{font-family:var(--mono);font-size:12px;font-weight:700}
.status.ok{color:var(--ok)} .status.redir{color:var(--redir)} .status.err{color:var(--err)}

table.kv{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
table.kv td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td.k{color:var(--muted);white-space:nowrap;width:1%;font-weight:600}
table.kv td.v{word-break:break-all}
.scroll{overflow-x:auto}
pre.code{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;padding:12px;margin:0;overflow-x:auto;line-height:1.55;white-space:pre}
.cm{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

.devtools{display:flex;gap:12px;align-items:flex-start;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);
  border-radius:10px;padding:12px 14px}
.devtools .ic{font-size:16px;line-height:1.2}
.devtools p{margin:0;font-size:13.5px}
.devtools b{color:var(--brand)}
.banner.back{background:color-mix(in srgb,var(--back) 12%,transparent);border:1px solid color-mix(in srgb,var(--back) 40%,transparent);
  border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink);margin-bottom:14px}
.banner.back b{color:var(--back)}

footer.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
kbd{font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px}

/* Picker */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:8px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;text-decoration:none;color:var(--ink);transition:.15s}
.card:hover{border-color:var(--brand);transform:translateY(-1px)}
.card .cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .t{font-size:15px;font-weight:650;margin-top:4px;line-height:1.3}
.card .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px}
.group-title{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:26px 0 2px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

ch request carries — and how to read it in the Network tab.","category":"OIDC","steps":[{"from":"User","to":"App","label":"User taps “Sign in”","hop":"User → App","lede":"The user starts sign-in in a public client (SPA or native app). Nothing has hit the network yet.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b> tab, enable <b>Preserve log<\/b> so redirects aren’t cleared, and filter on <b>Doc<\/b> / <b>Fetch<\/b>."},{"from":"App","to":"App","label":"Generate PKCE verifier + challenge","hop":"App (local)","lede":"The client creates a random code_verifier and derives a code_challenge. The verifier never leaves the client until the token call.","codeTitle":"Computed locally","code":"code_verifier  = base64url(random(32 bytes))\n             = \"dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk\"\ncode_challenge = base64url( SHA-256( code_verifier ) )\n             = \"E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM\"\nmethod         = S256","devtools":"Not a network event — but in a real app you can watch the verifier get stored in <b>Session Storage<\/b> (Application tab) before the redirect."},{"from":"App","to":"IdP","label":"Redirect to /authorize","hop":"Browser → IdP","vis":"browser","lede":"The browser is redirected to the authorization endpoint. Note the challenge is sent, the verifier is not.","req":{"method":"GET","url":"https://idp.example.com/authorize","q":[["response_type","code"],["client_id","s6BhdRkqt3"],["redirect_uri","https://app.example.com/callback"],["scope","openid profile email"],["state","af0ifjsldkj"],["nonce","n-0S6_WzA2Mj"],["code_challenge","E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM"],["code_challenge_method","S256"]]},"devtools":"Find the request to <b>/authorize<\/b>. Read the <b>query string<\/b> params — confirm <b>code_challenge_method=S256<\/b> and that no secret is present. Copy <b>state<\/b>; you’ll match it on the way back."},{"from":"IdP","to":"User","label":"Login + consent screen","hop":"IdP → User","vis":"browser","lede":"The IdP serves its login page (and consent, if required). Credentials are entered against the IdP, never the app.","req":{"method":"GET","url":"https://idp.example.com/login?..."},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"],["set-cookie","idp_session=…; HttpOnly; Secure; SameSite=Lax"]]},"devtools":"You’ll see the IdP’s own HTML documents and an <b>idp_session<\/b> cookie set with <b>HttpOnly; Secure<\/b>. Credentials post to the IdP’s domain — verify the origin is the real IdP."},{"from":"IdP","to":"App","label":"Redirect back with code","hop":"IdP → Browser","vis":"browser","lede":"On success the IdP 302-redirects back to redirect_uri with a short-lived authorization code and the echoed state.","resp":{"status":302,"statusText":"Found","headers":[["location","https://app.example.com/callback?code=SplxlOBeZQQYbYS6WxSbIA&state=af0ifjsldkj"]]},"devtools":"Find the <b>302<\/b> whose <b>Location<\/b> header points at your <b>redirect_uri<\/b>. The <b>code<\/b> is in the query string. Verify the returned <b>state<\/b> equals the one you sent — a mismatch means CSRF; abort."},{"from":"App","to":"IdP","label":"Exchange code at /token","hop":"App → IdP","vis":"browser","lede":"The client posts the code plus the original code_verifier. The IdP recomputes SHA-256(verifier) and checks it equals the stored challenge — this is what defeats a stolen code.","req":{"method":"POST","url":"https://idp.example.com/token","headers":[["content-type","application/x-www-form-urlencoded"]],"form":[["grant_type","authorization_code"],["code","SplxlOBeZQQYbYS6WxSbIA"],["redirect_uri","https://app.example.com/callback"],["client_id","s6BhdRkqt3"],["code_verifier","dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"]]},"devtools":"Filter for <b>token<\/b>. Open the <b>Payload<\/b> tab: confirm <b>code_verifier<\/b> is present and there is <b>no client_secret<\/b> (public client). If this were a confidential client, the secret would be server-side and this call would <i>not<\/i> appear in the browser."},{"from":"IdP","to":"App","label":"Tokens returned","hop":"IdP → App","vis":"browser","lede":"The IdP returns an access token, an ID token (a JWT about the user), and often a rotating refresh token.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"access_token\": \"AT.aB3…synthetic…9Zq\",\n  \"id_token\": \"eyJhbGciOiJSUzI1Ni….eyJpc3Mi….SIG\",\n  \"refresh_token\": \"RT.f7…synthetic…k2\",\n  \"scope\": \"openid profile email\"\n}"},"jwt":{"title":"Decoded id_token","header":"{ \"alg\": \"RS256\", \"kid\": \"idp-2026-a\", \"typ\": \"JWT\" }","payload":[["iss","https://idp.example.com","Issuer — must equal your IdP"],["aud","s6BhdRkqt3","Audience — must equal your client_id"],["sub","248289761001","Stable user identifier"],["email","ada@example.com","Claim from the profile/email scope"],["nonce","n-0S6_WzA2Mj","Must equal the nonce you sent in /authorize"],["iat","1919251200","Issued-at (epoch)"],["exp","1919254800","Expiry (epoch) — reject if past"]]},"devtools":"In the <b>token<\/b> response → <b>Response<\/b> tab, copy the <b>id_token<\/b>. It’s a JWT: three base64url parts split by <code>.<\/code>. Base64url-decode the first two for header and claims (or paste into jwt.io / use the Auth Inspector extension). <b>Never<\/b> trust a JWT you haven’t verified server-side."},{"from":"App","to":"API","label":"Call the API with the token","hop":"App → API","vis":"browser","lede":"The client calls a resource server, presenting the access token as a Bearer credential.","req":{"method":"GET","url":"https://api.example.com/me","headers":[["authorization","Bearer AT.aB3…synthetic…9Zq"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"sub\": \"248289761001\", \"name\": \"Ada Lovelace\", \"email\": \"ada@example.com\" }"},"devtools":"Find the API request and read the <b>Authorization: Bearer<\/b> request header. On the resource server this token is validated (signature via JWKS, <b>iss<\/b>, <b>aud<\/b>, <b>exp<\/b>, scopes) before the data is returned."},{"from":"App","to":"App","label":"Signed in","hop":"App (local)","lede":"The client establishes its session from the validated tokens and shows the authenticated UI. The verifier, code, and any secrets are discarded.","devtools":"Nothing further on the wire for sign-in. A stolen authorization code from the redirect is now <b>useless<\/b> to an attacker: without the matching <b>code_verifier<\/b>, the token exchange fails with <code>invalid_grant<\/code>. That is PKCE."}]},"oidc-authorization-code":{"title":"OIDC Authorization Code (Confidential Client)","subtitle":"The server-side web-app flow. Step through it and see why the tokens never touch the browser — and how to read the front channel in the Network tab.","category":"OIDC","steps":[{"from":"User","to":"App","label":"User visits a protected page","hop":"User → App","lede":"The user hits a page that needs a session. The app has no session yet, so it builds an authorization request and stores state + nonce. Nothing secret has left the server.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b> tab, enable <b>Preserve log<\/b> so the redirects aren’t cleared, and set the filter to <b>Doc<\/b> — the hops in this flow are full-page document navigations."},{"from":"App","to":"IdP","label":"Redirect to /authorize","hop":"Browser → IdP","vis":"browser","lede":"The app 302-redirects the browser to the authorization endpoint. This front channel carries no secret — just the public client_id, the redirect_uri, the requested scopes, and the CSRF/replay guards.","req":{"method":"GET","url":"https://idp.example.com/authorize","q":[["response_type","code"],["client_id","s6BhdRkqt3"],["redirect_uri","https://app.example.com/callback"],["scope","openid profile email"],["state","af0ifjsldkj"],["nonce","n-0S6_WzA2Mj"]]},"devtools":"Find the request to <b>/authorize<\/b> and read the <b>Query String Parameters<\/b>. Confirm <b>response_type=code<\/b> and that <i>no client_secret<\/i> is present — the secret stays on the server. Copy <b>state<\/b>; you’ll match it on the way back."},{"from":"IdP","to":"User","label":"Login + consent screen","hop":"IdP → User","vis":"browser","lede":"The IdP serves its own login page and, if needed, a consent screen for the requested scopes. Credentials are entered against the IdP, never against the app.","resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"],["set-cookie","idp_session=sess_synthetic_abc123; Path=/; HttpOnly; Secure"]]},"devtools":"You’ll see the IdP’s own HTML documents and an <b>idp_session<\/b> cookie set with <b>HttpOnly; Secure<\/b> (Application tab → Cookies for the IdP origin). Verify the origin is the real IdP before typing a password."},{"from":"IdP","to":"App","label":"Redirect back with code","hop":"IdP → Browser","vis":"browser","lede":"On success the IdP 302-redirects back to the registered redirect_uri with a short-lived, single-use authorization code and the echoed state.","resp":{"status":302,"statusText":"Found","headers":[["location","https://app.example.com/callback?code=SplxlOBeZQQYbYS6WxSbIA&state=af0ifjsldkj"]]},"devtools":"Find the <b>302<\/b> whose <b>Location<\/b> header points at your <b>redirect_uri<\/b>. The <b>code<\/b> is in the query string. Verify the returned <b>state<\/b> equals the one you sent — a mismatch means CSRF; discard the code and do not call /token."},{"from":"App","to":"IdP","label":"Exchange code at /token","hop":"App → IdP","lede":"The app’s backend posts the code to the token endpoint and authenticates itself with its client secret (here HTTP Basic). This is a server-to-server call — the browser never sees it.","req":{"method":"POST","url":"https://idp.example.com/token","headers":[["authorization","Basic czZCaGRSa3F0Mzpjc19zeW50aGV0aWM="],["content-type","application/x-www-form-urlencoded"]],"form":[["grant_type","authorization_code"],["code","SplxlOBeZQQYbYS6WxSbIA"],["redirect_uri","https://app.example.com/callback"]]},"devtools":"You will <b>not<\/b> see this request in the browser — that is the defining property of the confidential-client flow. The <b>Authorization: Basic<\/b> header decodes to <code>client_id:client_secret<\/code> (<code>s6BhdRkqt3:cs_synthetic<\/code>). To inspect it, use backend logs or a proxy (mitmproxy / Charles), never DevTools."},{"from":"IdP","to":"App","label":"Tokens returned","hop":"IdP → App","lede":"The IdP validates the code, client auth, and redirect_uri, then returns an access token and an ID token (a JWT about the user). These tokens stay on the server side.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"at_synthetic_2f1e0d9c8b7a6543\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"scope\": \"openid profile email\",\n  \"id_token\": \"eyJhbGciOiJSUzI1Ni….eyJpc3Mi….SIG\"\n}"},"jwt":{"title":"Decoded id_token","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"idp-2026-07-key1\" }","payload":[["iss","https://idp.example.com","Issuer — must equal your configured IdP"],["sub","248289761001","Stable, opaque user id at this IdP"],["aud","s6BhdRkqt3","Audience — must equal your client_id"],["exp","1774000000","Expiry (epoch) — reject if past"],["iat","1773996400","Issued-at (epoch)"],["auth_time","1773996390","When the user actually authenticated"],["nonce","n-0S6_WzA2Mj","Must equal the nonce you sent to /authorize"],["email","ada.lovelace@example.com","Claim from the profile/email scope"],["email_verified","true","Whether the IdP verified the address"]]},"devtools":"The <b>id_token<\/b> never appears in the browser for this flow — decode it from a backend log or proxy capture, not the Network tab. Validation the server must do: verify the signature against the JWKS key named by <code>kid<\/code>, then check <b>iss<\/b>, <b>aud == client_id<\/b>, <b>exp<\/b>, and that <b>nonce<\/b> matches the stored value."},{"from":"App","to":"Browser","label":"Establish app session","hop":"App → Browser","vis":"browser","lede":"Having validated the tokens server-side, the app sets its own session cookie and redirects the browser to the logged-in page. The browser holds a cookie, not a token.","resp":{"status":302,"statusText":"Found","headers":[["location","https://app.example.com/home"],["set-cookie","app_session=app_synthetic_def456; Path=/; HttpOnly; Secure"]]},"devtools":"The only thing the browser gains is an <b>app_session<\/b> cookie (<b>HttpOnly; Secure<\/b>). Confirm in the Application tab that no access_token or id_token is stored in <b>localStorage<\/b> / <b>sessionStorage<\/b> — in a classic confidential-client app there is nothing token-shaped in the browser at all."},{"from":"App","to":"App","label":"Signed in","hop":"App (local)","lede":"The app renders the dashboard from its server-side session. The authorization code was single-use and is now spent.","devtools":"Nothing further on the wire for sign-in. Because the code exchange and the tokens lived only on the back channel, a network eavesdropper on the browser never saw a bearer credential. Replaying the spent <b>code<\/b> at /token now fails with <code>invalid_grant<\/code>."}]},"oidc-back-channel-logout":{"title":"OIDC Back-Channel Logout","subtitle":"The IdP tells every app a user is signed out of by POSTing a signed logout_token server-to-server — the core step never touches the browser.","category":"OIDC","steps":[{"from":"User","to":"Browser","label":"User (or an admin) triggers logout","hop":"User → Browser","lede":"Something ends the SSO session — the user clicks “Log out” or an admin revokes the session at the IdP. This is where the chain starts.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b> tab, enable <b>Preserve log<\/b> so the redirect chain survives navigation. The <i>important<\/i> step of this flow will <b>not<\/b> appear here — that is the lesson."},{"from":"Browser","to":"IdP","label":"Logout reaches the end_session_endpoint","hop":"Browser → IdP","vis":"browser","lede":"The logout is delivered to the IdP — typically via RP-Initiated Logout hitting end_session. The IdP clears its own session cookie and redirects back.","req":{"method":"GET","url":"https://idp.example.com/end_session","q":[["id_token_hint","eyJhbGciOiJSUzI1NiJ9.eyJpc3Mi….SIG_synthetic"],["post_logout_redirect_uri","https://rp1.example.com/loggedout"],["state","af0ifjsldkj"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://rp1.example.com/loggedout?state=af0ifjsldkj"],["set-cookie","idp_session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=None"]]},"devtools":"Filter on <b>end_session<\/b>. Decode the <b>id_token_hint<\/b> (jwt.io / Auth Inspector) to read <b>sub<\/b> and <b>sid<\/b> — the session the IdP is about to tear down. Confirm the <b>idp_session<\/b> cookie is cleared with <code>Max-Age=0<\/code>."},{"from":"IdP","to":"IdP","label":"Terminate session, mint one logout_token per RP","hop":"IdP (local)","lede":"The IdP terminates SSO session sid=abc123session, enumerates every RP that joined it, and mints a distinct logout_token (a JWT) for each — audience-scoped to that RP.","codeTitle":"Per-RP logout_token (computed at the IdP)","code":"for rp in session.participants:            # RP1, RP2, …\n  logout_token = sign(\n    iss    = \"https://idp.example.com\",\n    aud    = rp.client_id,                 # scoped to ONE rp\n    events = { \"http://schemas.openid.net/event/backchannel-logout\": {} },\n    sub    = \"248289761001\",\n    sid    = \"abc123session\",\n    jti    = unique(), iat = now, exp = now + 120 )\n  POST rp.backchannel_logout_uri  logout_token=<jwt>","devtools":"Not a network event you can see — it happens inside the IdP. Note the <b>events<\/b> claim is what distinguishes a logout token from a replayed ID token."},{"from":"IdP","to":"App","label":"POST logout_token to the RP (back-channel)","hop":"IdP → App (server-to-server)","lede":"The IdP POSTs the logout_token directly to the RP’s backchannel_logout_uri. This request is server-to-server: it never traverses the browser, so it is invisible in the Network tab.","req":{"method":"POST","url":"https://rp1.example.com/backchannel-logout","headers":[["content-type","application/x-www-form-urlencoded"],["user-agent","OpenID-Provider/1.0 (synthetic)"]],"form":[["logout_token","eyJhbGciOiJSUzI1NiIsInR5cCI6ImxvZ291dCtqd3QiLCJraWQiOiJpZHAta2V5LTIwMjYifQ.eyJpc3Mi…synthetic…fQ.SIG_synthetic_not_a_real_signature_do_not_verify"]]},"resp":{"status":200,"statusText":"OK","headers":[["cache-control","no-store"],["content-length","0"]]},"jwt":{"title":"Decoded logout_token","header":"{ \"alg\": \"RS256\", \"typ\": \"logout+jwt\", \"kid\": \"idp-key-2026\" }","payload":[["iss","https://idp.example.com","Issuer — must equal the expected OP"],["aud","s6BhdRkqt3","Audience — must contain this RP’s client_id"],["iat","1774000000","Issued-at — must be recent"],["jti","bWJq-logout-0001","Unique id — cache it to reject replays"],["exp","1774000120","Expiry — short-lived (120s after iat)"],["events","{ \"…/backchannel-logout\": {} }","REQUIRED — marks this a back-channel logout"],["sub","248289761001","Subject — which user"],["sid","abc123session","Session id — which specific session to kill"]]},"devtools":"<b>You will NOT find this in DevTools.<\/b> It is delivered IdP → RP over the back channel; capture it in RP access logs or a proxy (mitmproxy) in front of the RP. A common gotcha: a <b>nonce<\/b> claim must be <i>absent<\/i> — its presence means an ID token was replayed as a logout token → reject with <code>400<\/code>."},{"from":"App","to":"App","label":"Validate the token, destroy the session","hop":"App (local)","lede":"The RP validates the logout_token like an ID token — with two twists — then finds the session by sid and destroys it, revoking any refresh tokens. Handlers must be idempotent.","devtools":"Server-side: verify the signature against the IdP JWK <code>kid=idp-key-2026<\/code> (<b>alg<\/b> not <code>none<\/code>), check <b>iss<\/b>, <b>aud<\/b>, <b>iat<\/b>/<b>exp<\/b>, that <b>events<\/b> is present and <b>nonce<\/b> is not, and that <b>jti<\/b> is unseen. Delivery is at-least-once — a repeated <b>jti<\/b> or an unknown <b>sid<\/b> must return <code>200<\/code>, not error."},{"from":"Browser","to":"App","label":"Next visit finds no session","hop":"Browser → App","vis":"browser","lede":"This is the only browser-side evidence the logout landed. On the next request the orphaned RP cookie matches no session, so the RP clears it and bounces the browser to re-authenticate.","req":{"method":"GET","url":"https://rp1.example.com/app","headers":[["cookie","rp1_session=SYNTHETIC-orphaned-rp-session"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://idp.example.com/authorize?response_type=code&client_id=s6BhdRkqt3&redirect_uri=https%3A%2F%2Frp1.example.com%2Fcb&scope=openid&state=xyz789"],["set-cookie","rp1_session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax"]]},"devtools":"Filter on <b>authorize<\/b>. The <b>Set-Cookie<\/b> clearing <b>rp1_session<\/b> plus the fresh <code>/authorize<\/code> redirect is your proof the back-channel POST actually destroyed the server-side session."},{"from":"App","to":"User","label":"Signed out everywhere","hop":"App → User","lede":"Every RP that joined the session has been notified out-of-band. The user is signed out across all of them and must re-authenticate to continue.","devtools":"The value of the back channel: logout is reliable and driven by the IdP even if the browser is closed — but you must capture on the server to see it work. Contrast with <i>front-channel logout<\/i>, which is fully browser-visible but best-effort."}]},"oidc-ciba":{"title":"OIDC CIBA (Client-Initiated Backchannel Authentication)","subtitle":"A decoupled flow: the app asks the IdP to authenticate the user out-of-band on their phone, then polls for tokens — there is essentially nothing to see in a browser Network tab.","category":"OIDC","steps":[{"from":"User","to":"Client","label":"User requests service, identifies self","hop":"User → Client","lede":"The user asks the consumption-device client for something (e.g. authorizing a payment at a call center) and identifies themselves — here by phone number. Authentication will happen on a separate device.","devtools":"DevTools gets you almost nothing here — and that is the point. <b>CIBA is decoupled and back-channel:<\/b> the client talks to the IdP server-to-server and the user authenticates out-of-band on their phone. To observe it you capture on the <b>client back end<\/b> (app HTTP logs, or an egress proxy like mitmproxy), never in the browser."},{"from":"Client","to":"IdP","label":"POST /bc-authorize (back-channel)","hop":"Client → IdP (server-to-server)","lede":"The client makes the backchannel authentication request: scope, exactly one identity hint (login_hint here), an optional human-readable binding_message, and client authentication (private_key_jwt). It gets back an auth_req_id to poll with.","req":{"method":"POST","url":"https://idp.example.com/bc-authorize","headers":[["content-type","application/x-www-form-urlencoded"]],"form":[["scope","openid"],["login_hint","+15550001234"],["binding_message","PAY-4711"],["requested_expiry","120"],["client_assertion_type","urn:ietf:params:oauth:client-assertion-type:jwt-bearer"],["client_assertion","eyJ.SYNTHETIC-private-key-jwt.SIG_synthetic"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"auth_req_id\": \"1c266114-a1be-4252-8ad1-04986c5b9ac1\",\n  \"expires_in\": 120,\n  \"interval\": 5\n}"},"devtools":"<b>Not in the browser.<\/b> Capture on the client (proxy / server logs). Exactly one of <b>login_hint<\/b> / <b>login_hint_token<\/b> / <b>id_token_hint<\/b> is allowed. The response <b>auth_req_id<\/b> is the handle you poll with; <b>interval<\/b> is the minimum seconds between polls."},{"from":"IdP","to":"App","label":"Push challenge to the user’s phone (out-of-band)","hop":"IdP → App (out-of-band)","lede":"The IdP pushes an authentication request to the user’s registered authenticator app, showing the client name and the binding_message. This travels the device vendor’s push channel — not HTTP you can capture.","devtools":"<b>Not an HTTP request you can see at all<\/b> — not in DevTools, not even in your egress proxy. The user will compare the <b>binding_message<\/b> (<code>PAY-4711<\/code>) shown on both the consumption device and the phone before approving."},{"from":"Client","to":"IdP","label":"POST /token — first poll (pending)","hop":"Client → IdP (server-to-server)","lede":"The client polls the token endpoint with the CIBA grant. The user hasn’t approved yet, so the IdP answers authorization_pending — keep polling at the given interval.","req":{"method":"POST","url":"https://idp.example.com/token","headers":[["content-type","application/x-www-form-urlencoded"]],"form":[["grant_type","urn:openid:params:grant-type:ciba"],["auth_req_id","1c266114-a1be-4252-8ad1-04986c5b9ac1"],["client_assertion_type","urn:ietf:params:oauth:client-assertion-type:jwt-bearer"],["client_assertion","eyJ.SYNTHETIC-private-key-jwt.SIG_synthetic"]]},"resp":{"status":400,"statusText":"Bad Request","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{ \"error\": \"authorization_pending\" }"},"devtools":"<b>Server-side only.<\/b> Each poll sends <code>grant_type=urn:openid:params:grant-type:ciba<\/code> and <b>auth_req_id<\/b>. Responses to expect: <b>authorization_pending<\/b> (waiting), <b>slow_down<\/b> (polling too fast — add ~5s), then <code>200<\/code> on approval. Terminal errors: <b>expired_token<\/b>, <b>access_denied<\/b>, <b>transaction_failed<\/b>."},{"from":"User","to":"App","label":"User approves on the phone (out-of-band)","hop":"User → App (out-of-band)","lede":"The user verifies the binding_message matches, authenticates on the phone (fingerprint + OTP), and approves. The authenticator reports the result back to the IdP — all off the browser and off your proxy.","devtools":"Nothing to capture: this happens entirely on the authentication device. This decoupling is CIBA’s whole value — the device requesting access and the device authorizing it are different."},{"from":"Client","to":"IdP","label":"POST /token — later poll (tokens issued)","hop":"Client → IdP (server-to-server)","lede":"A subsequent poll now succeeds: the IdP returns the access token, refresh token, and an ID token whose auth_req_id claim ties it back to this exact backchannel request.","req":{"method":"POST","url":"https://idp.example.com/token","headers":[["content-type","application/x-www-form-urlencoded"]],"form":[["grant_type","urn:openid:params:grant-type:ciba"],["auth_req_id","1c266114-a1be-4252-8ad1-04986c5b9ac1"],["client_assertion_type","urn:ietf:params:oauth:client-assertion-type:jwt-bearer"],["client_assertion","eyJ.SYNTHETIC-private-key-jwt.SIG_synthetic"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"SlAV32hkKG-synthetic\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"refresh_token\": \"8xLOxBtZp8-synthetic\",\n  \"id_token\": \"eyJhbGciOiJSUzI1Ni….eyJpc3Mi….SIG_synthetic\"\n}"},"jwt":{"title":"Decoded id_token","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"idp-key-2026\" }","payload":[["iss","https://idp.example.com","Issuer"],["sub","248289761001","Subject — the user who approved on their phone"],["aud","s6BhdRkqt3","The CIBA client’s client_id"],["exp","1774003600","Expiry (epoch)"],["auth_time","1773999950","When the user approved on the auth device"],["amr","[\"fpt\", \"otp\"]","Fingerprint + OTP on the authentication device"],["urn:openid:params:jwt:claim:auth_req_id","1c266114-a1be-4252-8ad1-04986c5b9ac1","Binds this id_token to THIS backchannel request — not a replay"]]},"devtools":"<b>Server-side.<\/b> The <b>auth_req_id<\/b> claim in the ID token equals the value returned from <code>/bc-authorize<\/code>, so the client can confirm these tokens answer <i>its<\/i> request and not a replayed one."},{"from":"Client","to":"User","label":"Transaction proceeds","hop":"Client → User","lede":"With valid tokens in hand, the consumption device completes the action. The browser, if any is even present, saw none of the authentication.","devtools":"In <b>ping mode<\/b> the IdP instead POSTs the client’s <code>client_notification_endpoint<\/code> with <code>Authorization: Bearer &lt;client_notification_token&gt;<\/code> to signal completion — captured on the client’s inbound (webhook) side, again never in a browser."}]},"oidc-client-credentials":{"title":"OAuth 2.0 Client Credentials (Machine-to-Machine)","subtitle":"A service authenticates as itself — no user, no browser, no front channel. Every hop here is server-to-server, so there is nothing to watch in a Network tab.","category":"OIDC","steps":[{"from":"Client","to":"Client","label":"Service needs an access token","hop":"Client (local)","lede":"A daemon, job, or backend service wants to call an API as itself. There is no human and no browser — this whole flow is a back channel.","devtools":"Nothing here is browser-visible, so <b>DevTools does not apply<\/b>. Observe the calls with a debugging proxy (mitmproxy / Charles / Fiddler / Burp) pointed at the service’s HTTPS traffic, with <code>curl -v<\/code>, or from the service’s own logs — never logging the secret or the full token."},{"from":"Client","to":"IdP","label":"Request a token at /token","hop":"Client → IdP","lede":"The client posts grant_type=client_credentials and authenticates itself — here with HTTP Basic (client_secret_basic). It asks for the scopes it needs.","req":{"method":"POST","url":"https://idp.example.com/token","headers":[["authorization","Basic c3ZjLXJlcG9ydC1ydW5uZXI6Y3Nfc3ludGhldGlj"],["content-type","application/x-www-form-urlencoded"]],"form":[["grant_type","client_credentials"],["scope","read:reports"]]},"devtools":"A server-to-server call — the engine flags it as back-channel. The <b>Authorization: Basic<\/b> header decodes to <code>client_id:client_secret<\/code> (<code>svc-report-runner:cs_synthetic<\/code>). Alternatives to Basic are <code>private_key_jwt<\/code> (a signed <code>client_assertion<\/code>) or an mTLS client certificate."},{"from":"IdP","to":"Client","label":"Access token returned","hop":"IdP → Client","lede":"The IdP authenticates the client, checks it is authorized for the requested scopes, and returns a bearer access token. Note there is no id_token and no refresh_token — there is no user.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"eyJhbGciOiJSUzI1Ni….eyJpc3Mi….SIG\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"scope\": \"read:reports\"\n}"},"jwt":{"title":"Decoded access_token (this AS issues a JWT)","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"idp-2026-07-key1\" }","payload":[["iss","https://idp.example.com","Issuer — the authorization server"],["sub","svc-report-runner","Subject — the CLIENT itself; no human user"],["aud","https://api.example.com","Audience — the resource server this token is for"],["exp","1774000000","Expiry (epoch)"],["iat","1773996400","Issued-at (epoch)"],["scope","read:reports","Granted scope — may be narrower than requested"],["client_id","svc-report-runner","The authenticated client"],["jti","a1b2c3d4-e5f6-4a7b-8c9d-000000000001","Unique token id (replay tracking)"]]},"devtools":"Confirm the granted <b>scope<\/b> — it can be narrower than requested, and the client must check. Note <b>sub == client_id<\/b>: the workload is both caller and subject. Some ASes issue <i>opaque<\/i> access tokens instead, which carry no readable claims and are validated at the <code>/introspect<\/code> endpoint."},{"from":"Client","to":"API","label":"Call the API with the token","hop":"Client → API","lede":"The client calls the resource server, presenting the access token as a Bearer credential.","req":{"method":"GET","url":"https://api.example.com/v1/reports","headers":[["authorization","Bearer eyJhbGciOiJSUzI1Ni….SIG"],["accept","application/json"]]},"devtools":"Also back-channel. The API validates the token before returning data: signature via the IdP JWKS (or <code>/introspect<\/code> for opaque tokens), then <b>iss<\/b>, <b>aud<\/b> (itself), <b>exp<\/b>, and the required <b>scope<\/b>."},{"from":"API","to":"Client","label":"Resource returned","hop":"API → Client","lede":"The token checks out, so the API returns the data.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"reports\": [ { \"id\": \"r-001\", \"status\": \"ready\" } ] }"},"devtools":"On an <i>expired<\/i> token the API returns <b>401<\/b> with <code>WWW-Authenticate: Bearer error=\"invalid_token\"<\/code>. The client then refetches a token (previous step) and retries once."},{"from":"Client","to":"Client","label":"Cache the token until near expiry","hop":"Client (local)","lede":"The client caches the access token and reuses it across calls until it is close to expiring, rather than fetching a new one per request.","devtools":"There is no refresh token in this grant — when the access token expires the client simply repeats the <b>/token<\/b> request. Bad credentials return <b>401<\/b> <code>invalid_client<\/code>; an unauthorized scope returns <b>400<\/b> <code>invalid_scope<\/code>."}]},"oidc-device-authorization":{"title":"OIDC Device Authorization Grant (RFC 8628)","subtitle":"How a smart TV or CLI signs you in: it polls the token endpoint on a back channel while you approve on your phone. The device calls are invisible in a browser; the approval is not.","category":"OIDC","steps":[{"from":"User","to":"Client","label":"Start sign-in on the device","hop":"User → Client","lede":"The user starts sign-in on a constrained device (smart TV or CLI) that has no browser and no easy keyboard. The device will drive the flow over a back channel.","devtools":"The device’s calls are <b>not in any browser<\/b> — inspect them with a proxy (mitmproxy / Charles) or the device/CLI’s own logs. Only the approval on your <i>phone<\/i> is a normal browser flow you can watch in DevTools."},{"from":"Client","to":"IdP","label":"Device authorization request","hop":"Client → IdP","lede":"The device posts its client_id and scope to the device-authorization endpoint. The IdP returns a high-entropy device_code (stays on the device↔IdP channel) and a short human-readable user_code.","req":{"method":"POST","url":"https://idp.example.com/device_authorization","headers":[["content-type","application/x-www-form-urlencoded"]],"form":[["client_id","tv-device-app-01"],["scope","openid profile"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"device_code\": \"dc_synthetic_GmRhmhcxhwAZ\",\n  \"user_code\": \"WDJB-MJHT\",\n  \"verification_uri\": \"https://idp.example.com/activate\",\n  \"verification_uri_complete\": \"https://idp.example.com/activate?user_code=WDJB-MJHT\",\n  \"expires_in\": 900,\n  \"interval\": 5\n}"},"devtools":"Back-channel (the engine flags it). Read <b>interval<\/b> (minimum seconds between polls) and <b>expires_in<\/b> (how long the codes live). <b>device_code<\/b> is high-entropy and never shown to the human; <b>user_code<\/b> is the short code they type."},{"from":"Client","to":"User","label":"Display the code and URL","hop":"Client (local)","lede":"The device shows the user_code and verification_uri on screen — often with a QR of verification_uri_complete so a phone scan skips manual entry.","codeTitle":"Shown on the TV / CLI","code":"To sign in, visit:  https://idp.example.com/activate\nand enter code:     WDJB-MJHT\n\n(or scan the QR — it opens\n https://idp.example.com/activate?user_code=WDJB-MJHT )","devtools":"Not a network event. The QR encodes <b>verification_uri_complete<\/b>, which carries the <b>user_code<\/b> in its query string so the user does not have to type it."},{"from":"Browser","to":"IdP","label":"Open the verification page","hop":"Phone → IdP","vis":"browser","lede":"On a second device, the user opens the verification_uri. If they scanned the QR, the user_code arrives in the query string; if they typed it, it arrives in the following form POST.","req":{"method":"GET","url":"https://idp.example.com/activate","q":[["user_code","WDJB-MJHT"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"],["set-cookie","idp_session=…; HttpOnly; Secure; SameSite=Lax"]]},"devtools":"This is the part you <i>can<\/i> watch. In the phone’s DevTools → Network, filter <b>activate<\/b>. In <b>Query String Parameters<\/b> you’ll see <b>user_code<\/b> when the QR was used; if typed, it’s in the subsequent POST body instead. The IdP sets its <b>idp_session<\/b> cookie here."},{"from":"Browser","to":"IdP","label":"Authenticate and approve","hop":"Phone → IdP","vis":"browser","lede":"The user logs in at the IdP and approves the device — the consent screen shows the client name and requested scopes. The IdP then marks the device_code as authorized.","req":{"method":"POST","url":"https://idp.example.com/activate","headers":[["content-type","application/x-www-form-urlencoded"]],"form":[["user_code","WDJB-MJHT"],["action","approve"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"]]},"devtools":"Confirm the consent screen names the <b>real client<\/b> and the scopes before approving. The response is typically a “you can return to your device” page. Approving here is what flips the device’s next poll from pending to success."},{"from":"Client","to":"IdP","label":"Poll /token — still pending","hop":"Client → IdP","lede":"Meanwhile the device polls the token endpoint every interval seconds with grant_type=device_code. Until the user approves, the IdP answers 400 authorization_pending.","req":{"method":"POST","url":"https://idp.example.com/token","headers":[["content-type","application/x-www-form-urlencoded"]],"form":[["grant_type","urn:ietf:params:oauth:grant-type:device_code"],["device_code","dc_synthetic_GmRhmhcxhwAZ"],["client_id","tv-device-app-01"]]},"resp":{"status":400,"statusText":"Bad Request","headers":[["content-type","application/json"]],"json":"{ \"error\": \"authorization_pending\" }"},"devtools":"Back-channel polling. The device must honor <b>interval<\/b>; if it polls too fast the IdP returns <code>slow_down<\/code> and the device adds 5s (RFC 8628 §3.5). Other terminal errors: <code>expired_token<\/code> (codes timed out) and <code>access_denied<\/code> (user declined)."},{"from":"IdP","to":"Client","label":"Poll /token — tokens issued","hop":"Client → IdP","lede":"Once the user has approved on the phone, the next poll succeeds: the IdP returns an access token, an ID token, and a refresh token.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"at_synthetic_dev_55667788\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"scope\": \"openid profile\",\n  \"refresh_token\": \"rt_synthetic_D1_0000\",\n  \"id_token\": \"eyJhbGciOiJSUzI1Ni….eyJpc3Mi….SIG\"\n}"},"jwt":{"title":"Decoded id_token","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"idp-2026-07-key1\" }","payload":[["iss","https://idp.example.com","Issuer — the authorization server"],["sub","248289761001","Stable opaque user id (the account approved on the phone)"],["aud","tv-device-app-01","Audience — must equal the device client_id"],["exp","1774000000","Expiry (epoch)"],["iat","1773996400","Issued-at (epoch)"],["auth_time","1773996380","When the user authenticated on the secondary device"],["name","Ada Lovelace","Profile claim (synthetic)"],["email","ada.lovelace@example.com","Profile claim (synthetic)"],["email_verified","true","Address verified by the IdP"]]},"devtools":"There is <b>no nonce<\/b> here — the device flow has no front-channel /authorize to carry one; binding is via the <b>device_code<\/b> on the back channel. Validate the signature (JWKS via <code>kid<\/code>), then <b>iss<\/b>, <b>aud == client_id<\/b>, and <b>exp<\/b>."},{"from":"Client","to":"User","label":"Signed in","hop":"Client (local)","lede":"The device establishes its session from the validated tokens and shows the authenticated UI. It can later use the refresh_token to renew silently.","devtools":"Nothing further on the wire. The whole exchange bound a browser login on one device to a session on another, without the constrained device ever handling the user’s password."}]},"oidc-dpop":{"title":"OIDC DPoP — Demonstrating Proof of Possession","subtitle":"Bind the access token to a key the client holds, so a stolen token is useless without a matching per-request proof JWT (RFC 9449).","category":"OIDC","steps":[{"from":"App","to":"App","label":"Generate key pair + build token proof","hop":"App (local)","lede":"The public client generates a DPoP key pair (the private key never leaves the app) and builds a proof JWT for the token request: header carries the public jwk and typ dpop+jwt, payload binds the HTTP method and URL.","jwt":{"title":"DPoP proof for POST /token","header":"{ \"typ\": \"dpop+jwt\", \"alg\": \"ES256\", \"jwk\": { \"kty\": \"EC\", \"crv\": \"P-256\", \"x\": \"l8tFrhx-34tV3hRICRDY9zCkDlpBhF42UQUfWVAWBFs\", \"y\": \"9VE4jf_Ok_o64zbTTlcuNJajHmt6v9TDVrU0CdvGRDA\" } }","payload":[["jti","proof-e1b2c3d4","Unique id — server tracks it to block replay"],["htm","POST","Must equal the request method"],["htu","https://as.example.com/token","Must equal the request URI (no query)"],["iat","1774000000","Issued-at — tight freshness window; no ath yet"]]},"devtools":"Not a network event. The <b>jwk<\/b> in the header is the PUBLIC key only — the AS will hash it to derive the binding thumbprint. There is <b>no ath<\/b> claim here: there's no access token to hash yet."},{"from":"App","to":"IdP","label":"POST /token with DPoP proof","hop":"App → IdP","vis":"browser","lede":"The client redeems its authorization code (PKCE underneath) and attaches the proof in the DPoP request header. The AS verifies the proof and computes the key thumbprint.","req":{"method":"POST","url":"https://as.example.com/token","headers":[["content-type","application/x-www-form-urlencoded"],["dpop","eyJ0eXAiOiJkcG9wK2p3dCIsImFsZyI6IkVTMjU2Iiwiandr… (proof from step 1)"]],"form":[["grant_type","authorization_code"],["code","SplxlOBeZQQYbYS6WxSbIA"],["redirect_uri","https://app.example.com/cb"],["code_verifier","dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"]]},"devtools":"In the Network tab, filter on <code>/token<\/code> and read the <b>DPoP<\/b> request header. Split it on <code>.<\/code> and base64url-decode header + payload: confirm <code>typ=dpop+jwt<\/code>, an asymmetric <code>alg<\/code> (ES256), the <code>jwk<\/code>, and <code>htm=POST<\/code> / <code>htu<\/code> matching this request."},{"from":"IdP","to":"App","label":"200 DPoP-bound token","hop":"IdP → App","vis":"browser","lede":"The AS returns token_type DPoP (not Bearer) and binds the access token to the proof's key via cnf.jkt — the SHA-256 thumbprint of the jwk.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"mF_9.B5f-4.1JqM\",\n  \"token_type\": \"DPoP\",\n  \"expires_in\": 3600,\n  \"scope\": \"read:orders\"\n}"},"devtools":"<b>token_type is DPoP<\/b>, not Bearer — the client must present it with the DPoP scheme from now on. The token is bound via <code>cnf.jkt = \"0ZcOCORZNYy-DWpqq30jZyJGHTN0d2HglBV3uiguA4I\"<\/code>, the SHA-256 thumbprint of the step-1 <code>jwk<\/code>. For an opaque token you'd see <code>jkt<\/code> via introspection; for a JWT AT it's in the payload's <code>cnf<\/code>."},{"from":"App","to":"App","label":"Build resource proof with ath","hop":"App (local)","lede":"For the API call the client builds a NEW proof — same key, but a fresh jti and iat, htm/htu for the resource, and an ath claim that hashes the access token.","jwt":{"title":"DPoP proof for GET /resource","header":"{ \"typ\": \"dpop+jwt\", \"alg\": \"ES256\", \"jwk\": { \"kty\": \"EC\", \"crv\": \"P-256\", \"x\": \"l8tFrhx-34tV3hRICRDY9zCkDlpBhF42UQUfWVAWBFs\", \"y\": \"9VE4jf_Ok_o64zbTTlcuNJajHmt6v9TDVrU0CdvGRDA\" } }","payload":[["jti","proof-a9f8e7d6","DIFFERENT jti from the token-endpoint proof"],["htm","GET","Matches the resource request method"],["htu","https://api.example.com/resource","Matches the resource URI"],["iat","1774000100","Fresh issued-at"],["ath","fUHyO2r2Z3DZ53EsNrWBb0xWXoaNy59IiKCAqksmQEo","base64url(SHA-256(access_token))"]]},"devtools":"Verify <b>ath<\/b> by hand: <code>printf %s \"mF_9.B5f-4.1JqM\" | openssl dgst -binary -sha256 | basenc --base64url<\/code> and compare. The <b>jti<\/b> must be new — never reuse the step-1 value."},{"from":"App","to":"API","label":"GET /resource with DPoP scheme + proof","hop":"App → API","vis":"browser","lede":"The client calls the API presenting the token with the DPoP auth scheme (not Bearer) and the fresh proof. The API verifies everything in one shot.","req":{"method":"GET","url":"https://api.example.com/resource","headers":[["authorization","DPoP mF_9.B5f-4.1JqM"],["dpop","eyJ0eXAiOiJkcG9wK2p3dCIsImFsZyI6IkVTMjU2Iiwiandr… (proof from step 4)"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"orderId\": \"ord-1001\", \"status\": \"shipped\" }"},"devtools":"Note the <b>DPoP<\/b> auth scheme, not <code>Bearer<\/code>. The API verifies: (1) proof signature against the embedded <code>jwk<\/code>, (2) <code>jkt(jwk)<\/code> == the token's <code>cnf.jkt<\/code>, (3) <code>ath<\/code> == hash(token), (4) <code>htm<\/code>/<code>htu<\/code> match, (5) <code>jti<\/code> fresh. A bound token replayed as plain <code>Bearer<\/code>, or a proof signed by a different key, fails checks 1/2 → <code>401 invalid_token<\/code>."},{"from":"App","to":"IdP","label":"Nonce challenge → retry","hop":"App → IdP","vis":"browser","lede":"When the server requires a DPoP nonce, a proof without one is rejected 400 use_dpop_nonce with a DPoP-Nonce header. The client copies that value into a nonce claim on a rebuilt proof and retries, which then succeeds.","resp":{"status":400,"statusText":"Bad Request","headers":[["content-type","application/json"],["dpop-nonce","eyJ7S_zG.ewauwAF.n-0S6"]],"json":"{ \"error\": \"use_dpop_nonce\" }"},"devtools":"Read the <b>DPoP-Nonce<\/b> response header (<code>WWW-Authenticate: DPoP …<\/code> at the resource server). Add it as a <code>nonce<\/code> claim to the next proof and retry — you'll see the failed attempt immediately followed by a 200. This closes the pre-generated-proof gap. A reused <b>jti<\/b> within the server's window also yields <code>401 invalid_token<\/code>."}]},"oidc-dynamic-client-registration":{"title":"OIDC Dynamic Client Registration (RFC 7591 / 7592)","subtitle":"A client registers itself with the authorization server over a JSON API, receiving a client_id, optional secret, and management handles — then reads and updates its own record.","category":"OIDC","steps":[{"from":"Client","to":"Client","label":"Build client_metadata","hop":"Client (local)","lede":"The AS advertises a registration_endpoint in its metadata. The client assembles the client_metadata document it wants: redirect URIs, grant types, response types, and how it will authenticate at the token endpoint.","codeTitle":"client_metadata to register","code":"{\n  \"client_name\": \"Synthetic Sample App\",\n  \"redirect_uris\": [\"https://client.example.com/cb\"],\n  \"grant_types\": [\"authorization_code\", \"refresh_token\"],\n  \"response_types\": [\"code\"],\n  \"token_endpoint_auth_method\": \"client_secret_basic\",\n  \"scope\": \"openid profile\"\n}","devtools":"DCR is a plain back-channel JSON API — every request and response is directly readable. The interesting part is what metadata you ask for here versus what credentials the AS hands back."},{"from":"Client","to":"IdP","label":"POST /register","hop":"Client → IdP","lede":"The client posts the metadata document as JSON. For protected registration it would also send an Authorization: Bearer <initial access token> and/or a signed software_statement JWT in the body.","req":{"method":"POST","url":"https://as.example.com/register","headers":[["host","as.example.com"],["content-type","application/json"]],"json":"{\n  \"client_name\": \"Synthetic Sample App\",\n  \"redirect_uris\": [\"https://client.example.com/cb\"],\n  \"grant_types\": [\"authorization_code\", \"refresh_token\"],\n  \"response_types\": [\"code\"],\n  \"token_endpoint_auth_method\": \"client_secret_basic\",\n  \"scope\": \"openid profile\"\n}"},"devtools":"Content-Type is <code>application/json<\/code>. Inspect the body's <b>redirect_uris<\/b>, <b>grant_types<\/b>, <b>response_types<\/b>, and <b>token_endpoint_auth_method<\/b>. For protected registration, note the <code>Authorization: Bearer<\/code> header and/or a <code>software_statement<\/code> JWT inside the JSON."},{"from":"IdP","to":"IdP","label":"Validate metadata","hop":"IdP (local)","lede":"The AS validates the requested redirect_uris (must be https), grant_types, and scope. For protected registration it also verifies the software_statement's signature against the trusted directory's keys — its claims then override the plain JSON.","devtools":"If a <code>software_statement<\/code> was sent, split it on <code>.<\/code> and base64url-decode the payload. Its asserted claims (<code>redirect_uris<\/code>, <code>software_id<\/code>, <code>token_endpoint_auth_method<\/code>) override the client-supplied JSON — but only after the AS verifies the signature."},{"from":"IdP","to":"Client","label":"201 Created — credentials + handles","hop":"IdP → Client","lede":"The AS assigns a client_id (and a client_secret for confidential auth methods), plus two management handles: a high-value registration_access_token and the per-client registration_client_uri.","resp":{"status":201,"statusText":"Created","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"client_id\": \"s6bhdrkqt3\",\n  \"client_secret\": \"SYNTH_cGE5c2VjcmV0X2RvX25vdF91c2U\",\n  \"client_id_issued_at\": 1774000000,\n  \"client_secret_expires_at\": 1805536000,\n  \"registration_access_token\": \"SYNTH_reg_at_2Yotnf9Xz_do_not_use\",\n  \"registration_client_uri\": \"https://as.example.com/register/s6bhdrkqt3\",\n  \"redirect_uris\": [\"https://client.example.com/cb\"],\n  \"grant_types\": [\"authorization_code\", \"refresh_token\"],\n  \"token_endpoint_auth_method\": \"client_secret_basic\"\n}"},"devtools":"The response is the most important thing to read. <b>client_secret<\/b> appears only for confidential auth methods — treat it as a secret. The <b>registration_access_token<\/b> is a long-lived, high-value bearer credential that can later rewrite <code>redirect_uris<\/code> — guard it. <b>registration_client_uri<\/b> is the per-client RFC 7592 management URL."},{"from":"Client","to":"IdP","label":"GET registration_client_uri (RFC 7592)","hop":"Client → IdP","lede":"The client reads its own record back, authenticating with the registration_access_token. The AS returns the current metadata.","req":{"method":"GET","url":"https://as.example.com/register/s6bhdrkqt3","headers":[["host","as.example.com"],["authorization","Bearer SYNTH_reg_at_2Yotnf9Xz_do_not_use"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{\n  \"client_id\": \"s6bhdrkqt3\",\n  \"client_name\": \"Synthetic Sample App\",\n  \"redirect_uris\": [\"https://client.example.com/cb\"],\n  \"grant_types\": [\"authorization_code\", \"refresh_token\"],\n  \"token_endpoint_auth_method\": \"client_secret_basic\"\n}"},"devtools":"The GET carries <code>Authorization: Bearer &lt;registration_access_token&gt;<\/code>. A <b>PUT<\/b> to the same URI updates the record (full metadata in the body) and the 200 may return a <b>rotated<\/b> registration_access_token — if so, the old one is now dead. A <b>DELETE<\/b> deregisters and returns <b>204 No Content<\/b>."},{"from":"Client","to":"IdP","label":"Invalid metadata → 400","hop":"Client → IdP","lede":"A registration whose redirect_uri fails policy — here a non-https URI — is rejected. The AS never issues a client for metadata it will not honor.","req":{"method":"POST","url":"https://as.example.com/register","headers":[["host","as.example.com"],["content-type","application/json"]],"json":"{ \"redirect_uris\": [\"http://evil.example/inject\"] }"},"resp":{"status":400,"statusText":"Bad Request","headers":[["content-type","application/json"]],"json":"{\n  \"error\": \"invalid_redirect_uri\",\n  \"error_description\": \"redirect_uri must be https\"\n}"},"devtools":"A <b>400<\/b> with <code>{\"error\":\"invalid_redirect_uri\"}<\/code> (or <code>invalid_client_metadata<\/code>) means the AS rejected the requested metadata. On a 7592 management call, a missing / stale / stolen <b>registration_access_token<\/b> instead returns <b>401 Unauthorized<\/b>."}]},"oidc-front-channel-logout":{"title":"OIDC Front-Channel Logout","subtitle":"The IdP loads one hidden iframe per app so each clears its own session — fully browser-visible, but best-effort and easily partial on modern browsers.","category":"OIDC","steps":[{"from":"User","to":"Browser","label":"Logout already initiated","hop":"User → Browser","lede":"A logout has begun — typically RP-Initiated Logout reached the IdP’s end_session_endpoint. The IdP now needs to propagate it to every app in the SSO session.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b> (the logout page navigates away). Unlike back-channel logout, <b>every step here is browser-visible<\/b> — that is the whole point of the front channel."},{"from":"IdP","to":"Browser","label":"Logout page with hidden iframes","hop":"IdP → Browser","vis":"browser","lede":"The IdP terminates the SSO session and returns an HTML page containing one hidden <iframe> per RP that joined it — each pointing at that RP’s frontchannel_logout_uri.","req":{"method":"GET","url":"https://idp.example.com/end_session","q":[["id_token_hint","eyJhbGciOiJSUzI1NiJ9.eyJzdWIi….SIG_synthetic"],["post_logout_redirect_uri","https://rp1.example.com/loggedout"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"],["set-cookie","idp_session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=None"]],"json":"<!doctype html><title>Logging out<\/title>\n<iframe hidden src=\"https://rp1.example.com/frontchannel-logout?iss=https://idp.example.com&sid=abc123session\"><\/iframe>\n<iframe hidden src=\"https://rp2.example.com/frontchannel-logout?iss=https://idp.example.com&sid=abc123session\"><\/iframe>"},"devtools":"Filter on <b>end_session<\/b>. Open the <b>Response<\/b> tab and read the HTML — its body lists one hidden <code>&lt;iframe&gt;<\/code> per RP. Those <code>src<\/code> URLs are what the browser fetches next."},{"from":"Browser","to":"App","label":"RP1 iframe fires — cookie present","hop":"Browser → App","vis":"browser","lede":"The browser loads RP1’s logout iframe. Its own session cookie rides along, so RP1 can validate iss/sid and clear the session — a clean logout.","req":{"method":"GET","url":"https://rp1.example.com/frontchannel-logout","q":[["iss","https://idp.example.com"],["sid","abc123session"]],"headers":[["cookie","rp1_session=SYNTHETIC-rp1-session"],["sec-fetch-dest","iframe"]]},"resp":{"status":200,"statusText":"OK","headers":[["cache-control","no-store"],["set-cookie","rp1_session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax"]]},"devtools":"Filter on <b>frontchannel-logout<\/b>. Check the <b>Request Cookies<\/b> — <b>rp1_session<\/b> was sent — and the <b>Response<\/b> <b>Set-Cookie<\/b> clears it (<code>Max-Age=0<\/code>). Cookie sent + cookie cleared = that RP is logged out. The <b>sid<\/b> query param must match the <b>sid<\/b> claim from that RP’s ID token."},{"from":"Browser","to":"App","label":"RP2 iframe fires — cookie blocked","hop":"Browser → App","vis":"browser","lede":"RP2’s iframe loads too, but as a third-party frame the browser partitions/blocks its cookie. With no session cookie visible, RP2 has nothing to clear — a partial logout.","req":{"method":"GET","url":"https://rp2.example.com/frontchannel-logout","q":[["iss","https://idp.example.com"],["sid","abc123session"]],"headers":[["sec-fetch-dest","iframe"]]},"resp":{"status":200,"statusText":"OK","headers":[["cache-control","no-store"]]},"devtools":"Same filter. Here the <b>Request Cookies<\/b> are <i>empty<\/i> — <b>rp2_session<\/b> was partitioned/dropped — and there is <b>no Set-Cookie<\/b> in the response. The frame returned <code>200<\/code> but nothing was cleared: <b>partial logout<\/b>, and RP2’s session survives. This is the expected outcome on current browsers."},{"from":"Browser","to":"App","label":"Return to post_logout_redirect_uri","hop":"Browser → App","vis":"browser","lede":"After a fixed timeout the IdP proceeds to the RP’s post_logout_redirect_uri. This return leg fires regardless of whether the frames succeeded — there is no acknowledgement channel.","req":{"method":"GET","url":"https://rp1.example.com/loggedout"},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html"]],"json":"<!doctype html><title>Logged out<\/title>Best effort complete."},"devtools":"Filter on <b>loggedout<\/b>. A <code>200<\/code> here does <b>not<\/b> confirm every RP was logged out — front-channel logout is best-effort. Also watch the <b>Console<\/b>: an RP that sends <code>X-Frame-Options: DENY<\/code> or a restrictive <code>frame-ancestors<\/code> CSP produces a “Refused to display in a frame” error, and the IdP gets no signal either way."},{"from":"Browser","to":"User","label":"“Logged out everywhere” (best effort)","hop":"Browser → User","lede":"The user sees a logged-out confirmation. But as the RP2 frame showed, that message is optimistic — a partitioned cookie means at least one app’s session may still be alive.","devtools":"Conclusion from the capture: <b>frame 200 + cookie sent + cookie cleared<\/b> → logged out; <b>frame 200 + cookie missing<\/b> → partial logout. Where reliability matters, pair or replace this with <i>back-channel logout<\/i>, whose server-to-server delivery does not depend on third-party cookies."}]},"oidc-hybrid":{"title":"OIDC Hybrid Flow (code id_token)","subtitle":"The IdP returns a code AND a front-channel ID token at once — the id_token’s c_hash binds the code so a stolen/substituted code can’t be redeemed.","category":"OIDC","steps":[{"from":"User","to":"App","label":"Visit a protected page","hop":"User → App","lede":"The user hits a protected page in a web app (the RP). The app stores state and nonce, then bounces to the IdP asking for both a code and a front-channel ID token.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b> (the authorize redirect navigates away). Hybrid’s tell is <code>response_type=code id_token<\/code>: you get an ID token in the front channel <i>and<\/i> a code to redeem in the back channel."},{"from":"App","to":"IdP","label":"Redirect to /authorize (form_post)","hop":"Browser → IdP","vis":"browser","lede":"The browser is redirected to the authorization endpoint. nonce is mandatory for hybrid. With response_mode=form_post the IdP returns an HTML page that auto-submits code + id_token + state to the callback.","req":{"method":"GET","url":"https://idp.example.com/authorize","q":[["response_type","code id_token"],["client_id","s6BhdRkqt3"],["redirect_uri","https://rp.example.com/cb"],["scope","openid email"],["state","abc"],["nonce","n-xyz-hybrid-77"],["response_mode","form_post"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"],["cache-control","no-store"]],"json":"<!doctype html>\n<form method=post action=\"https://rp.example.com/cb\">\n  <input name=code value=\"SplxlOBeZQQYbYS6WxSbIA\">\n  <input name=id_token value=\"eyJ…front…\">\n  <input name=state value=\"abc\">\n<\/form>\n<script>document.forms[0].submit()<\/script>"},"devtools":"Filter on <b>authorize<\/b>. Confirm <b>response_type=code id_token<\/b>, <b>state<\/b>, and the mandatory <b>nonce<\/b>. If <b>response_mode=form_post<\/b>, the response is an auto-submitting HTML form (below) rather than a fragment redirect — much easier to read."},{"from":"Browser","to":"App","label":"form_post delivers code + front-channel id_token","hop":"Browser → App","vis":"browser","lede":"The auto-submitted form POSTs code, the front-channel id_token, and state to the RP callback. The RP verifies state, validates the id_token, then confirms c_hash binds this exact code.","req":{"method":"POST","url":"https://rp.example.com/cb","headers":[["content-type","application/x-www-form-urlencoded"]],"form":[["code","SplxlOBeZQQYbYS6WxSbIA"],["id_token","eyJhbGciOiJSUzI1Ni….eyJpc3Mi…cf9oYXNo….SIG_synthetic"],["state","abc"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html"],["set-cookie","rp_session=SYNTHETIC-new-rp-session; Path=/; Secure; HttpOnly; SameSite=Lax"]]},"jwt":{"title":"Decoded front-channel id_token (carries c_hash)","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"idp-key-2026\" }","payload":[["iss","https://idp.example.com","Issuer — must equal your IdP"],["sub","248289761001","Stable user identifier"],["aud","s6BhdRkqt3","Audience — must equal your client_id"],["exp","1774003600","Expiry (epoch)"],["nonce","n-xyz-hybrid-77","Must equal the nonce you sent — replay binding"],["c_hash","LDktKdoQak3Pk0cnXxCltA","base64url(left-half(SHA-256(code))) — binds the code"],["s_hash","aGciOiJSUzI1","State hash (when present) — binds state"],["acr","1","Authentication context class"]]},"devtools":"Filter on <b>cb<\/b>. Read the <b>Form Data<\/b>: <b>code<\/b>, <b>id_token<\/b>, <b>state<\/b>. Decode the id_token and confirm <b>nonce<\/b> matches and a <b>c_hash<\/b> claim is present. (In default fragment mode the tokens would be after <code>#<\/code> in the address bar — not sent to the server — with the same leakage caution as implicit.)"},{"from":"App","to":"App","label":"Validate id_token + verify c_hash","hop":"App (local)","lede":"The RP fully validates the front-channel id_token (JWKS signature, iss, aud, exp, nonce), then recomputes base64url(left-half(SHA-256(code))) and compares it to c_hash. A match proves the code wasn’t substituted — the RP can start a session immediately.","codeTitle":"c_hash check (computed at the RP)","code":"digest      = SHA-256(\"SplxlOBeZQQYbYS6WxSbIA\")   # the code\ncomputed    = base64url( digest[0 : len(digest)/2] )  # left half\nassert computed == id_token.c_hash                    # else REJECT, do not redeem\n\n// c_hash is the whole reason to use hybrid: it lets the RP\n// detect an injected/substituted code BEFORE the /token call.","devtools":"Not a network event. A <b>c_hash<\/b> mismatch means code injection/substitution — the RP must reject and <b>never<\/b> redeem the code at <code>/token<\/code>."},{"from":"App","to":"IdP","label":"Redeem code at /token (back-channel)","hop":"App → IdP (server-to-server)","lede":"The RP back end POSTs the code to /token with client authentication and gets back an access token plus a SECOND id_token — this one richer, from the back channel.","req":{"method":"POST","url":"https://idp.example.com/token","headers":[["content-type","application/x-www-form-urlencoded"],["authorization","Basic czZCaGRSa3F0MzpTWU5USEVUSUM="]],"form":[["grant_type","authorization_code"],["code","SplxlOBeZQQYbYS6WxSbIA"],["redirect_uri","https://rp.example.com/cb"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"SlAV32hkKG-synthetic\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"refresh_token\": \"8xLOxBtZp8-synthetic\",\n  \"id_token\": \"eyJhbGciOiJSUzI1Ni….eyJpc3Mi…lbWFpbA….SIG_synthetic\"\n}"},"jwt":{"title":"Decoded back-channel id_token (second token)","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"idp-key-2026\" }","payload":[["iss","https://idp.example.com","MUST equal the front-channel token’s iss"],["sub","248289761001","MUST equal the front-channel token’s sub"],["aud","s6BhdRkqt3","Audience — your client_id"],["iat","1774000005","Issued a few seconds after the front-channel token"],["nonce","n-xyz-hybrid-77","Same nonce"],["email","jordan.rivera@example.com","Richer claims than the front-channel token"],["email_verified","true","Claim from the email scope"]]},"devtools":"<b>Not in the browser<\/b> — this is the RP’s server-to-server call. Capture it on the RP if you need to see it. It returns a second id_token; the RP checks its <b>iss<\/b>/<b>sub<\/b> match the front-channel token."},{"from":"App","to":"App","label":"Cross-token consistency check","hop":"App (local)","lede":"The RP compares the two ID tokens: iss and sub MUST be identical. If they differ, it discards the tokens and restarts authentication.","devtools":"Not a network event. This guards against a mismatched back-channel token being stitched onto a valid front-channel response — a mismatch means discard everything and re-authenticate."},{"from":"App","to":"API","label":"Call the API with the access token","hop":"App → API","lede":"With validated tokens, the RP calls the resource server presenting the access token as a Bearer credential. If the RP calls the API server-side, this is off-browser too.","req":{"method":"GET","url":"https://api.example.com/resource","headers":[["authorization","Bearer SlAV32hkKG-synthetic"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"data\": \"synthetic-resource\" }"},"devtools":"Filter on <b>resource<\/b> — but you’ll only see it here if the <i>browser<\/i> makes the call. A server-side RP performs this from its back end, invisible to DevTools. The resource server validates the Bearer token (JWKS, <b>iss<\/b>, <b>aud<\/b>, <b>exp<\/b>, scopes) before returning data."}]},"oidc-implicit":{"title":"OIDC Implicit Flow","subtitle":"DEPRECATED — kept for recognizing and migrating legacy integrations. The IdP returns tokens directly in the URL fragment with no code exchange and no client authentication; use Authorization Code + PKCE instead.","category":"OIDC","steps":[{"from":"User","to":"App","label":"Open the SPA","hop":"User → App","lede":"The user loads a single-page app. The SPA generates state and nonce, then redirects to the IdP asking for tokens to be returned directly — no back-channel code exchange.","devtools":"<b>⛔ Deprecated flow<\/b> — this walkthrough is for auditing legacy implicit integrations; new work should use Authorization Code + PKCE. Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b> (the authorize response redirects). The tell is <code>response_type=id_token token<\/code>."},{"from":"App","to":"IdP","label":"Redirect to /authorize","hop":"Browser → IdP","vis":"browser","lede":"The browser is redirected to the authorization endpoint requesting id_token token. nonce is required — in implicit it is the ONLY replay defense. The IdP returns the tokens in the redirect URL fragment.","req":{"method":"GET","url":"https://idp.example.com/authorize","q":[["response_type","id_token token"],["client_id","s6BhdRkqt3"],["redirect_uri","https://spa.example.com/callback"],["scope","openid profile"],["state","abc"],["nonce","n-xyz-implicit-42"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://spa.example.com/callback#id_token=eyJ…&access_token=SlAV32hkKG-synthetic&token_type=Bearer&expires_in=3600&state=abc"]]},"devtools":"Filter on <b>authorize<\/b>. Confirm <b>response_type=id_token token<\/b>, <b>state<\/b>, and the required <b>nonce<\/b>. The <b>302<\/b> <b>Location<\/b> carries the tokens after <code>#<\/code> — the fragment. Note there is <i>no<\/i> <code>/token<\/code> call and <i>no<\/i> client authentication anywhere in this flow."},{"from":"Browser","to":"App","label":"Callback loads — fragment NOT sent to server","hop":"Browser → App","vis":"browser","lede":"The callback page loads. Critically, the browser does NOT send the fragment to the server, so this request carries no token data. The SPA reads the tokens from location.hash in JavaScript instead.","req":{"method":"GET","url":"https://spa.example.com/callback"},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html"]],"json":"<!doctype html><title>SPA<\/title><script src=app.js><\/script>"},"jwt":{"title":"Decoded id_token (carries at_hash)","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"idp-key-2026\" }","payload":[["iss","https://idp.example.com","Issuer"],["sub","248289761001","Subject"],["aud","s6BhdRkqt3","This SPA’s client_id"],["exp","1774003600","Expiry (epoch)"],["auth_time","1773999900","When the user authenticated"],["nonce","n-xyz-implicit-42","Must match — the ONLY replay defense in implicit"],["at_hash","x7vk3Qb2mN9pLwErTyUiOA","base64url(left-half(SHA-256(access_token))) — binds the access token"]]},"devtools":"The callback <b>request<\/b> shows <b>no<\/b> token data — the fragment never reached the server. Read the tokens from the <b>address bar<\/b>, the authorize row’s <b>Location<\/b> header, or <code>location.hash<\/code> in the <b>Console<\/b>. That any script can read <code>location.hash<\/code> is exactly the leakage problem. Decode the id_token and confirm <b>nonce<\/b> matches and <b>at_hash<\/b> is present."},{"from":"App","to":"App","label":"Verify state, validate id_token + at_hash","hop":"App (local)","lede":"The SPA parses the fragment, strips it from the URL, verifies state, and fully validates the id_token (JWKS signature, iss, aud, exp, nonce). It also checks at_hash to bind the access token that arrived alongside it.","devtools":"Not a network event. With no back-channel exchange, <b>nonce<\/b> is the only replay protection and <b>at_hash<\/b> is the only binding between the ID token and the access token. A <b>nonce<\/b> mismatch means a replayed/injected id_token — reject."},{"from":"App","to":"API","label":"Call the API with the access token","hop":"Browser → API","vis":"browser","lede":"The SPA calls the resource server with the access token it parsed from the fragment — the same value that sat in the URL. There is no sender constraint: anyone who read the fragment can replay this exact header.","req":{"method":"GET","url":"https://api.example.com/resource","headers":[["authorization","Bearer SlAV32hkKG-synthetic"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"data\": \"synthetic-resource\" }"},"devtools":"Filter on <b>resource<\/b>. The <b>Authorization: Bearer<\/b> header is the same token that was in the URL fragment. It is a pure bearer credential — no sender constraint — so an attacker who obtained the fragment (history sync, injected script, leaked link) can replay it and the API cannot tell them apart."},{"from":"App","to":"App","label":"Why this flow is deprecated","hop":"App (local)","lede":"Tokens in the URL, no /token call, no client authentication: whoever obtains the fragment can replay the access token, and there is no in-protocol mitigation. This is what deprecated implicit.","devtools":"The fragmen
