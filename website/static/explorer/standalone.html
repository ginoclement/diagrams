t lands in browser history, is exposed to any injected script via <code>location.hash<\/code>, and can leak via referrer edge cases. Theft is undetectable because the token has no sender constraint. <b>The fix is not a patch — migrate to Authorization Code + PKCE.<\/b>"},{"from":"App","to":"IdP","label":"Silent renewal (no refresh token)","hop":"Browser → IdP","vis":"browser","lede":"Implicit issues no refresh token, so renewal happens only via a hidden iframe re-running /authorize with prompt=none. Under blocked third-party cookies this returns error=login_required, forcing a full interactive redirect.","req":{"method":"GET","url":"https://idp.example.com/authorize","q":[["response_type","id_token token"],["client_id","s6BhdRkqt3"],["prompt","none"],["state","abc"],["nonce","n-renew-88"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://spa.example.com/callback#error=login_required&state=abc"]]},"devtools":"Filter on <b>authorize<\/b> again — a hidden iframe with <b>prompt=none<\/b>. On modern browsers that block third-party cookies the response fragment carries <code>#error=login_required<\/code>, so the SPA must fall back to a full interactive redirect. This renewal fragility is another reason implicit is hard to keep alive."}]},"oidc-jar-jarm":{"title":"OIDC JAR / JARM — Signed Requests & Responses","subtitle":"The authorization request is a signed JWT (JAR) and the authorization response comes back as a signed JWT (JARM) — integrity-protecting both legs against tampering and mix-up.","category":"OIDC","steps":[{"from":"Client","to":"Client","label":"Build & sign the request object","hop":"Client (local)","lede":"The client packs the authorization parameters — response_type, redirect_uri, scope, state, nonce, PKCE challenge, response_mode:jwt — into a JWT and signs it with its own key. This is the JAR request object.","codeTitle":"Request object payload (before signing)","code":"{\n  \"iss\": \"s6bhdrkqt3\",\n  \"aud\": \"https://as.example.com\",\n  \"response_type\": \"code\",\n  \"client_id\": \"s6bhdrkqt3\",\n  \"redirect_uri\": \"https://client.example.com/cb\",\n  \"scope\": \"openid profile\",\n  \"state\": \"af0ifjsldkj\",\n  \"nonce\": \"n-0S6_WzA2Mj\",\n  \"code_challenge\": \"K2-ltc83acc4h0c9w6ESC_rEMTJ3bwc-uCHaoeK1t8U\",\n  \"code_challenge_method\": \"S256\",\n  \"response_mode\": \"jwt\",\n  \"exp\": 1774000300,\n  \"iat\": 1774000000\n}","devtools":"The header marks the JWT with <code>typ: \"oauth-authz-req+jwt\"<\/code>. <b>response_mode: \"jwt\"<\/b> is what asks the AS to answer with a JARM response. The PKCE <code>code_challenge<\/code> travels inside the signed object, so it too is tamper-proof."},{"from":"Client","to":"IdP","label":"GET /authorize?request=eyJ… (JAR by value)","hop":"Browser → IdP","vis":"browser","lede":"The browser is sent to the authorization endpoint. Most parameters are gone from the query string — only client_id, response_type, and the big request JWT remain. (By reference, this would be a request_uri= instead.)","req":{"method":"GET","url":"https://as.example.com/authorize","q":[["client_id","s6bhdrkqt3"],["response_type","code"],["request","eyJhbGciOiJSUzI1NiIsInR5cCI6Im9hdXRoLWF1dGh6LXJlcStqd3QiLCJraWQiOiJjbGllbnQtc2lnLTEifQ.eyJpc3Mi…payload….c0ffee_SYNTHETIC_SIGNATURE_NOT_REAL"]]},"devtools":"In the Query String most params are <b>missing<\/b> — you see only <code>client_id<\/code>, <code>response_type<\/code>, and <code>request=eyJ…<\/code> (JAR by value) or <code>request_uri=https://…<\/code> (JAR by reference). Copy the <b>request<\/b> JWT, split on <code>.<\/code>, base64url-decode the payload to reveal the real <code>redirect_uri<\/code>, <code>scope<\/code>, <code>state<\/code>, <code>nonce<\/code>, and <code>code_challenge<\/code>."},{"from":"IdP","to":"IdP","label":"Verify request-object signature","hop":"IdP (local)","lede":"The AS fetches the client's registered JWKS, verifies the request object's signature, and uses its claims as the authorization parameters. A tampered object is rejected with error=invalid_request_object.","devtools":"For JAR <b>by reference<\/b> the AS makes a server-to-server GET to the <code>request_uri<\/code> (e.g. <code>https://client.example.com/req/abc123<\/code>) to fetch the signed object — that fetch is <i>not<\/i> visible in the browser, only in a proxy capture. A bad signature surfaces later as a <code>302 …?error=invalid_request_object<\/code>."},{"from":"IdP","to":"User","label":"Login + consent","hop":"IdP → User","vis":"browser","lede":"The IdP authenticates the user (with MFA if required) and gathers consent. Credentials are entered against the IdP, never the client.","resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"],["set-cookie","idp_session=…; HttpOnly; Secure; SameSite=Lax"]]},"devtools":"You will see the IdP's own login HTML and an <b>idp_session<\/b> cookie set with <code>HttpOnly; Secure<\/code>. Verify the origin is the real IdP before entering credentials."},{"from":"IdP","to":"Client","label":"302 redirect with response=eyJ… (JARM)","hop":"IdP → Browser","vis":"browser","lede":"Instead of a bare ?code=…&state=…, the IdP returns a single signed response JWT. Its claims — iss, aud, exp, code, state — are integrity-protected end to end.","resp":{"status":302,"statusText":"Found","headers":[["location","https://client.example.com/cb?response=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImFzLXNpZy0yMDI2LTAxIn0.eyJpc3Mi…payload….c0ffee_SYNTHETIC_SIGNATURE_NOT_REAL"]]},"jwt":{"title":"Decoded JARM response JWT","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"as-sig-2026-01\" }","payload":[["iss","https://as.example.com","The AS that answered — MUST match the AS you sent to (mix-up defense)"],["aud","s6bhdrkqt3","Must equal your client_id"],["exp","1774000120","Short expiry (epoch)"],["code","SplxlOBeZQQYbYS6WxSbIA","Authorization code — trustworthy only after sig + iss/aud checks"],["state","af0ifjsldkj","Echoed CSRF token — must match what you sent"]]},"devtools":"In the <b>Location<\/b> header, instead of <code>?code=…&state=…<\/code> you see one <code>?response=eyJ…<\/code> JWT (or <code>#response=<\/code> for fragment.jwt, or a form POST for form_post.jwt). Decode the payload and check <b>iss<\/b> equals the AS you sent to and <b>aud<\/b> equals your client_id — then, and only then, trust the <code>code<\/code>."},{"from":"Client","to":"Client","label":"Verify JARM, extract code","hop":"Client (local)","lede":"The client verifies the response JWT's signature and checks iss and aud before touching the code. On an iss mismatch (a mix-up attempt) it discards the response and does NOT redeem the code.","devtools":"This is the mix-up defense in action: a response whose <b>iss<\/b> is not the expected AS — or whose signature fails — must be <b>discarded<\/b>. Never redeem a <code>code<\/code> from an unverified JARM response."},{"from":"Client","to":"IdP","label":"POST /token — redeem the code","hop":"Client → IdP","lede":"With the code verified, the client exchanges it at the token endpoint, sending the PKCE code_verifier. The AS returns an ID token and access token.","req":{"method":"POST","url":"https://as.example.com/token","headers":[["host","as.example.com"],["content-type","application/x-www-form-urlencoded"]],"form":[["grant_type","authorization_code"],["code","SplxlOBeZQQYbYS6WxSbIA"],["redirect_uri","https://client.example.com/cb"],["client_id","s6bhdrkqt3"],["code_verifier","dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"SYNTH-opaque-at-2Yotnf9Xz\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"id_token\": \"eyJhbGciOiJSUzI1Ni….eyJpc3Mi….SIG\"\n}"},"jwt":{"title":"Decoded id_token","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"as-sig-2026-01\" }","payload":[["iss","https://as.example.com","Issuer — must equal your AS"],["sub","248289761001","Stable user identifier"],["aud","s6bhdrkqt3","Audience — must equal your client_id"],["nonce","n-0S6_WzA2Mj","Must equal the nonce in your request object — binds the id_token to this request"],["auth_time","1774000000","When the user authenticated (epoch)"],["name","Alex Synthetic","Profile claim"],["preferred_username","alex","Profile claim"],["iat","1774000000","Issued-at (epoch)"],["exp","1774003600","Expiry (epoch)"]]},"devtools":"Standard <code>grant_type=authorization_code<\/code> body with <code>code_verifier<\/code>. In the <b>200<\/b> response, decode the <code>id_token<\/code> and confirm its <b>nonce<\/b> matches the <code>nonce<\/code> you put in the request object — that ties the id_token back to this exact JAR request."}]},"oidc-mtls-bound-tokens":{"title":"OIDC mTLS Client Auth + Certificate-Bound Tokens","subtitle":"The client authenticates with an X.509 certificate and the token is bound to that cert — a stolen bearer token is useless without the matching key.","category":"OIDC","steps":[{"from":"Client","to":"Client","label":"Client holds an X.509 cert + private key","hop":"Client (local)","lede":"A confidential client is registered at the AS with an expected certificate subject/SAN (tls_client_auth) or JWKS thumbprint (self_signed_tls_client_auth). The private key never leaves the client.","devtools":"TLS client certificates live in the <b>handshake<\/b>, so ordinary browser DevTools cannot show them. To observe this flow you need a capturing proxy or a CLI trace like <code>curl -v --cert client.crt --key client.key<\/code>."},{"from":"Client","to":"IdP","label":"POST /token over mTLS","hop":"Client → IdP","lede":"The client opens a mutually-authenticated TLS connection to the mTLS endpoint alias and posts the grant. There is no client_secret and no Authorization header — the certificate is the credential.","req":{"method":"POST","url":"https://as.mtls.example.com/token","headers":[["host","as.mtls.example.com"],["content-type","application/x-www-form-urlencoded"]],"form":[["grant_type","client_credentials"],["client_id","s6bhdrkqt3"],["scope","accounts"]]},"devtools":"Note this hits the <b>mTLS alias host<\/b> (<code>mtls_endpoint_aliases<\/code>), not the main issuer. In the request body there is <b>no client_secret<\/b> and no <code>Authorization<\/code> header. In the TLS details of a proxy view, confirm a <b>Certificate<\/b> message was sent by the client during the handshake."},{"from":"IdP","to":"IdP","label":"Validate cert, compute x5t#S256","hop":"IdP (local)","lede":"The IdP validates the certificate chain (or matches SHA-256 against a registered JWKS key for the self-signed variant), matches the registered DN/SAN, then computes the cert thumbprint that will bind the token.","codeTitle":"Computed at the AS","code":"x5t#S256 = base64url( SHA-256( DER( client leaf cert ) ) )\n         = \"bwcK0esc3ACC3DB2Y5_lESsXE8u9ie-mkDs5CdrEIYY\"","devtools":"You can reproduce this thumbprint over your own cert:\n<code>openssl x509 -in client.crt -outform DER | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '='<\/code>. It must equal the token's <code>cnf.x5t#S256<\/code>."},{"from":"IdP","to":"Client","label":"200 — certificate-bound access token","hop":"IdP → Client","lede":"The AS returns an access token whose cnf claim carries the certificate thumbprint. This is what turns a bearer token into a sender-constrained token.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"eyJhbGciOiJSUzI1Ni…at+jwt….SIG\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"scope\": \"accounts\"\n}"},"jwt":{"title":"Decoded access_token (RFC 9068 at+jwt)","header":"{ \"alg\": \"RS256\", \"typ\": \"at+jwt\", \"kid\": \"as-sig-2026-01\" }","payload":[["iss","https://as.example.com","Issuer"],["aud","https://api.example.com","Resource server that must bind-check the token"],["sub","s6bhdrkqt3-client","Client acting as the subject"],["client_id","s6bhdrkqt3","Confidential client that presented the cert"],["scope","accounts","Granted scope"],["cnf","{ \"x5t#S256\": \"bwcK0esc3ACC3DB2Y5_lESsXE8u9ie-mkDs5CdrEIYY\" }","Confirmation claim — binds the token to the client cert"],["iat","1774000000","Issued-at (epoch)"],["exp","1774003600","Expiry (epoch)"]]},"devtools":"Split the <code>access_token<\/code> on <code>.<\/code> and base64url-decode the payload. The binding lives in <b>cnf<\/b>: <code>\"cnf\": { \"x5t#S256\": \"…\" }<\/code>. That value is <code>base64url(SHA-256(DER(leaf cert)))<\/code> — it must equal the thumbprint of the cert you presented."},{"from":"Client","to":"API","label":"GET /accounts with the SAME cert","hop":"Client → API","lede":"The client calls the resource server over a fresh mTLS connection presenting the same client certificate, with the bound token as a Bearer credential.","req":{"method":"GET","url":"https://api.example.com/accounts","headers":[["host","api.example.com"],["authorization","Bearer eyJhbGciOiJSUzI1Ni…at+jwt….SIG"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"accounts\": [ { \"id\": \"acc-001\", \"balance\": \"0.00\" } ] }"},"devtools":"The resource server recomputes the thumbprint over the cert on <i>this<\/i> TLS connection and requires it to equal <code>cnf.x5t#S256<\/code>. If a TLS-terminating proxy fronts the API, look for the forwarded verified-cert header (e.g. <code>X-Client-Cert<\/code>) the proxy injects — that is what the API bind-checks against."},{"from":"Client","to":"API","label":"Replay without the bound cert → 401","hop":"Attacker → API","lede":"The same token is replayed over a TLS connection with no client cert (or a different one). The thumbprint no longer matches, so the API rejects it. This is the whole point: a stolen token alone is useless.","req":{"method":"GET","url":"https://api.example.com/accounts","headers":[["host","api.example.com"],["authorization","Bearer eyJhbGciOiJSUzI1Ni…SAME.TOKEN"]]},"resp":{"status":401,"statusText":"Unauthorized","headers":[["www-authenticate","Bearer error=\"invalid_token\", error_description=\"certificate thumbprint mismatch\""]]},"devtools":"This is the key observation: the <b>same token<\/b> that returned 200 on the bound connection now returns <b>401<\/b> with <code>WWW-Authenticate: Bearer error=\"invalid_token\"<\/code>. Bearer theft alone gains the attacker nothing without the matching private key."},{"from":"API","to":"IdP","label":"Introspect an opaque bound token (optional)","hop":"API → IdP","lede":"For opaque (non-JWT) bound tokens, the resource server calls introspection. The response returns the same cnf.x5t#S256 so the API can compare it to the cert on the current connection.","req":{"method":"POST","url":"https://as.mtls.example.com/introspect","headers":[["host","as.mtls.example.com"],["content-type","application/x-www-form-urlencoded"]],"form":[["token","opaque-2Yotnf-synthetic"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{\n  \"active\": true,\n  \"client_id\": \"s6bhdrkqt3\",\n  \"scope\": \"accounts\",\n  \"cnf\": { \"x5t#S256\": \"bwcK0esc3ACC3DB2Y5_lESsXE8u9ie-mkDs5CdrEIYY\" }\n}"},"devtools":"The introspection <b>200<\/b> body carries <code>cnf.x5t#S256<\/code>, exactly as the JWT did. The resource server compares it to the thumbprint of the cert on the current connection — same bind-check, different token format."}]},"oidc-pushed-authorization-requests":{"title":"OIDC Pushed Authorization Requests (PAR)","subtitle":"Push the whole authorization request over a secure back channel first, then redirect with just a short-lived request_uri — so the parameters never touch the browser URL (RFC 9126).","category":"OIDC","steps":[{"from":"User","to":"Client","label":"Start sign-in","hop":"User → Client","lede":"The user begins sign-in. The client builds the full authorization request locally: a PKCE code_verifier and S256 challenge, state, nonce, and scope.","codeTitle":"Computed locally","code":"code_verifier  = \"dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk\"\ncode_challenge = base64url(SHA-256(code_verifier))\n             = \"E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM\"\nstate = \"af0ifjsldkj\"   nonce = \"n-0S6_WzA2Mj\"","devtools":"Nothing on the wire yet. Everything the browser would normally carry on the <code>/authorize<\/code> URL is about to be sent on the back channel instead."},{"from":"Client","to":"IdP","label":"POST /par","hop":"Client → IdP (back-channel)","lede":"The client pushes the COMPLETE authorization request to the PAR endpoint, authenticating with its client credentials. Every parameter travels here, server-to-server — none of it will touch the browser.","req":{"method":"POST","url":"https://as.example.com/par","headers":[["authorization","Basic czZCaGRSa3F0MzpjbGktczNjcjN0LXNoaGg="],["content-type","application/x-www-form-urlencoded"]],"form":[["response_type","code"],["client_id","s6BhdRkqt3"],["redirect_uri","https://app.example.com/cb"],["scope","openid read:orders"],["code_challenge","E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM"],["code_challenge_method","S256"],["state","af0ifjsldkj"],["nonce","n-0S6_WzA2Mj"]]},"devtools":"Not in the browser — read client server logs or AS logs on the <code>/par<\/code> path. The <b>Basic<\/b> value decodes to <code>s6BhdRkqt3:cli-s3cr3t-shhh<\/code>. Every authorization parameter is in this body; client-auth failure returns <code>401 invalid_client<\/code>."},{"from":"IdP","to":"Client","label":"201 request_uri","hop":"IdP → Client (back-channel)","lede":"The AS validates and stores the request, then returns an opaque, single-use request_uri handle with a short TTL. The client must redirect before it lapses.","resp":{"status":201,"statusText":"Created","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"request_uri\": \"urn:ietf:params:oauth:request_uri:6esc_11ACC5bwc014ltc14eY22c\",\n  \"expires_in\": 60\n}"},"devtools":"<b>request_uri<\/b> is a one-time reference to the stored request — the only authorization detail that will appear in the browser. <b>expires_in<\/b> (60s) is short; a stale or reused handle gets <code>invalid_request_uri<\/code> at <code>/authorize<\/code>."},{"from":"Client","to":"IdP","label":"Redirect to /authorize (request_uri only)","hop":"Browser → IdP","vis":"browser","lede":"The browser is redirected to the authorization endpoint carrying ONLY client_id and request_uri. The long parameters are absent from the URL — that is PAR working.","req":{"method":"GET","url":"https://as.example.com/authorize","q":[["client_id","s6BhdRkqt3"],["request_uri","urn:ietf:params:oauth:request_uri:6esc_11ACC5bwc014ltc14eY22c"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"]]},"devtools":"This is the request to inspect in DevTools. Confirm the query string holds <b>only<\/b> <code>client_id<\/code> and <code>request_uri<\/code> — no <code>scope<\/code>, <code>redirect_uri<\/code>, <code>code_challenge<\/code>, <code>state<\/code>, or <code>nonce<\/code>. The AS resolves <code>request_uri<\/code> to the stored request and <b>ignores<\/b> any extra query params. A plain <code>/authorize<\/code> with no <code>request_uri<\/code>, when the AS requires PAR, is rejected with <code>invalid_request<\/code>."},{"from":"IdP","to":"Client","label":"Redirect back with code","hop":"IdP → Browser","vis":"browser","lede":"After the user logs in and consents, the AS 302-redirects back to redirect_uri with a single-use authorization code and the echoed state.","resp":{"status":302,"statusText":"Found","headers":[["location","https://app.example.com/cb?code=SplxlOBeZQQYbYS6WxSbIA&state=af0ifjsldkj"]]},"devtools":"Find the <b>302<\/b> whose <b>Location<\/b> points at your <code>redirect_uri<\/code>. Verify the returned <b>state<\/b> equals the <code>af0ifjsldkj<\/code> you pushed in step 2 — a mismatch means CSRF; abort."},{"from":"Client","to":"IdP","label":"POST /token (redeem code)","hop":"Client → IdP (back-channel)","lede":"The client exchanges the code plus the original PKCE code_verifier for tokens. The AS recomputes S256(code_verifier) and matches it to the challenge that was pushed in step 2.","req":{"method":"POST","url":"https://as.example.com/token","headers":[["authorization","Basic czZCaGRSa3F0MzpjbGktczNjcjN0LXNoaGg="],["content-type","application/x-www-form-urlencoded"]],"form":[["grant_type","authorization_code"],["code","SplxlOBeZQQYbYS6WxSbIA"],["redirect_uri","https://app.example.com/cb"],["code_verifier","dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"mF_9.B5f-4.1JqM\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"scope\": \"openid read:orders\",\n  \"id_token\": \"eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIyNDgyODk3NjEwMDEifQ.SIG-synthetic\"\n}"},"devtools":"Back-channel, not in the browser. The <b>code_verifier<\/b> <code>dBjftJeZ…<\/code> proves the same client that pushed the request is redeeming the code: its S256 hash must equal the <code>code_challenge<\/code> pushed in step 2, binding the whole flow together."}]},"oidc-refresh-token":{"title":"OIDC Refresh Token Grant (with Rotation)","subtitle":"How a SPA renews an expired access token without sending the user back through login — and how rotation plus reuse-detection catches a stolen token.","category":"OIDC","steps":[{"from":"App","to":"App","label":"Access token has expired","hop":"App (local)","lede":"The user is already signed in, but the short-lived access token (AT1) has expired. The public client (SPA) still holds a refresh token from the original grant and will use it to get a fresh access token silently.","devtools":"Open DevTools → <b>Network<\/b>, enable <b>Preserve log<\/b>, and filter <b>Fetch/XHR<\/b> with <code>token<\/code> in the box. For a <i>public client<\/i> (SPA) the refresh runs in the browser and is fully visible; for a confidential/BFF client it would be a back-channel call you’d only see in backend logs."},{"from":"App","to":"IdP","label":"Send the refresh request","hop":"App → IdP","vis":"browser","lede":"The client posts grant_type=refresh_token with the stored refresh token. A public client identifies itself with client_id (no secret); the browser is the origin.","req":{"method":"POST","url":"https://idp.example.com/token","headers":[["content-type","application/x-www-form-urlencoded"],["origin","https://app.example.com"]],"form":[["grant_type","refresh_token"],["refresh_token","rt_synthetic_A1_0000"],["client_id","spa-public-001"]]},"devtools":"Open the <b>Payload<\/b> tab and confirm <b>grant_type=refresh_token<\/b> and the <b>refresh_token<\/b> being sent (<code>rt_synthetic_A1_0000<\/code>). Note the value — you’ll compare it against the one that comes back. A confidential client would instead send an <b>Authorization: Basic<\/b> header or a <code>client_assertion<\/code> on the back channel."},{"from":"IdP","to":"App","label":"Rotated tokens returned","hop":"IdP → App","vis":"browser","lede":"The IdP validates the refresh token, then rotates it: it invalidates the one you sent and returns a brand-new refresh token (same family) alongside a fresh access token and a re-issued ID token.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"at_synthetic_new_99887766\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"scope\": \"openid profile email\",\n  \"refresh_token\": \"rt_synthetic_A2_0001\",\n  \"id_token\": \"eyJhbGciOiJSUzI1Ni….eyJpc3Mi….SIG\"\n}"},"jwt":{"title":"Decoded re-issued id_token","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"idp-2026-07-key1\" }","payload":[["iss","https://idp.example.com","Issuer — the authorization server"],["sub","248289761001","Stable opaque user id (unchanged across refreshes)"],["aud","spa-public-001","Audience — the client_id"],["exp","1774010000","NEW expiry — later than the previous token"],["iat","1774006400","NEW issued-at — the moment of this refresh"],["auth_time","1773996390","UNCHANGED — the original login, not now"],["name","Ada Lovelace","Profile claim (synthetic)"],["email","ada.lovelace@example.com","Profile claim (synthetic)"],["email_verified","true","Address verified by the IdP"]]},"devtools":"In the <b>Response<\/b>, confirm the <b>refresh_token<\/b> differs from the one you sent (<code>…A2_0001<\/code> vs <code>…A1_0000<\/code>) — that is rotation. The client must now store the new one and discard the old. In the id_token, <b>iat<\/b>/<b>exp<\/b> move forward but <b>auth_time<\/b> stays pinned to the original login: a refresh renews tokens, it does not re-authenticate the user. There is no <b>nonce<\/b> (no front-channel /authorize)."},{"from":"App","to":"API","label":"Call the API with the fresh token","hop":"App → API","vis":"browser","lede":"The client retries the resource call, now presenting the freshly minted access token as a Bearer credential.","req":{"method":"GET","url":"https://api.example.com/v1/reports","headers":[["authorization","Bearer at_synthetic_new_99887766"],["accept","application/json"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"reports\": [ { \"id\": \"r-001\", \"status\": \"ready\" } ] }"},"devtools":"Confirm the <b>Authorization: Bearer<\/b> header carries the <i>new<\/i> access token, not the expired one. The resource server validates it (signature via JWKS, <b>iss<\/b>, <b>aud<\/b>, <b>exp<\/b>, scopes) before returning data."},{"from":"App","to":"IdP","label":"Reuse detection: old token replayed","hop":"App → IdP","vis":"browser","lede":"If the already-rotated token (…A1_0000) is replayed — typically by an attacker who stole it — the IdP sees a used token, treats it as a breach, and revokes the entire token family.","req":{"method":"POST","url":"https://idp.example.com/token","headers":[["content-type","application/x-www-form-urlencoded"],["origin","https://app.example.com"]],"form":[["grant_type","refresh_token"],["refresh_token","rt_synthetic_A1_0000"],["client_id","spa-public-001"]]},"resp":{"status":400,"statusText":"Bad Request","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"error\": \"invalid_grant\",\n  \"error_description\": \"Refresh token already used; token family revoked\"\n}"},"devtools":"This shows as a red <b>400<\/b> on the <code>token<\/code> request with <code>error=invalid_grant<\/code>. Because the AS revokes the whole family, the <i>next<\/i> refresh — even with the current <code>…A2_0001<\/code> token — will also fail, forcing interactive re-authentication. That is the point: a stolen refresh token cannot be used silently for long."},{"from":"App","to":"User","label":"Re-authentication required","hop":"App (local)","lede":"With the family revoked, the client can no longer refresh. It falls back to sending the user through an interactive login at /authorize.","devtools":"Nothing more to refresh. Other benign reasons a refresh returns <code>invalid_grant<\/code>: the family hit its sliding idle window or absolute lifetime. In all cases the client redirects to <b>/authorize<\/b> for a fresh login. Scope on refresh may only <i>narrow<\/i> the grant, never widen it."}]},"oidc-resource-owner-password-credentials":{"title":"OIDC Resource Owner Password Credentials (ROPC)","subtitle":"⛔ DEPRECATED — the app collects the user's raw password and posts it to the token endpoint; forbidden by OAuth 2.1 and the Security BCP. Documented here only so you can recognize it and migrate to Authorization Code + PKCE.","category":"OIDC","steps":[{"from":"User","to":"Client","label":"User types password into the app","hop":"User → Client","lede":"The user enters their username and password directly into the client application — not into the IdP's own login page. Handing the raw password to the app is the defining flaw of this grant.","devtools":"There is no <code>/authorize<\/code> step and no redirect in ROPC — the whole flow is a single back-channel POST. That absence of an IdP-hosted login page is itself the warning sign."},{"from":"Client","to":"IdP","label":"POST /token grant_type=password","hop":"Client → IdP","lede":"The client posts the credentials to the token endpoint. The username and password travel in the request body in cleartext; a confidential client also sends its own credentials via Authorization: Basic.","req":{"method":"POST","url":"https://as.example.com/token","headers":[["host","as.example.com"],["content-type","application/x-www-form-urlencoded"],["authorization","Basic bGVnYWN5LWZpcnN0LXBhcnR5OlNZTlRIX3NlY3JldA=="]],"form":[["grant_type","password"],["username","alex"],["password","s3cr3t-synthetic"],["scope","openid profile"]]},"devtools":"⛔ <b>This is the deprecation red flag.<\/b> Open the request's <b>Payload<\/b> tab: <code>grant_type=password<\/code> with <b>username<\/b> and <b>password<\/b> in <i>cleartext<\/i>. Anything that can read the request — a proxy, a browser extension, an over-broad log — sees the password. This is exactly why OAuth 2.1 forbids ROPC. Always redact a real capture; migrate the client to <b>Authorization Code + PKCE<\/b>."},{"from":"IdP","to":"IdP","label":"Validate credentials against the directory","hop":"IdP (local)","lede":"The AS checks the username and password against its user directory. On success it mints tokens; on failure it returns a deliberately field-agnostic error.","devtools":"The AS validation happens server-side. Note what it <i>cannot<\/i> do here: there is no interactive channel, so it can't run an MFA challenge or a password-change prompt — those failure modes all collapse into a single 400 (see below)."},{"from":"IdP","to":"Client","label":"200 — tokens returned","hop":"IdP → Client","lede":"The AS returns an access token, a refresh token, and — because openid was requested — an ID token. Note there is no nonce anywhere: ROPC has no /authorize step to carry one.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"eyJhbGciOiJSUzI1Ni…at+jwt….SIG\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"refresh_token\": \"SYNTH_rt_2Yotnf9Xz_do_not_use\",\n  \"id_token\": \"eyJhbGciOiJSUzI1Ni….eyJpc3Mi….SIG\",\n  \"scope\": \"openid profile\"\n}"},"jwt":{"title":"Decoded id_token","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"as-sig-2026-01\" }","payload":[["iss","https://as.example.com","Issuer — must equal your AS"],["sub","248289761001","Stable user identifier"],["aud","legacy-first-party","The legacy client the token was minted for"],["auth_time","1774000000","When the user authenticated (epoch)"],["name","Alex Synthetic","Profile claim"],["preferred_username","alex","Profile claim"],["iat","1774000000","Issued-at (epoch)"],["exp","1774003600","Expiry (epoch)"]]},"devtools":"Decode the <code>id_token<\/code> payload. There is <b>no nonce<\/b> — ROPC has no <code>/authorize<\/code> step to bind one, which is one of its weaknesses. The <b>refresh_token<\/b> should be disabled or rotated aggressively: it extends the reach of a grant that already mishandled the password."},{"from":"Client","to":"IdP","label":"Wrong password → 400 invalid_grant","hop":"Client → IdP","lede":"A bad password is rejected with a field-agnostic error that never reveals whether the username or the password was wrong.","req":{"method":"POST","url":"https://as.example.com/token","headers":[["host","as.example.com"],["content-type","application/x-www-form-urlencoded"],["authorization","Basic bGVnYWN5LWZpcnN0LXBhcnR5OlNZTlRIX3NlY3JldA=="]],"form":[["grant_type","password"],["username","alex"],["password","wrong-synthetic"]]},"resp":{"status":400,"statusText":"Bad Request","headers":[["content-type","application/json"]],"json":"{\n  \"error\": \"invalid_grant\",\n  \"error_description\": \"invalid username or password\"\n}"},"devtools":"A <b>400 invalid_grant<\/b> with a generic \"invalid username or password\" is deliberate — it does not say which field was wrong, to avoid username enumeration."},{"from":"Client","to":"IdP","label":"MFA required → 400 interaction_required","hop":"Client → IdP","lede":"Even with a valid password, policy may require a second factor. This grant has no interactive channel to carry an MFA challenge, so it simply fails — forcing a switch to a redirect-based flow.","req":{"method":"POST","url":"https://as.example.com/token","headers":[["host","as.example.com"],["content-type","application/x-www-form-urlencoded"],["authorization","Basic bGVnYWN5LWZpcnN0LXBhcnR5OlNZTlRIX3NlY3JldA=="]],"form":[["grant_type","password"],["username","alex"],["password","s3cr3t-synthetic"]]},"resp":{"status":400,"statusText":"Bad Request","headers":[["content-type","application/json"]],"json":"{\n  \"error\": \"invalid_grant\",\n  \"error_description\": \"interaction_required: second factor needed\"\n}"},"devtools":"A <b>400<\/b> with <code>interaction_required<\/code> means the AS wants a second factor (or a password change) that this grant <i>cannot<\/i> carry. The only fix is to move the client to <b>Authorization Code + PKCE<\/b>, where the IdP's own pages can run the challenge. This is the concrete reason ROPC is a dead end."}]},"oidc-rich-authorization-requests":{"title":"OIDC Rich Authorization Requests (RAR, RFC 9396)","subtitle":"Instead of a coarse scope string, the client sends a structured authorization_details array — and the token response echoes the GRANTED details, which may be narrower than requested.","category":"OIDC","steps":[{"from":"Client","to":"Client","label":"Build authorization_details","hop":"Client (local)","lede":"The client describes exactly what it wants as a JSON array. Each object has a type plus fine-grained members like locations, actions, and transaction constraints — here a single EUR 123.45 payment to a specific creditor.","codeTitle":"Requested authorization_details","code":"[\n  {\n    \"type\": \"payment_initiation\",\n    \"locations\": [\"https://api.example.com/payments\"],\n    \"actions\": [\"initiate\"],\n    \"instructedAmount\": { \"currency\": \"EUR\", \"amount\": \"123.45\" },\n    \"creditorAccount\": { \"iban\": \"DE02100100109307118603\" }\n  }\n]","devtools":"The signature of RAR is an <b>authorization_details<\/b> JSON array. Each object's <code>type<\/code> must be one the AS advertises in <code>authorization_details_types_supported<\/code>; the other members (amount, creditor) bind the token to an exact transaction."},{"from":"Client","to":"IdP","label":"GET /authorize with authorization_details","hop":"Browser → IdP","vis":"browser","lede":"The browser goes to the authorization endpoint carrying the URL-encoded authorization_details alongside the usual params. In FAPI deployments this rides inside a signed request object or a PAR request_uri instead of a raw query param.","req":{"method":"GET","url":"https://as.example.com/authorize","q":[["client_id","s6bhdrkqt3"],["response_type","code"],["redirect_uri","https://client.example.com/cb"],["scope","openid"],["state","af0ifjsldkj"],["authorization_details","[{\"type\":\"payment_initiation\",\"locations\":[\"https://api.example.com/payments\"],\"actions\":[\"initiate\"],\"instructedAmount\":{\"currency\":\"EUR\",\"amount\":\"123.45\"},\"creditorAccount\":{\"iban\":\"DE02100100109307118603\"}}]"]]},"devtools":"Find the <b>authorization_details<\/b> query param and URL-decode it — it is a JSON array. Note it can be mixed with a plain <code>scope<\/code> (here <code>openid<\/code>). In FAPI you usually won't see it as a raw param: it's inside a signed <code>request<\/code> object or was pushed via <b>PAR<\/b>, leaving a <code>request_uri<\/code>."},{"from":"IdP","to":"User","label":"Consent shows the exact details","hop":"IdP → User","vis":"browser","lede":"The AS validates each object against its registered type schema and renders the concrete transaction on the consent screen — the amount, the creditor, the action — not a generic scope name. The user approves.","resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"],["set-cookie","idp_session=…; HttpOnly; Secure; SameSite=Lax"]]},"devtools":"A correct RAR consent screen shows the exact <b>amount<\/b>, <b>creditor<\/b>, and <b>action<\/b> — if it only shows a vague scope name, the AS isn't honoring the details. An unknown or malformed <code>type<\/code> would instead bounce back as <code>302 …?error=invalid_authorization_details<\/code>."},{"from":"IdP","to":"Client","label":"302 redirect with code","hop":"IdP → Browser","vis":"browser","lede":"On approval the AS redirects back to redirect_uri with a standard authorization code and the echoed state.","resp":{"status":302,"statusText":"Found","headers":[["location","https://client.example.com/cb?code=SplxlOBeZQQYbYS6WxSbIA&state=af0ifjsldkj"]]},"devtools":"The redirect back is ordinary: <code>?code=…&state=…<\/code>. Verify the returned <b>state<\/b> equals the one you sent. The rich detail does not travel in the redirect — it comes back in the token response."},{"from":"Client","to":"IdP","label":"POST /token — granted details echoed","hop":"Client → IdP","lede":"The client redeems the code. The 200 body contains a top-level authorization_details array — the GRANTED set. Compare it field-by-field against the request; a partial grant means you got less than you asked for.","req":{"method":"POST","url":"https://as.example.com/token","headers":[["host","as.example.com"],["content-type","application/x-www-form-urlencoded"]],"form":[["grant_type","authorization_code"],["code","SplxlOBeZQQYbYS6WxSbIA"],["redirect_uri","https://client.example.com/cb"],["client_id","s6bhdrkqt3"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"eyJhbGciOiJSUzI1Ni…at+jwt….SIG\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"authorization_details\": [\n    {\n      \"type\": \"payment_initiation\",\n      \"locations\": [\"https://api.example.com/payments\"],\n      \"actions\": [\"initiate\"],\n      \"instructedAmount\": { \"currency\": \"EUR\", \"amount\": \"123.45\" },\n      \"creditorAccount\": { \"iban\": \"DE02100100109307118603\" }\n    }\n  ]\n}"},"jwt":{"title":"Decoded access_token (at+jwt)","header":"{ \"alg\": \"RS256\", \"typ\": \"at+jwt\", \"kid\": \"as-sig-2026-01\" }","payload":[["iss","https://as.example.com","Issuer"],["aud","https://api.example.com","Resource server that must enforce the details"],["sub","248289761001","Stable user identifier"],["client_id","s6bhdrkqt3","Client the token was issued to"],["authorization_details","[{ type: payment_initiation, locations, actions, instructedAmount, creditorAccount }]","The GRANTED fine-grained authorization, carried as a claim"],["jti","rar-9a8b-synthetic","Token identifier"],["iat","1774000000","Issued-at (epoch)"],["exp","1774003600","Expiry (epoch)"]]},"devtools":"The <b>200<\/b> body's top-level <b>authorization_details<\/b> is the <i>granted<\/i> set — authoritative over what you requested. Compare it field-by-field: a subset means a <b>partial grant / downscope<\/b> and the client must adapt, never assume the request was granted verbatim. If the access token is a JWT, the same claim appears inside it."},{"from":"Client","to":"API","label":"POST /payments within the grant → 201","hop":"Client → API","lede":"The client calls the resource server for a payment matching the granted detail. The API checks the request falls within a granted location, action, and amount, then accepts.","req":{"method":"POST","url":"https://api.example.com/payments","headers":[["host","api.example.com"],["authorization","Bearer eyJhbGciOiJSUzI1Ni…at+jwt….SIG"],["content-type","application/json"]],"json":"{\n  \"instructedAmount\": { \"currency\": \"EUR\", \"amount\": \"123.45\" },\n  \"creditorAccount\": { \"iban\": \"DE02100100109307118603\" }\n}"},"resp":{"status":201,"statusText":"Created","headers":[["content-type","application/json"]],"json":"{ \"paymentId\": \"pmt-synthetic-001\", \"status\": \"ACCEPTED\" }"},"devtools":"The API returns <b>201<\/b> because the call matches a granted detail — same <code>location<\/code>, <code>action<\/code>, and constraints like amount. The resource server enforces <code>authorization_details<\/code>, not just a scope."},{"from":"Client","to":"API","label":"Outside the grant → 403","hop":"Client → API","lede":"The same token is used against /accounts, which is not in the granted locations. The API refuses: the token authorizes a payment, nothing else.","req":{"method":"GET","url":"https://api.example.com/accounts","headers":[["host","api.example.com"],["authorization","Bearer eyJhbGciOiJSUzI1Ni…at+jwt….SIG"]]},"resp":{"status":403,"statusText":"Forbidden","headers":[["content-type","application/json"]],"json":"{ \"error\": \"insufficient_authorization\" }"},"devtools":"A <b>403 insufficient_authorization<\/b> shows enforcement of <code>locations<\/code>/<code>actions<\/code>: <code>/accounts<\/code> is outside the granted <code>/payments<\/code> location. Fine-grained authorization means the token is useless beyond exactly what was granted."}]},"oidc-rp-initiated-logout":{"title":"OIDC RP-Initiated Logout","subtitle":"The app kills its own session, then redirects to the IdP’s end_session_endpoint with an id_token_hint — a fully browser-visible chain of redirects.","category":"OIDC","steps":[{"from":"User","to":"Browser","label":"User clicks “Log out”","hop":"User → Browser","lede":"The user starts logout in the app (the RP). What follows is a short chain of redirects: RP → IdP → back to RP.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b> — without it the early hops vanish as the browser navigates. This whole flow is browser-visible."},{"from":"Browser","to":"App","label":"RP local logout","hop":"Browser → App","vis":"browser","lede":"The RP destroys its own session first — clearing its cookie before handing off — so logout holds even if the user never finishes the IdP leg. It then redirects to end_session.","req":{"method":"GET","url":"https://rp1.example.com/logout","headers":[["cookie","rp1_session=SYNTHETIC-rp1-session"]]},"resp":{"status":302,"statusText":"Found","headers":[["set-cookie","rp1_session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax"],["location","https://idp.example.com/end_session?id_token_hint=eyJhbGciOiJSUzI1NiI…SIG_synthetic&post_logout_redirect_uri=https%3A%2F%2Frp1.example.com%2Floggedout&state=af0ifjsldkj"]]},"devtools":"Filter on <b>logout<\/b>. Confirm the <b>Set-Cookie<\/b> actually clears <b>rp1_session<\/b> (<code>Max-Age=0<\/code>) — the RP kills its session <i>before<\/i> the redirect. Read the <b>Location<\/b> header: it points at the IdP <b>end_session_endpoint<\/b> and carries <b>id_token_hint<\/b>, <b>post_logout_redirect_uri<\/b>, and <b>state<\/b>."},{"from":"Browser","to":"IdP","label":"GET /end_session at the IdP","hop":"Browser → IdP","vis":"browser","lede":"The browser hits end_session with the IdP session cookie attached. The id_token_hint identifies which session to end and lets the IdP skip the “Are you sure?” prompt.","req":{"method":"GET","url":"https://idp.example.com/end_session","q":[["id_token_hint","eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImlkcC1rZXktMjAyNiJ9.eyJpc3Mi…synthetic…fQ.SIG_synthetic_not_a_real_signature_do_not_verify"],["post_logout_redirect_uri","https://rp1.example.com/loggedout"],["state","af0ifjsldkj"]],"headers":[["cookie","idp_session=SYNTHETIC-idp-session-cookie"]]},"resp":{"status":302,"statusText":"Found","headers":[["set-cookie","idp_session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=None"],["location","https://rp1.example.com/loggedout?state=af0ifjsldkj"]]},"jwt":{"title":"Decoded id_token_hint","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"idp-key-2026\" }","payload":[["iss","https://idp.example.com","Issuer — the IdP validates this"],["sub","248289761001","Subject — whose session to end"],["aud","s6BhdRkqt3","This RP’s client_id — the IdP validates aud"],["exp","1774003600","May be EXPIRED and still accepted as a hint"],["sid","abc123session","Session id — the exact SSO session to terminate"],["nonce","n-0S6_WzA2Mj","From the original login"]]},"devtools":"Filter on <b>end_session<\/b>. Decode the <b>id_token_hint<\/b> for <b>sub<\/b>/<b>sid<\/b>. The IdP validates the hint’s <i>signature and aud, not its exp<\/i> — an expired hint still identifies the session fine. Confirm the response clears <b>idp_session<\/b> and that <b>post_logout_redirect_uri<\/b> exactly matches one registered for the client."},{"from":"IdP","to":"IdP","label":"Terminate SSO session","hop":"IdP (local)","lede":"The IdP validates the hint, matches it to the current session, verifies the redirect URI is registered (exact match), and terminates the SSO session — clearing its own cookie.","devtools":"Not a separate network row. If this deployment chains into <i>front-channel logout<\/i> you’ll ALSO see hidden <code>frontchannel-logout<\/code> iframe requests on the IdP page; if it chains into <i>back-channel logout<\/i>, those <code>logout_token<\/code> POSTs are server-to-server and will <b>not<\/b> appear in DevTools."},{"from":"Browser","to":"App","label":"Post-logout redirect back to the RP","hop":"Browser → App","vis":"browser","lede":"The IdP 302s the browser to the registered post_logout_redirect_uri, echoing state. The RP shows its “logged out” page after confirming state matches.","req":{"method":"GET","url":"https://rp1.example.com/loggedout","q":[["state","af0ifjsldkj"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html"]],"json":"<!doctype html><title>Logged out<\/title>Goodbye."},"devtools":"Filter on <b>loggedout<\/b>. Read the <b>state<\/b> query param — the RP compares it to what it stored. If the URI had <b>not<\/b> been registered, this hop would not happen: you’d land on the IdP’s own logged-out page instead. An unregistered <b>post_logout_redirect_uri<\/b> must never become an open redirect."},{"from":"App","to":"User","label":"“You have been logged out”","hop":"App → User","lede":"Sign-out is complete at both the RP and the IdP. Because the RP cleared its session in step one, the logout held regardless of how the IdP leg resolved.","devtools":"Alternate to recognize: with <b>no id_token_hint<\/b>, the <code>end_session<\/code> response is a <code>200<\/code> HTML “Do you want to log out?” prompt rather than a <code>302<\/code> — you’ll see the GET return a document, then a <code>POST<\/code> when the user confirms."}]},"oidc-session-management":{"title":"OIDC Session Management","subtitle":"An app polls the IdP for “is the session still valid?” using postMessage between iframes — the poll is not HTTP, so it’s invisible in the Network tab; only the iframe load and silent re-auth are.","category":"OIDC","steps":[{"from":"App","to":"Browser","label":"Load RP + OP check_session iframes","hop":"App → Browser","lede":"At login the IdP returned a session_state (hash.salt) and published a check_session_iframe. The RP loads a hidden RP iframe alongside the OP’s check_session iframe to watch for session changes.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b>. Crucial quirk: <b>the polling itself is not on the network<\/b> — only the iframe <i>load<\/i> and the <code>prompt=none<\/code> re-auth are real HTTP requests."},{"from":"Browser","to":"IdP","label":"OP check_session_iframe loads","hop":"Browser → IdP","vis":"browser","lede":"The OP’s check_session iframe loads as a hidden frame. It reads the OP browser-state cookie that the poll will hash against.","req":{"method":"GET","url":"https://idp.example.com/check_session","headers":[["cookie","op_browser_state=SYNTHETIC-op-browser-state"],["sec-fetch-dest","iframe"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html"],["cache-control","no-store"]]},"devtools":"Filter on <b>check_session<\/b>. It loads as a hidden frame (<code>Sec-Fetch-Dest: iframe<\/code>). This is the last real network request you’ll see until something changes."},{"from":"Browser","to":"Browser","label":"The poll loop (postMessage — NOT HTTP)","hop":"Browser (local)","lede":"Every few seconds the RP iframe postMessages \"client_id session_state\" to the OP iframe, which recomputes the hash from the browser-state cookie and replies \"unchanged\", \"changed\", or \"error\". None of this is a network request.","codeTitle":"window.postMessage exchange (watch it in the Console)","code":"// RP iframe → OP iframe, every few seconds:\nopIframe.postMessage(\"s6BhdRkqt3 6f7dsynthetichash.9a2csyntheticsalt\", opOrigin)\n\n// OP iframe → RP iframe:\n//   \"unchanged\"  → steady state, keep polling\n//   \"changed\"    → OP session differs → silently re-authenticate\n//   \"error\"      → couldn't read browser-state (3rd-party cookies blocked)\n// session_state = hash.salt; the salt rotates each computation,\n// so the value changes even when the session has not.","devtools":"<b>Not in the Network tab.<\/b> This is <code>window.postMessage<\/code> — window messaging inside the browser. Watch it in the <b>Console<\/b>, or set a <code>window.addEventListener(\"message\", …)<\/code> breakpoint in <b>Sources<\/b>."},{"from":"Browser","to":"IdP","label":"On “changed”: silent re-auth (prompt=none)","hop":"Browser → IdP","vis":"browser","lede":"A \"changed\" reply triggers a silent re-authentication in a hidden iframe. prompt=none means no UI: it succeeds with a code if the user is still logged in at the OP, or errors with login_required if not.","req":{"method":"GET","url":"https://idp.example.com/authorize","q":[["response_type","code"],["client_id","s6BhdRkqt3"],["redirect_uri","https://rp1.example.com/silent-cb"],["scope","openid"],["prompt","none"],["state","sm-state-2200"],["nonce","sm-reauth-9931"]],"headers":[["cookie","idp_session=SYNTHETIC-idp-session-cookie"],["sec-fetch-dest","iframe"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://rp1.example.com/silent-cb?code=SplxlOBeZQQ&state=sm-state-2200"]]},"devtools":"Filter on <b>authorize<\/b>. Confirm <b>prompt=none<\/b> plus <b>state<\/b> and <b>nonce<\/b>. Read the response <b>Location<\/b>: success → <code>silent-cb?code=…<\/code>; failure → <code>silent-cb?error=login_required<\/code> (user logged out at the OP → the RP ends its local session)."},{"from":"App","to":"IdP","label":"Exchange code for fresh tokens","hop":"App → IdP","vis":"browser","lede":"On success the RP redeems the code at /token and receives a fresh id_token plus a new session_state to resume polling with.","req":{"method":"POST","url":"https://idp.example.com/token","headers":[["content-type","application/x-www-form-urlencoded"],["authorization","Basic czZCaGRSa3F0MzpTWU5USEVUSUM="]],"form":[["grant_type","authorization_code"],["code","SplxlOBeZQQ"],["redirect_uri","https://rp1.example.com/silent-cb"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"access_token\": \"SlAV32hkKG-synthetic\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"id_token\": \"eyJhbGciOiJSUzI1Ni….eyJpc3Mi….SIG_synthetic\",\n  \"session_state\": \"6f7dsynthetichash.9a2csyntheticsalt\"\n}"},"jwt":{"title":"Decoded id_token (silent re-auth)","header":"{ \"alg\": \"RS256\", \"typ\": \"JWT\", \"kid\": \"idp-key-2026\" }","payload":[["iss","https://idp.example.com","Issuer — validate even on silent re-auth"],["sub","248289761001","Subject"],["aud","s6BhdRkqt3","This RP’s client_id"],["exp","1774007200","Fresh expiry from the re-auth"],["auth_time","1773999900","ORIGINAL login time — unchanged; the OP session persisted"],["nonce","sm-reauth-9931","Must match the nonce sent on the prompt=none request"],["sid","abc123session","Same session id — confirms it’s the same OP session"],["azp","s6BhdRkqt3","Authorized party"]]},"devtools":"Filter on <b>token<\/b>. In the <b>Response<\/b> JSON, note the <b>new session_state<\/b> the RP stores to resume polling, and decode the <b>id_token<\/b>. A <i>\"changed\"<\/i> postMessage is only a trigger — full ID-token validation (signature, <b>iss<\/b>, <b>aud<\/b>, <b>nonce<\/b>) still applies. Note <b>auth_time<\/b> did not advance: no fresh credential prompt occurred."},{"from":"App","to":"App","label":"Resume polling (or degrade)","hop":"App (local)","lede":"The RP updates its stored session_state and resumes the postMessage loop. If the OP iframe persistently replies \"error\", detection is unreliable and the RP must fall back.","devtools":"A persistent <b>\"error\"<\/b> reply in the Console means the OP iframe can’t read the browser-state cookie (third-party cookie blocking / storage partitioning). Treat it as “session state unknown” and fall back to <i>front-channel<\/i> or <i>back-channel logout<\/i>."}]},"oidc-token-exchange":{"title":"OAuth 2.0 Token Exchange","subtitle":"One service trades a user's token for a narrower, delegated token to call the next service in the chain — with an act claim that keeps the acting party auditable (RFC 8693).","category":"OIDC","steps":[{"from":"User","to":"Client","label":"Request that fans out to service B","hop":"User → Service A","lede":"Service A already holds the user's access token. To fulfil the request it must call service B on the user's behalf — but it should present a token scoped to B, not the user's full token.","devtools":"The exchange that follows is a back-channel, service-to-service call. None of it appears in the browser Network tab — watch service A's egress logs or the STS access logs."},{"from":"Client","to":"IdP","label":"POST /token (token-exchange grant)","hop":"Service A → STS (back-channel)","lede":"Service A posts the user's token as subject_token and asks the Security Token Service to mint a token for a narrower audience and scope. It authenticates with its own client credentials.","req":{"method":"POST","url":"https://as.example.com/token","headers":[["authorization","Basic c3ZjLWE6c3ZjLWEtczNjcjN0"],["content-type","application/x-www-form-urlencoded"],["accept","application/json"]],"form":[["grant_type","urn:ietf:params:oauth:grant-type:token-exchange"],["subject_token","AT-user.9a1c7f20"],["subject_token_type","urn:ietf:params:oauth:token-type:access_token"],["audience","https://api.example.com"],["scope","read:orders"]]},"devtools":"URL-decode the form body. The <b>Basic<\/b> value decodes to <code>svc-a:svc-a-s3cr3t<\/code>. Key params: <code>subject_token<\/code> (who the new token represents), <code>audience<\/code> and <code>scope<\/code> — these should <b>narrow<\/b>, never widen, the downstream reach."},{"from":"IdP","to":"IdP","label":"Validate + mint delegated token","hop":"STS (local)","lede":"The STS validates the subject_token, checks its may_act policy permits service A to act for the user, then mints a delegated token: same subject (the user), narrowed aud and scope, plus an act claim naming service A.","devtools":"No network event. The <b>may_act<\/b> check is the authorization gate: if the subject token's policy does not list service A as a permitted actor, the exchange is denied with <code>400 invalid_request<\/code>."},{"from":"IdP","to":"Client","label":"200 issued delegated token","hop":"STS → Service A (back-channel)","lede":"The STS returns the exchanged token. issued_token_type reports what was actually minted (it may differ from what was requested). expires_in is short — 5 minutes here.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"issued_token_type\": \"urn:ietf:params:oauth:token-type:access_token\",\n  \"access_token\": \"eyJhbGciOiJSUzI1Ni…at+jwt…\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 300,\n  \"scope\": \"read:orders\"\n}"},"jwt":{"title":"Decoded access_token (at+jwt)","header":"{ \"alg\": \"RS256\", \"typ\": \"at+jwt\", \"kid\": \"as-2026-07\" }","payload":[["iss","https://as.example.com","Issuing STS"],["sub","248289761001","The USER — unchanged by the exchange"],["aud","https://api.example.com","Narrowed downstream audience (service B)"],["act","{ \"sub\": \"svc-a\" }","ACTOR chain — service A is acting for the user"],["scope","read:orders","Narrowed scope"],["client_id","svc-a","The exchanging client"],["exp","1774000300","Expiry — 2026-03-17T13:51:40Z"],["iat","1774000000","Issued-at — 2026-03-17T13:46:40Z"],["jti","tex-3f9c2a1b","Unique token id"]]},"devtools":"The single most important claim to read is <b>act<\/b>. Its presence (<code>{\"sub\":\"svc-a\"}<\/code>) means this is <b>delegation<\/b>: downstream can see who is acting. An <b>impersonation<\/b> token would be identical <i>minus<\/i> the <code>act<\/code> claim — the actor invisible. Chains nest: <code>\"act\":{\"sub\":\"svc-b\",\"act\":{\"sub\":\"svc-a\"}}<\/code>, read outermost-first."},{"from":"Client","to":"API","label":"Call service B with the delegated token","hop":"Service A → Service B","lede":"Service A calls service B presenting the exchanged token as a Bearer credential. This hop is typically service-to-service as well.","req":{"method":"GET","url":"https://api.example.com/orders","headers":[["authorization","Bearer eyJhbGciOiJSUzI1Ni…at+jwt…"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"orders\": [ { \"id\": \"ord-1001\", \"total\": 42.5 } ] }"},"devtools":"Decode the Bearer token and confirm service B sees <b>sub=user<\/b> and <b>act.sub=svc-a<\/b>, and enforces the narrowed <code>read:orders<\/code> scope against itself. The user is present, the acting service is auditable."},{"from":"IdP","to":"Client","label":"Denied — may_act does not permit this actor","hop":"STS → Service A (back-channel)","lede":"If the exchange supplies an actor_token whose identity is not listed in the subject token's may_act, the STS refuses to mint a delegated token.","resp":{"status":400,"statusText":"Bad Request","headers":[["content-type","application/json"]],"json":"{ \"error\": \"invalid_request\" }"},"devtools":"The policy check failed: the subject token's <b>may_act<\/b> did not authorize the requested actor (e.g. service X). Delegation is preferred over impersonation precisely because this authority is explicit and, in the issued token, auditable via <code>act<\/code>."}]},"oidc-token-introspection":{"title":"OAuth 2.0 Token Introspection","subtitle":"How a resource server turns an opaque access token into a yes/no verdict — a back-channel call you won't see in the browser (RFC 7662).","category":"OIDC","steps":[{"from":"Client","to":"API","label":"Call the API with an opaque token","hop":"Client → API","vis":"browser","lede":"The client presents its access token as a Bearer credential. Note the token is opaque — not a JWT — so there is nothing to base64url-decode; its meaning is resolved only by introspection.","req":{"method":"GET","url":"https://api.example.com/resource","headers":[["authorization","Bearer mF_9.B5f-4.1JqM"],["accept","application/json"]]},"devtools":"In the <b>Network<\/b> tab, filter on your API host (<code>api.example.com<\/code>). Read the <b>Authorization: Bearer<\/b> header. Try to decode it — you can't: an opaque token has no <code>.<\/code>-delimited parts. Only this hop is browser-visible; the introspection call is next and happens server-side."},{"from":"API","to":"IdP","label":"POST /introspect","hop":"API → IdP (back-channel)","lede":"The resource server asks the authorization server what the token means. It authenticates with its OWN client credentials (HTTP Basic) — this is machine-to-machine and never appears in a browser Network tab.","req":{"method":"POST","url":"https://as.example.com/introspect","headers":[["authorization","Basic cnMtb3JkZXJzOnJzLXMzY3IzdC1zaGho"],["content-type","application/x-www-form-urlencoded"],["accept","application/json"]],"form":[["token","mF_9.B5f-4.1JqM"],["token_type_hint","access_token"]]},"devtools":"Not in the browser — reproduce it from the resource server or read AS access logs filtered on <code>/introspect<\/code>. The <b>Basic<\/b> value decodes to <code>rs-orders:rs-s3cr3t-shhh<\/code>, the resource server's own identity. <b>Never<\/b> log the secret in production."},{"from":"IdP","to":"API","label":"200 active:true + claims","hop":"IdP → API (back-channel)","lede":"The AS looks up the token, confirms it is neither expired nor revoked, and returns its metadata: scope, subject, audience, expiry, and a cnf confirmation because this token is sender-constrained (DPoP-bound).","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["cache-control","no-store"]],"json":"{\n  \"active\": true,\n  \"scope\": \"read:orders\",\n  \"client_id\": \"s6BhdRkqt3\",\n  \"username\": \"avery.diaz\",\n  \"token_type\": \"Bearer\",\n  \"sub\": \"248289761001\",\n  \"aud\": \"https://api.example.com\",\n  \"iss\": \"https://as.example.com\",\n  \"exp\": 1774000000,\n  \"iat\": 1773996400,\n  \"jti\": \"atk-7c1f9a2b\",\n  \"cnf\": { \"jkt\": \"0ZcOCORZNYy-DWpqq30jZyJGHTN0d2HglBV3uiguA4I\" }\n}"},"devtools":"<b>active<\/b> is the canonical verdict — everything downstream hinges on it. Convert <code>exp<\/code> with <code>date -u -d @1774000000<\/code>. A <b>cnf.jkt<\/b> means the token is bound to a DPoP key: the API must ALSO verify the presented proof's thumbprint matches. See the DPoP flow."},{"from":"API","to":"API","label":"Enforce the verdict","hop":"API (local)","lede":"The resource server runs its checklist against the response before returning any data. This is where the token is actually authorized for this specific call.","codeTitle":"Enforcement checklist","code":"active === true                       → else 401 invalid_token\naud === \"https://api.example.com\"     → reject a token for another API\n\"read:orders\" in scope                → required scope present\nexp (1774000000) in the future       → token still live\ncnf.jkt present                       → also verify DPoP proof thumbprint","devtools":"No network event. A resource server MUST NOT fail open: if any check fails, reject. If <b>cnf.jkt<\/b> is present but no matching DPoP proof accompanied the request, that is a rejection too."},{"from":"API","to":"Client","label":"200 data","hop":"API → Client","vis":"browser","lede":"All checks passed, so the resource server returns the protected payload.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"orderId\": \"ord-1001\", \"status\": \"shipped\" }"},"devtools":"Back in the browser Network tab, the <code>/resource<\/code> request now shows a <b>200<\/b> with the payload. The whole introspection round-trip that authorized it was invisible from here."},{"from":"API","to":"IdP","label":"Inactive token → 401","hop":"API → IdP (back-channel)","lede":"When the token is expired, revoked, or unknown, introspection returns exactly {\"active\":false} — no other claims. The API turns that into a 401.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"active\": false }"},"devtools":"RFC 7662 §2.2: an inactive token echoes <b>only<\/b> <code>active:false<\/code> — never scope, sub, or exp — so it can't be used as an information-leak oracle. The API responds <code>401<\/code> with <code>WWW-Authenticate: Bearer error=\"invalid_token\"<\/code>."},{"from":"API","to":"API","label":"Cache the positive result","hop":"API (local)","lede":"A resource server may cache active:true metadata up to exp and skip /introspect on later calls. In logs this shows as a resource call with no matching introspection round-trip.","devtools":"The trade-off: caching trades a <b>revocation-detection delay<\/b> for latency. TTL is bounded by <code>exp<\/code>. Until the cache expires, a token revoked at the AS may still be honored here."}]},"oidc-token-revocation":{"title":"OAuth 2.0 Token Revocation","subtitle":"Signing out for real: the client tells the AS to invalidate a token, and the effect cascades to the whole token family (RFC 7009).","category":"OIDC","steps":[{"from":"User","to":"Client","label":"Sign out / disconnect app","hop":"User → Client","lede":"The user asks to end the session or disconnect the application. Nothing has hit the network yet.","devtools":"For a confidential (server-side) client the revocation call happens on your server — it will NOT show in the browser Network tab. Only a public SPA that revokes directly from the browser would be visible. Watch server / AS access logs otherwise."},{"from":"Client","to":"IdP","label":"POST /revoke","hop":"Client → IdP (back-channel)","lede":"The client sends the refresh token to the revocation endpoint, authenticating with its own client credentials. token_type_hint is just an optimization; if it is wrong the AS falls back to searching other token types.","req":{"method":"POST","url":"https://as.example.com/revoke","headers":[["authorization","Basic czZCaGRSa3F0MzpjbGktczNjcjN0LXNoaGg="],["content-type","application/x-www-form-urlencoded"]],"form":[["token","rt.8f3c1d9a-family-01"],["token_type_hint","refresh_token"]]},"devtools":"Filter for the <code>/revoke<\/code> path on <code>as.example.com<\/code>. The <b>Basic<\/b> value decodes to <code>s6BhdRkqt3:cli-s3cr3t-shhh<\/code> — which client is revoking. URL-decode the form body to read <code>token<\/code> and <code>token_type_hint<\/code>."},{"from":"IdP","to":"Client","label":"200 (empty body)","hop":"IdP → Client (back-channel)","lede":"The AS verifies the client owns the token, invalidates it, and cascades to its dependent access tokens and — under rotation — the whole token family. Success is a bare 200.","resp":{"status":200,"statusText":"OK","headers":[["cache-control","no-store"]]},"devtools":"<b>200 + empty body = success — but 200 is ALSO returned for an unknown or already-invalid token<\/b> (RFC 7009 §2.2). The endpoint is deliberately not a validity oracle, so the status tells you nothing about prior existence. The only meaningful error is <code>401 invalid_client<\/code> (bad client auth); <code>400 unsupported_token_type<\/code> if the type can't be revoked here."},{"from":"Client","to":"Client","label":"Discard local tokens","hop":"Client (local)","lede":"The client drops its cached access and refresh tokens and clears the local session. From the user's perspective they are now signed out.","devtools":"No network event. The local cleanup and the server-side revocation are independent — do both: clearing local storage without calling /revoke leaves a live refresh token on the AS."},{"from":"Client","to":"API","label":"Next call with the revoked token → 401","hop":"Client → API","vis":"browser","lede":"The now-revoked access token (same family as the refresh token) is presented on the next API call. Because this resource server validates via introspection, it is rejected immediately.","req":{"method":"GET","url":"https://api.example.com/resource","headers":[["authorization","Bearer mF_9.B5f-4.1JqM"]]},"resp":{"status":401,"statusText":"Unauthorized","headers":[["www-authenticate","Bearer error=\"invalid_token\""],["content-type","application/json"]],"json":"{ \"error\": \"invalid_token\" }"},"devtools":"In the browser Network tab this is the visible effect of revocation: a <b>401<\/b> with <code>WWW-Authenticate: Bearer error=\"invalid_token\"<\/code>. Immediacy depends on validation: a resource server checking a self-contained JWT <i>locally<\/i> would keep honoring the token until its <code>exp<\/code>."},{"from":"API","to":"IdP","label":"How the API learns it's revoked","hop":"API → IdP (back-channel)","lede":"Behind that 401, the resource server introspected the token. After revocation the response flips to active:false — that flip is what produced the 401.","resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"active\": false }"},"devtools":"Back-channel, not in the browser. Revoking the refresh token <code>rt.8f3c1d9a-family-01<\/code> cascaded to the access token <code>mF_9.B5f-4.1JqM<\/code> in the same family. Confirm blast radius by introspecting a <i>sibling<\/i> access token — it too should read <code>active:false<\/code>."}]},"saml-artifact-binding":{"title":"SAML HTTP-Artifact Binding","subtitle":"SP-initiated SSO where the browser only ever carries a small artifact reference — the SP fetches the real assertion over a back-channel SOAP call the Network tab never sees.","category":"SAML","steps":[{"from":"User","to":"Browser","label":"Open a protected SP page","hop":"User → Browser","lede":"The user navigates to a protected resource. As with any SP-initiated flow the SP needs a fresh assertion — but here it will collect it by reference, not by value.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b> and <b>Disable cache<\/b>. The key thing you will <i>not<\/i> see later is the assertion itself — only a short <b>SAMLart<\/b>."},{"from":"Browser","to":"SP","label":"SP redirects with an AuthnRequest","hop":"Browser → SP","vis":"browser","lede":"No local session, so the SP builds an AuthnRequest asking the IdP to reply over the HTTP-Artifact binding, and redirects the browser with the DEFLATE+base64 SAMLRequest.","req":{"method":"GET","url":"https://sp.example.com/protected/resource","headers":[["accept","text/html"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://idp.example.net/sso/redirect?SAMLRequest=U1lOVEhFVElDX1NBTUxSZXF1ZXN0…&RelayState=cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]]},"codeTitle":"Redirect binding — decode the SAMLRequest","code":"URL-decode → base64-decode → INFLATE (raw DEFLATE)\n\n<samlp:AuthnRequest\n    ID=\"_synthetic-req-0000000000000000000000001\"\n    Version=\"2.0\"\n    IssueInstant=\"2026-07-25T15:04:05Z\"\n    Destination=\"https://idp.example.net/sso/redirect\"\n    ProtocolBinding=\"urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Artifact\"\n    AssertionConsumerServiceURL=\"https://sp.example.com/saml/acs\">\n  <saml:Issuer>https://sp.example.com/saml/metadata<\/saml:Issuer>\n<\/samlp:AuthnRequest>","devtools":"Find the <b>302<\/b> to the IdP. <b>URL-decode → base64-decode → INFLATE<\/b> the <b>SAMLRequest<\/b>; note <b>ProtocolBinding = …:HTTP-Artifact<\/b> — that is what makes the IdP reply with a reference instead of the assertion."},{"from":"Browser","to":"IdP","label":"IdP authenticates and mints an artifact","hop":"Browser → IdP","vis":"browser","lede":"The IdP authenticates the user (or reuses an existing session), builds the Response + signed Assertion, stores it, and mints a one-time artifact (SourceID + MessageHandle) to hand back.","req":{"method":"GET","url":"https://idp.example.net/sso/redirect","q":[["SAMLRequest","U1lOVEhFVElDX1NBTUxSZXF1ZXN0X0RFRkxBVEVfYmFzZTY0X3BsYWNlaG9sZGVyX0FBQUFBQUFBQUFBQUFBQUFRVUZCUVVGQg"],["RelayState","cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://sp.example.com/saml/acs?SAMLart=AAQAAJ2Fm/RSYNTHETICartifactPLACEHOLDERaGVsbG89PT0&RelayState=cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]]},"devtools":"The IdP may show its login page first (absent under a live session). The important response is the <b>302<\/b> back to the SP ACS — its <b>Location<\/b> carries a <b>SAMLart<\/b>, not a SAMLResponse."},{"from":"Browser","to":"SP","label":"ACS receives only the artifact","hop":"Browser → SP","vis":"browser","lede":"The browser is redirected to the ACS carrying just the 44-byte artifact reference in SAMLart, alongside RelayState. The assertion itself never transits the front channel.","req":{"method":"GET","url":"https://sp.example.com/saml/acs","q":[["SAMLart","AAQAAJ2Fm/RSYNTHETICartifactPLACEHOLDERaGVsbG89PT0"],["RelayState","cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]]},"devtools":"Select the <b>GET<\/b> to <b>/saml/acs<\/b> → <b>Query String Parameters<\/b>. You will see an opaque <b>SAMLart<\/b> and <b>RelayState<\/b> — and crucially <i>no<\/i> <b>SAMLResponse<\/b> and no assertion. This is the whole point of the artifact binding."},{"from":"SP","to":"IdP","label":"Back-channel ArtifactResolve (SOAP)","hop":"SP → IdP ARS (back-channel)","lede":"The SP dereferences the artifact over a signed SOAP ArtifactResolve to the IdP's Artifact Resolution Service, on a mutually authenticated TLS channel. This call is server-to-server.","codeTitle":"Signed SOAP ArtifactResolve (not in the browser)","code":"<samlp:ArtifactResolve\n    ID=\"_synthetic-ar-000000000000000000000001\"\n    Version=\"2.0\"\n    IssueInstant=\"2026-07-25T15:04:12Z\"\n    Destination=\"https://idp.example.net/saml/ars\">\n  <saml:Issuer>https://sp.example.com/saml/metadata<\/saml:Issuer>\n  <samlp:Artifact>AAQAAJ2Fm/RSYNTHETICartifactPLACEHOLDERaGVsbG89PT0<\/samlp:Artifact>\n<\/samlp:ArtifactResolve>","devtools":"<b>Not visible in DevTools.<\/b> This SOAP POST goes SP → IdP directly, so capture it with server logs or an <b>mTLS-aware proxy<\/b>, not the browser Network tab. The ARS checks the artifact was issued for <i>this<\/i> calling SP."},{"from":"IdP","to":"SP","label":"Back-channel ArtifactResponse (SOAP)","hop":"IdP ARS → SP (back-channel)","lede":"The ARS finds the artifact, deletes it (one-time use), and returns an ArtifactResponse wrapping the original Response + signed Assertion. The SP now validates it exactly as in POST-binding SSO.","jwt":{"title":"Decoded SAML Assertion (XML)","header":"","payload":[["Response/Issuer","https://idp.example.net/saml/metadata","IdP entityID — validate against IdP metadata before trusting anything"],["Destination","https://sp.example.com/saml/acs","The ACS URL this Response is bound to"],["InResponseTo","_synthetic-req-0000000000000000000000001","Must equal the AuthnRequest ID from step 2"],["Status","urn:oasis:names:tc:SAML:2.0:status:Success","Gates acceptance; Responder / AuthnFailed mean reject"],["Subject/NameID","S-1-5-21-SYNTHETIC-USER-abc123","The federated user identifier (persistent format)"],["Conditions","NotBefore=2026-07-25T15:04:05Z … NotOnOrAfter=2026-07-25T15:09:10Z","Validity bounds — allow small clock skew"],["Audience","https://sp.example.com/saml/metadata","Must name this SP's entityID"],["AuthnStatement/SessionIndex","_synthetic-session-0000000000001","Ties to the SSO session — needed later for Single Logout"]]},"devtools":"<b>Not visible in DevTools.<\/b> A valid, unused artifact yields the assertion; an expired or already-dereferenced artifact returns an <i>empty<\/i> ArtifactResponse by design, so a caller learns nothing about a handle it should not hold. Verify the <b>Signature<\/b> before reading claims."},{"from":"SP","to":"Browser","label":"SP session created, land on RelayState","hop":"SP → Browser","vis":"browser","lede":"With the resolved assertion validated, the SP creates its session, sets a cookie, and redirects the browser to the RelayState target.","resp":{"status":302,"statusText":"Found","headers":[["location","https://sp.example.com/app/dashboard"],["set-cookie","sp_session=SYNTHETIC-SESSION-COOKIE; HttpOnly; Secure"],["x-note","assertion resolved via back-channel SOAP ArtifactResolve, not shown in browser"]]},"devtools":"Back in the browser: the ACS answers <b>302<\/b> to the RelayState deep link and sets <b>sp_session<\/b>. The assertion that authorised this never appeared on the wire you can see."},{"from":"SP","to":"User","label":"Signed in","hop":"SP → User","lede":"The browser follows the redirect with the new cookie and the protected page renders. The artifact is already consumed and cannot be resolved again.","devtools":"Nothing further on the wire. Because the browser only ever held a reference, a stolen SAMLart URL is useless once the SP has resolved it — the ARS returns empty on any replay."}]},"saml-ecp":{"title":"SAML Enhanced Client or Proxy (ECP)","subtitle":"A non-browser profile: a SOAP/PAOS reverse-SOAP exchange where the client itself parses the AuthnRequest, authenticates to the IdP, and enforces the URL-match check that defeats a rogue SP.","category":"SAML","steps":[{"from":"User","to":"Client","label":"Launch the ECP client","hop":"User → Client","lede":"A CLI or desktop client (not a browser) requests a federated resource. Because ECP is non-browser, none of the following happens in a Network tab.","devtools":"<b>DevTools does not apply here<\/b> — no browser is involved. Capture the exchange with <code>curl -v<\/code>, <b>mitmproxy<\/b>, or Wireshark. The <b>SAML Tracer<\/b> / <b>Auth Inspector<\/b> extensions also do not apply; paste the SOAP bodies into <code>xmllint --format<\/code> instead."},{"from":"Client","to":"SP","label":"Request the resource, advertising PAOS","hop":"Client → SP","lede":"The client GETs the protected resource announcing PAOS support. The SP has no session, sees an ECP-capable client, and returns a SOAP envelope — the AuthnRequest travels inside an HTTP response (reverse SOAP).","req":{"method":"GET","url":"https://sp.example.com/protected/resource","headers":[["accept","application/vnd.paos+xml"],["paos","ver=\"urn:liberty:paos:2003-08\";\"urn:oasis:names:tc:SAML:2.0:profiles:SSO:ecp\""]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/vnd.paos+xml"]]},"codeTitle":"PAOS response — SOAP-wrapped AuthnRequest (inline XML, no base64/DEFLATE)","code":"<S:Envelope xmlns:S=\"http://schemas.xmlsoap.org/soap/envelope/\">\n  <S:Header>\n    <paos:Request xmlns:paos=\"urn:liberty:paos:2003-08\"\n        responseConsumerURL=\"https://sp.example.com/saml/acs\"\n        service=\"urn:oasis:names:tc:SAML:2.0:profiles:SSO:ecp\"/>\n    <ecp:Request xmlns:ecp=\"urn:oasis:names:tc:SAML:2.0:profiles:SSO:ecp\" IsPassive=\"0\">\n      <saml:Issuer>https://sp.example.com/saml/metadata<\/saml:Issuer>\n    <\/ecp:Request>\n    <ecp:RelayState>cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ<\/ecp:RelayState>\n  <\/S:Header>\n  <S:Body>\n    <samlp:AuthnRequest ID=\"_synthetic-req-0000000000000000000000001\"\n        AssertionConsumerServiceURL=\"https://sp.example.com/saml/acs\">…<\/samlp:AuthnRequest>\n  <\/S:Body>\n<\/S:Envelope>","devtools":"In <code>curl -v<\/code> look at the response body. The <b>AuthnRequest<\/b> is <i>inline XML<\/i>, not base64/DEFLATE — read it directly. Record <b>paos:Request/@responseConsumerURL<\/b> and the <b>ecp:RelayState<\/b> header block; you will need both later."},{"from":"Client","to":"IdP","label":"POST the AuthnRequest to the IdP over SOAP","hop":"Client → IdP","lede":"The client selects an IdP from the ecp:Request list and POSTs the SOAP-wrapped AuthnRequest to the IdP's ECP SingleSignOnService, authenticating directly — HTTP Basic here.","req":{"method":"POST","url":"https://idp.example.net/idp/profile/SAML2/SOAP/ECP","headers":[["content-type","text/xml; charset=utf-8"],["authorization","Basic am9yZGFuLmRvZTpTWU5USEVUSUM="]]},"devtools":"The <b>Authorization: Basic<\/b> value base64-decodes to <code>jordan.doe:SYNTHETIC<\/code> — the client authenticates directly to the IdP, no redirect. A <b>401<\/b> means the credentials failed."},{"from":"IdP","to":"Directory","label":"Validate credentials","hop":"IdP → Directory","lede":"The IdP checks the supplied credentials against its user Directory before it will build any assertion. On failure it returns 401 (or a SOAP fault with AuthnFailed).","devtools":"Server-side at the IdP; nothing crosses the client here. If this fails the client should pro
