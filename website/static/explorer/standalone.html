mpt for credentials and retry up to its limit."},{"from":"IdP","to":"Client","label":"SOAP Response with the signed assertion","hop":"IdP → Client","lede":"On success the IdP returns a SOAP envelope with an ecp:Response header carrying the AssertionConsumerServiceURL, plus the signed SAML Response + Assertion in the body.","resp":{"status":200,"statusText":"OK","headers":[["content-type","text/xml"]]},"jwt":{"title":"Decoded SAML Assertion (XML)","header":"","payload":[["ecp:Response/@ACSURL","https://sp.example.com/saml/acs","SOAP header — MUST equal the SP's responseConsumerURL from step 2 (the profile's MITM defence)"],["Response/Issuer","https://idp.example.net/saml/metadata","IdP entityID — validate against IdP metadata"],["InResponseTo","_synthetic-req-0000000000000000000000001","Echoes the AuthnRequest ID from the PAOS response"],["Status","urn:oasis:names:tc:SAML:2.0:status:Success","Gates acceptance"],["Subject/NameID","S-1-5-21-SYNTHETIC-USER-abc123","The federated user identifier (persistent format)"],["Conditions","NotBefore=2026-07-25T15:04:05Z … NotOnOrAfter=2026-07-25T15:09:10Z","Validity bounds — allow small clock skew"],["Audience","https://sp.example.com/saml/metadata","Must name this SP's entityID"],["AuthnStatement/SessionIndex","_synthetic-session-0000000000001","Ties to the SSO session"]]},"devtools":"Pretty-print the SOAP body with <code>xmllint --format<\/code>. The signed <b>samlp:Response<\/b> is validated exactly as in the browser profile; the extra ECP element to grab is <b>ecp:Response/@AssertionConsumerServiceURL<\/b>."},{"from":"Client","to":"Client","label":"Enforce the URL-match check","hop":"Client (local)","lede":"Before delivering anything, the client compares the IdP's AssertionConsumerServiceURL with the SP's responseConsumerURL. A mismatch means a possible MITM by a rogue SP — the client sends a SOAP fault and aborts.","codeTitle":"The MITM defence (computed locally)","code":"responseConsumerURL   (from SP, step 2)  = https://sp.example.com/saml/acs\nAssertionConsumerServiceURL (from IdP, step 5) = https://sp.example.com/saml/acs\n\nmatch  →  deliver the assertion to the ACS\nmismatch  →  SOAP fault to responseConsumerURL, DO NOT deliver","devtools":"Not a network event. This equality check is unique to ECP: because the client (not a browser) actively drives the flow, it — not the IdP — is what stops a rogue SP from harvesting an assertion meant for someone else."},{"from":"Client","to":"SP","label":"Deliver the Response to the ACS (PAOS)","hop":"Client → SP","lede":"The URLs match, so the client POSTs the SOAP-wrapped Response to the SP's ACS as application/vnd.paos+xml, replaying the exact ecp:RelayState it received. The SP validates the assertion and issues a session.","req":{"method":"POST","url":"https://sp.example.com/saml/acs","headers":[["content-type","application/vnd.paos+xml; charset=utf-8"]]},"resp":{"status":200,"statusText":"OK","headers":[["set-cookie","sp_session=SYNTHETIC-SESSION-COOKIE; HttpOnly; Secure"]]},"devtools":"The final POST carries the SAML <b>Response<\/b> plus the <b>ecp:RelayState<\/b> header block returned verbatim (<code>cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ<\/code>). The SP validates signature, Issuer, Audience, Conditions, InResponseTo, then sets <b>sp_session<\/b>."},{"from":"SP","to":"User","label":"Resource delivered","hop":"SP → User","lede":"The SP returns the protected resource to the ECP client with its session token, and the client hands the result back to the user. On an invalid assertion the SP would instead return a SOAP fault / 403.","devtools":"The exchange is complete over three SOAP round-trips — no redirects, no browser, no auto-POST forms."}]},"saml-idp-initiated-sso":{"title":"SAML IdP-Initiated Web Browser SSO","subtitle":"The user starts on the IdP portal, clicks an app tile, and the IdP posts an unsolicited assertion to the SP — no AuthnRequest, and no InResponseTo to correlate.","category":"SAML","steps":[{"from":"User","to":"Browser","label":"Click an app tile on the IdP portal","hop":"User → Browser","lede":"The user is already on the IdP portal and launches an application. The SP is never visited first — this is the defining shape of IdP-initiated SSO.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b>, keep <b>Disable cache<\/b> on. The tell-tale of this flow is what you will <i>not<\/i> see: no <b>SAMLRequest<\/b> anywhere."},{"from":"Browser","to":"IdP","label":"Launch the tile (no AuthnRequest)","hop":"Browser → IdP","vis":"browser","lede":"Clicking the tile issues a plain GET to the IdP's launch endpoint. The IdP will build the response entirely on its own — there is no request message on the wire.","req":{"method":"GET","url":"https://idp.example.net/app/launch/app-0007","headers":[["accept","text/html"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html"]]},"devtools":"Find the <b>GET<\/b> to <b>/app/launch/…<\/b>. Confirm there is <b>no SAMLRequest<\/b> query param — that absence is the whole point. The IdP is the origin of the flow."},{"from":"User","to":"IdP","label":"Submit credentials (often skipped)","hop":"User → IdP","vis":"browser","lede":"If the portal session is already live this step does not happen at all. Otherwise the user authenticates against the IdP before the tile can launch.","req":{"method":"POST","url":"https://idp.example.net/sso/login","headers":[["content-type","application/x-www-form-urlencoded"]],"form":[["username","jordan.doe"],["password","SYNTHETIC-REDACTED"]]},"devtools":"Under a live portal session there is <i>no<\/i> credential <b>POST<\/b> — you jump straight to the ACS. Otherwise you will see username/password/otp posted to the IdP domain first."},{"from":"IdP","to":"Browser","label":"Auto-POST the unsolicited SAMLResponse","hop":"IdP → Browser","vis":"browser","lede":"The IdP mints an unsolicited Response — no InResponseTo — and returns an HTML page that auto-submits it to the SP's ACS. RelayState is chosen by the IdP as the post-login deep link.","resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html"]],"json":"<html><body onload='document.forms[0].submit()'>\n  <form method='POST' action='https://sp.example.com/saml/acs'>\n    <input type='hidden' name='SAMLResponse'\n      value='U1lOVEhFVElDX1NBTUxSZXNwb25zZV9iYXNlNjRfcGxhY2Vob2xkZXJfQkJC…'/>\n    <input type='hidden' name='RelayState'\n      value='cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ'/>\n  <\/form>\n<\/body><\/html>"},"devtools":"The response body is the auto-submit form. <b>RelayState<\/b> here is configured per app tile, not round-tripped from an SP request — treat it as attacker-influencable and allow-list it at the SP."},{"from":"Browser","to":"SP","label":"ACS receives the unsolicited assertion","hop":"Browser → SP","vis":"browser","lede":"The browser POSTs the SAMLResponse to the ACS. With no request to correlate, replay defence rests entirely on the assertion-ID cache and the short NotOnOrAfter window.","req":{"method":"POST","url":"https://sp.example.com/saml/acs","headers":[["content-type","application/x-www-form-urlencoded"]],"form":[["SAMLResponse","U1lOVEhFVElDX1NBTUxSZXNwb25zZV9iYXNlNjRfcGxhY2Vob2xkZXJfQkJCQkJCQkJCQkJCQkJCQkJDQ0NDQ0NDQ0NDQ0NEREREREREREQ"],["RelayState","cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]]},"jwt":{"title":"Decoded SAML Assertion (XML)","header":"","payload":[["Response/Issuer","https://idp.example.net/saml/metadata","IdP entityID — validate against IdP metadata before trusting anything"],["Destination","https://sp.example.com/saml/acs","The ACS URL this Response is bound to"],["InResponseTo","(absent)","Unsolicited response — there is no request to correlate to; SubjectConfirmationData carries no InResponseTo either"],["Status","urn:oasis:names:tc:SAML:2.0:status:Success","Gates acceptance; Responder / AuthnFailed mean reject"],["Subject/NameID","S-1-5-21-SYNTHETIC-USER-abc123","The federated user identifier (persistent format)"],["Conditions","NotBefore=2026-07-25T15:04:05Z … NotOnOrAfter=2026-07-25T15:09:10Z","Validity bounds — allow small clock skew"],["Audience","https://sp.example.com/saml/metadata","Must name this SP's entityID"],["AuthnStatement/SessionIndex","_synthetic-session-0000000000001","Ties to the SSO session — needed later for Single Logout"]]},"devtools":"Select the <b>POST<\/b> to <b>/saml/acs<\/b> → <b>Payload / Form Data<\/b>, base64-decode <b>SAMLResponse<\/b> (POST binding, <i>no inflate<\/i>). Confirm the Response has <b>NO InResponseTo<\/b> attribute and no <code>SubjectConfirmationData/@InResponseTo<\/code> — an unsolicited response must not carry one. Use <b>SAML Tracer<\/b> / <b>Auth Inspector<\/b> to pretty-print."},{"from":"SP","to":"Browser","label":"SP session created, land on the deep link","hop":"SP → Browser","vis":"browser","lede":"If the SP's policy allows unsolicited responses and the assertion ID is fresh, the SP marks it consumed, creates a session, and redirects to the IdP-supplied deep link.","resp":{"status":302,"statusText":"Found","headers":[["location","https://sp.example.com/app/dashboard"],["set-cookie","sp_session=SYNTHETIC-SESSION-COOKIE; HttpOnly; Secure"]]},"devtools":"The ACS answers <b>302<\/b> to the deep link and sets <b>sp_session<\/b>. If the SP is SP-initiated-only, instead of an error many SPs bounce the user into SP-initiated SSO with a fresh AuthnRequest."},{"from":"SP","to":"User","label":"Signed in at the deep-link destination","hop":"SP → User","lede":"The browser follows the redirect with the new cookie and the requested page renders. The assertion ID is now in the SP replay cache until its validity window closes.","devtools":"Nothing further on the wire. Re-presenting the same assertion is rejected as a duplicate assertion ID within the validity window — that is the only replay defence available without request correlation."}]},"saml-slo-idp-initiated":{"title":"SAML IdP-Initiated Single Logout","subtitle":"The user signs out at the IdP portal; the IdP kills its own session first, then fans a signed LogoutRequest out to every participant SP and reports the aggregate result.","category":"SAML","steps":[{"from":"User","to":"Browser","label":"Click Sign out on the IdP portal","hop":"User → Browser","lede":"The user ends their session from the IdP itself. There is no initiating SP LogoutRequest here — the IdP is the origin of the logout.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b> and <b>Disable cache<\/b>. Hidden-iframe fan-out is easy to miss — Preserve log is what keeps those iframe requests visible."},{"from":"Browser","to":"IdP","label":"IdP ends its session and fans out","hop":"Browser → IdP","vis":"browser","lede":"The IdP terminates its own session first, identifies the participants (here SP and SP2) with their per-SP NameID + SessionIndex, and returns a page embedding one hidden iframe per SP SLO endpoint.","req":{"method":"GET","url":"https://idp.example.net/slo/start"},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html"]],"json":"<html><body>IdP session ended; fanning out LogoutRequests via hidden iframes<\/body><\/html>"},"devtools":"The IdP kills its session <i>before<\/i> propagation so a broken chain can never leave the IdP session alive. The response embeds one hidden iframe per participant SP — each will issue its own <b>SAMLRequest<\/b>."},{"from":"Browser","to":"SP","label":"LogoutRequest to SP (hidden iframe)","hop":"Browser → SP (iframe)","vis":"browser","lede":"One iframe loads the SP's SLO endpoint with a signed LogoutRequest. The SP verifies it, destroys the session, and expires its cookie, then redirects the iframe back to the IdP with a LogoutResponse.","req":{"method":"GET","url":"https://sp.example.com/saml/slo","q":[["SAMLRequest","U1lOVEhFVElDX0xvZ291dFJlcXVlc3RfREVGTEFURV9iYXNlNjRfcGxhY2Vob2xkZXJfRUVFRUVFRUVFRUVFRUVFRg"],["RelayState","cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]],"headers":[["sec-fetch-dest","iframe"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://idp.example.net/slo/response?SAMLResponse=U1lOVEhFVElDX0xvZ291dFJlc3BvbnNl…"],["set-cookie","sp_session=deleted; Max-Age=0; HttpOnly; Secure"]]},"codeTitle":"Redirect binding — decode the SAMLRequest (a LogoutRequest)","code":"URL-decode → base64-decode → INFLATE (raw DEFLATE)\n\n<samlp:LogoutRequest\n    ID=\"_synthetic-lor-00000000000000000000000001\"\n    Version=\"2.0\"\n    IssueInstant=\"2026-07-25T16:00:00Z\"\n    Destination=\"https://idp.example.net/slo/redirect\">\n  <saml:Issuer>https://idp.example.net/saml/metadata<\/saml:Issuer>\n  <saml:NameID Format=\"…:persistent\">S-1-5-21-SYNTHETIC-USER-abc123<\/saml:NameID>\n  <samlp:SessionIndex>_synthetic-session-0000000000001<\/samlp:SessionIndex>\n<\/samlp:LogoutRequest>","devtools":"The iframe request shows <b>Sec-Fetch-Dest: iframe<\/b>. <b>URL-decode → base64-decode → INFLATE<\/b> the <b>SAMLRequest<\/b> to read the LogoutRequest; note the SP clears its cookie with <b>Max-Age=0<\/b>. Use <b>SAML Tracer<\/b> / <b>Auth Inspector<\/b> to auto-decode."},{"from":"Browser","to":"SP2","label":"LogoutRequest to SP2 (parallel iframe)","hop":"Browser → SP2 (iframe)","vis":"browser","lede":"A second hidden iframe hits SP2's SLO endpoint at the same time. Parallel iframes are faster than a redirect chain but lose confirmations whenever browsers block third-party frames or cookies.","req":{"method":"GET","url":"https://sp2.example.com/saml/slo","q":[["SAMLRequest","U1lOVEhFVElDX0xvZ291dFJlcXVlc3RfREVGTEFURV9iYXNlNjRfcGxhY2Vob2xkZXJfRUVFRUVFRUVFRUVFRUVFRg"],["RelayState","cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]],"headers":[["sec-fetch-dest","iframe"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://idp.example.net/slo/response?SAMLResponse=U1lOVEhFVElDX0xvZ291dFJlc3BvbnNl…"]]},"devtools":"Treat a <i>missing<\/i> LogoutResponse as a failure: a blocked third-party frame or cookie means the request may start but the session is never cleared — a silent partial logout. Back-channel SOAP fan-out, when used instead, is server-to-server and invisible here."},{"from":"Browser","to":"IdP","label":"LogoutResponses return to the IdP","hop":"Browser → IdP","vis":"browser","lede":"Each iframe redirects back to the IdP carrying that SP's LogoutResponse. The IdP correlates them by InResponseTo and aggregates the Status values.","req":{"method":"GET","url":"https://idp.example.net/slo/response","q":[["SAMLResponse","U1lOVEhFVElDX0xvZ291dFJlc3BvbnNlX2Jhc2U2NF9wbGFjZWhvbGRlcl9GRkZGRkZGRkZGRkZGRkZG"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html"]]},"codeTitle":"Decoded LogoutResponse","code":"<samlp:LogoutResponse\n    ID=\"_synthetic-lores-0000000000000000000001\"\n    Version=\"2.0\"\n    IssueInstant=\"2026-07-25T16:00:05Z\"\n    Destination=\"https://idp.example.net/slo/response\"\n    InResponseTo=\"_synthetic-lor-00000000000000000000000001\">\n  <saml:Issuer>https://sp.example.com/saml/metadata<\/saml:Issuer>\n  <samlp:Status>\n    <samlp:StatusCode Value=\"urn:oasis:names:tc:SAML:2.0:status:Success\"/>\n  <\/samlp:Status>\n<\/samlp:LogoutResponse>","devtools":"Base64-decode (or inflate, for the Redirect binding) each <b>SAMLResponse<\/b> and read <b>Status<\/b>. The <b>Issuer<\/b> is now the responding SP, and <b>InResponseTo<\/b> echoes the IdP's per-SP LogoutRequest ID."},{"from":"IdP","to":"User","label":"Aggregate result page","hop":"IdP → User","lede":"The IdP renders its own result — unlike SP-initiated SLO there is no final LogoutResponse to an SP. If every participant confirmed, the user is signed out of all applications.","devtools":"Nothing further on the wire. If any SP timed out or its LogoutResponse was lost, the IdP reports <b>PartialLogout<\/b> and advises closing the browser to be safe."}]},"saml-slo-sp-initiated":{"title":"SAML SP-Initiated Single Logout","subtitle":"Logout starts at one SP, travels to the IdP as a signed LogoutRequest, and the IdP propagates it to every other session participant before answering the initiating SP.","category":"SAML","steps":[{"from":"User","to":"Browser","label":"Click Logout in the SP app","hop":"User → Browser","lede":"The user signs out of one application. The SP will start Single Logout so the session is torn down everywhere it was federated, not just here.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b> (SLO chains across several domains) and <b>Disable cache<\/b>. Watch for a mix of <b>SAMLRequest<\/b> (LogoutRequest) and <b>SAMLResponse<\/b> (LogoutResponse) params."},{"from":"Browser","to":"SP","label":"SP destroys its session, redirects to the IdP","hop":"Browser → SP","vis":"browser","lede":"The SP kills its own local session and builds a signed LogoutRequest naming the NameID and the exact SessionIndex issued during SSO, then redirects the browser to the IdP SLO endpoint.","req":{"method":"GET","url":"https://sp.example.com/app/logout"},"resp":{"status":302,"statusText":"Found","headers":[["location","https://idp.example.net/slo/redirect?SAMLRequest=U1lOVEhFVElDX0xvZ291dFJlcXVlc3Q…&RelayState=cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]]},"codeTitle":"Redirect binding — decode the SAMLRequest (a LogoutRequest)","code":"URL-decode → base64-decode → INFLATE (raw DEFLATE)\n\n<samlp:LogoutRequest\n    ID=\"_synthetic-lor-00000000000000000000000001\"\n    Version=\"2.0\"\n    IssueInstant=\"2026-07-25T16:00:00Z\"\n    Destination=\"https://idp.example.net/slo/redirect\">\n  <saml:Issuer>https://sp.example.com/saml/metadata<\/saml:Issuer>\n  <saml:NameID Format=\"…:persistent\">S-1-5-21-SYNTHETIC-USER-abc123<\/saml:NameID>\n  <samlp:SessionIndex>_synthetic-session-0000000000001<\/samlp:SessionIndex>\n<\/samlp:LogoutRequest>","devtools":"Find the <b>302<\/b> whose <b>Location<\/b> targets the IdP <b>/slo/redirect<\/b>. The <b>SAMLRequest<\/b> is a <b>LogoutRequest<\/b> — <b>URL-decode → base64-decode → INFLATE<\/b>. The <code>NameID<\/code> + <code>SessionIndex<\/code> identify exactly which session to kill."},{"from":"Browser","to":"IdP","label":"IdP verifies and terminates its session","hop":"Browser → IdP","vis":"browser","lede":"On the Redirect binding the signature travels as separate SigAlg and Signature query params. The IdP verifies it, matches the session, kills its own session first, and lists the other participants (here, SP2).","req":{"method":"GET","url":"https://idp.example.net/slo/redirect","q":[["SAMLRequest","U1lOVEhFVElDX0xvZ291dFJlcXVlc3RfREVGTEFURV9iYXNlNjRfcGxhY2Vob2xkZXJfRUVFRUVFRUVFRUVFRUVFRg"],["RelayState","cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"],["SigAlg","http://www.w3.org/2001/04/xmldsig-more#rsa-sha256"],["Signature","U1lOVEhFVElDX1NJR05BVFVSRQ=="]]},"devtools":"On <b>Query String Parameters<\/b> note the detached <b>SigAlg<\/b> and <b>Signature<\/b> params — on the Redirect binding the signature is over the raw query string, not inside the XML. An <i>unsigned<\/i> LogoutRequest is a forced-logout / CSRF primitive, so this signature is mandatory."},{"from":"Browser","to":"SP2","label":"IdP propagates logout to SP2","hop":"Browser → SP2 (front-channel)","vis":"browser","lede":"The IdP front-channels the browser to each other participant's SLO endpoint with its own signed LogoutRequest. SP2 verifies it, destroys its session, and clears its cookie.","req":{"method":"GET","url":"https://sp2.example.com/saml/slo","q":[["SAMLRequest","U1lOVEhFVElDX0xvZ291dFJlcXVlc3RfREVGTEFURV9iYXNlNjRfcGxhY2Vob2xkZXJfRUVFRUVFRUVFRUVFRUVFRg"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://idp.example.net/slo/response?SAMLResponse=U1lOVEhFVElDX0xvZ291dFJlc3BvbnNl…"]]},"devtools":"This <b>GET<\/b> to <b>sp2.example.com/saml/slo<\/b> carries the IdP's LogoutRequest; SP2 answers a <b>302<\/b> back to the IdP with a <b>SAMLResponse<\/b> (LogoutResponse). With N participants this leg repeats once per SP. <i>Back-channel SOAP<\/i> propagation, by contrast, is server-to-server and never appears here."},{"from":"Browser","to":"IdP","label":"SP2's LogoutResponse reaches the IdP","hop":"Browser → IdP","vis":"browser","lede":"The browser carries SP2's LogoutResponse back to the IdP. The IdP records that SP2 is done and, with all participants handled, prepares the final response to the initiating SP.","req":{"method":"GET","url":"https://idp.example.net/slo/response","q":[["SAMLResponse","U1lOVEhFVElDX0xvZ291dFJlc3BvbnNlX2Jhc2U2NF9wbGFjZWhvbGRlcl9GRkZGRkZGRkZGRkZGRkZG"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://sp.example.com/saml/slo?SAMLResponse=U1lOVEhFVElDX0xvZ291dFJlc3BvbnNl…&RelayState=cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]]},"devtools":"Base64-decode this <b>SAMLResponse<\/b> (or inflate if delivered by Redirect binding) and read its <b>Status<\/b>. If any participant failed, the IdP will fold that into the <i>final<\/i> response as a second-level <b>PartialLogout<\/b> status."},{"from":"Browser","to":"SP","label":"Final LogoutResponse to the initiating SP","hop":"Browser → SP","vis":"browser","lede":"The IdP redirects the browser back to the SP that started it, carrying a LogoutResponse. The SP confirms InResponseTo matches its original LogoutRequest ID before showing the result.","req":{"method":"GET","url":"https://sp.example.com/saml/slo","q":[["SAMLResponse","U1lOVEhFVElDX0xvZ291dFJlc3BvbnNlX2Jhc2U2NF9wbGFjZWhvbGRlcl9GRkZGRkZGRkZGRkZGRkZG"],["RelayState","cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html"]]},"codeTitle":"Decoded LogoutResponse","code":"<samlp:LogoutResponse\n    ID=\"_synthetic-lores-0000000000000000000001\"\n    Version=\"2.0\"\n    IssueInstant=\"2026-07-25T16:00:05Z\"\n    Destination=\"https://sp.example.com/saml/slo\"\n    InResponseTo=\"_synthetic-lor-00000000000000000000000001\">\n  <saml:Issuer>https://idp.example.net/saml/metadata<\/saml:Issuer>\n  <samlp:Status>\n    <samlp:StatusCode Value=\"urn:oasis:names:tc:SAML:2.0:status:Success\"/>\n  <\/samlp:Status>\n<\/samlp:LogoutResponse>","devtools":"Read the <b>SAMLResponse<\/b> at <b>sp.example.com/saml/slo<\/b>. Confirm <b>InResponseTo<\/b> equals the LogoutRequest <code>ID<\/code> from step 2. A top-level <b>Success<\/b> with a second-level <code>…:status:PartialLogout<\/code> means at least one participant could not be logged out."},{"from":"SP","to":"User","label":"Signed out everywhere","hop":"SP → User","lede":"The initiating SP renders the confirmation. Because the IdP killed its own session before propagating, a broken chain can never leave the IdP session alive.","devtools":"Nothing further on the wire. If any leg failed you would see the initiating SP show a partial-logout warning instead — some applications may still have active sessions."}]},"saml-sp-initiated-sso":{"title":"SAML SP-Initiated Web Browser SSO","subtitle":"The user starts at the SP, gets bounced to the IdP with an AuthnRequest, and comes back with a signed assertion — step through each hop and learn to read it in the Network tab.","category":"SAML","steps":[{"from":"User","to":"Browser","label":"Open a protected SP page","hop":"User → Browser","lede":"The user navigates to a resource the SP protects. Nothing SAML has happened yet — the SP just needs to know who this is.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b> tab, enable <b>Preserve log<\/b> (this flow crosses several redirects and domains and the ACS step navigates away), and keep <b>Disable cache<\/b> on. Filter on <b>Doc<\/b>."},{"from":"Browser","to":"SP","label":"Request hits the SP with no session","hop":"Browser → SP","vis":"browser","lede":"The SP finds no local session, builds an AuthnRequest, and stores the request ID plus a RelayState pointing at where the user was headed.","req":{"method":"GET","url":"https://sp.example.com/protected/resource","headers":[["accept","text/html"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://idp.example.net/sso/redirect?SAMLRequest=U1lOVEhFVElDX1NBTUxSZXF1ZXN0…&RelayState=cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]]},"devtools":"Find this <b>302<\/b> to the SP resource. Its <b>Location<\/b> header points at the IdP and already carries the <b>SAMLRequest<\/b> and <b>RelayState<\/b> query params — that is the AuthnRequest leaving the SP."},{"from":"Browser","to":"IdP","label":"AuthnRequest redirect to the IdP","hop":"Browser → IdP","vis":"browser","lede":"The browser follows the redirect to the IdP SSO endpoint. On the Redirect binding the AuthnRequest is DEFLATE-compressed, base64-encoded, then URL-encoded into the SAMLRequest parameter.","req":{"method":"GET","url":"https://idp.example.net/sso/redirect","q":[["SAMLRequest","U1lOVEhFVElDX1NBTUxSZXF1ZXN0X0RFRkxBVEVfYmFzZTY0X3BsYWNlaG9sZGVyX0FBQUFBQUFBQUFBQUFBQUFRVUZCUVVGQg"],["RelayState","cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]]},"codeTitle":"Redirect binding — decode the SAMLRequest","code":"URL-decode → base64-decode → INFLATE (raw DEFLATE, no zlib header)\n\n<samlp:AuthnRequest\n    ID=\"_synthetic-req-0000000000000000000000001\"\n    Version=\"2.0\"\n    IssueInstant=\"2026-07-25T15:04:05Z\"\n    Destination=\"https://idp.example.net/sso/redirect\"\n    ProtocolBinding=\"urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST\"\n    AssertionConsumerServiceURL=\"https://sp.example.com/saml/acs\">\n  <saml:Issuer>https://sp.example.com/saml/metadata<\/saml:Issuer>\n  <samlp:NameIDPolicy\n      Format=\"urn:oasis:names:tc:SAML:2.0:nameid-format:persistent\" AllowCreate=\"true\"/>\n<\/samlp:AuthnRequest>","devtools":"Select the request to <b>/sso/redirect<\/b> → <b>Headers → Query String Parameters<\/b>. To read <b>SAMLRequest<\/b>: <b>URL-decode → base64-decode → INFLATE<\/b>. Copy the AuthnRequest <code>ID<\/code> — it comes back as <b>InResponseTo<\/b>. Recommended: the <b>SAML Tracer<\/b> or <b>Auth Inspector<\/b> extension auto-decodes and pretty-prints this for you."},{"from":"IdP","to":"User","label":"IdP login (and MFA)","hop":"IdP → User","vis":"browser","lede":"With no live IdP session the IdP serves its own login page. Credentials go to the IdP's domain, never the SP. With an existing IdP session this step is skipped (seamless SSO).","resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"]]},"devtools":"You will see the IdP's own HTML on <b>idp.example.net<\/b>. Under a live IdP session there is no login page at all — the flow jumps straight to the ACS POST."},{"from":"User","to":"IdP","label":"Submit credentials","hop":"User → IdP","vis":"browser","lede":"The user posts username, password, and any MFA to the IdP. The IdP authenticates and establishes its own session cookie.","req":{"method":"POST","url":"https://idp.example.net/sso/login","headers":[["content-type","application/x-www-form-urlencoded"]],"form":[["username","jordan.doe"],["password","SYNTHETIC-REDACTED"],["RelayState","cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]]},"devtools":"This <b>POST<\/b> is on the IdP domain. RelayState rides along untouched. The response is an HTML page with a self-submitting form — that is the POST-binding delivery of the assertion."},{"from":"IdP","to":"Browser","label":"Auto-POST the SAMLResponse to the ACS","hop":"IdP → Browser","vis":"browser","lede":"On success the IdP returns an HTML page whose form auto-submits to the SP's Assertion Consumer Service. On the POST binding the SAMLResponse is base64-only — no DEFLATE.","resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html"]],"json":"<html><body onload='document.forms[0].submit()'>\n  <form method='POST' action='https://sp.example.com/saml/acs'>\n    <input type='hidden' name='SAMLResponse'\n      value='U1lOVEhFVElDX1NBTUxSZXNwb25zZV9iYXNlNjRfcGxhY2Vob2xkZXJfQkJC…'/>\n    <input type='hidden' name='RelayState'\n      value='cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ'/>\n  <\/form>\n<\/body><\/html>"},"devtools":"The response body is the auto-submit form. Note the <b>action<\/b> is the SP ACS URL and the hidden <b>SAMLResponse<\/b> field is base64 (POST binding, <i>no inflate<\/i>)."},{"from":"Browser","to":"SP","label":"ACS receives the assertion","hop":"Browser → SP","vis":"browser","lede":"The browser POSTs the SAMLResponse to the ACS. The SP verifies the signature, then checks Issuer, Destination, Audience, Conditions, and InResponseTo before trusting a single claim.","req":{"method":"POST","url":"https://sp.example.com/saml/acs","headers":[["content-type","application/x-www-form-urlencoded"]],"form":[["SAMLResponse","U1lOVEhFVElDX1NBTUxSZXNwb25zZV9iYXNlNjRfcGxhY2Vob2xkZXJfQkJCQkJCQkJCQkJCQkJCQkJDQ0NDQ0NDQ0NDQ0NEREREREREREQ"],["RelayState","cmVsYXlzdGF0ZS1zeW50aGV0aWMtL2FwcC9kYXNoYm9hcmQ"]]},"jwt":{"title":"Decoded SAML Assertion (XML)","header":"","payload":[["Response/Issuer","https://idp.example.net/saml/metadata","IdP entityID — validate against IdP metadata before trusting anything"],["Destination","https://sp.example.com/saml/acs","The ACS URL this Response is bound to"],["InResponseTo","_synthetic-req-0000000000000000000000001","Must equal the AuthnRequest ID from step 3 — rejects injected/unsolicited responses"],["Status","urn:oasis:names:tc:SAML:2.0:status:Success","Gates acceptance; Responder / AuthnFailed mean reject"],["Subject/NameID","S-1-5-21-SYNTHETIC-USER-abc123","The federated user identifier (persistent format)"],["SubjectConfirmationData","Recipient=…/saml/acs, NotOnOrAfter=2026-07-25T15:09:10Z","Short bearer window; Recipient must equal the ACS URL"],["Conditions","NotBefore=2026-07-25T15:04:05Z … NotOnOrAfter=2026-07-25T15:09:10Z","Validity bounds — allow small clock skew"],["Audience","https://sp.example.com/saml/metadata","Must name this SP's entityID"],["AuthnStatement/SessionIndex","_synthetic-session-0000000000001","Ties to the SSO session — needed later for Single Logout"]]},"devtools":"Select the <b>POST<\/b> to <b>/saml/acs<\/b> → <b>Payload / Form Data<\/b>. Base64-decode <b>SAMLResponse<\/b> straight to XML (<i>do NOT inflate<\/i> — POST binding). Verify <b>InResponseTo<\/b> equals the step-3 request <code>ID<\/code> and that <b>Signature<\/b> checks out against the IdP metadata cert <i>before<\/i> reading claims (guard against XML Signature Wrapping)."},{"from":"SP","to":"Browser","label":"SP session created, land on RelayState","hop":"SP → Browser","vis":"browser","lede":"The assertion is valid, so the SP maps the NameID to a local user, sets its own session cookie, and redirects the browser to the RelayState target.","resp":{"status":302,"statusText":"Found","headers":[["location","https://sp.example.com/app/dashboard"],["set-cookie","sp_session=SYNTHETIC-SESSION-COOKIE; HttpOnly; Secure"]]},"devtools":"The ACS answers <b>302<\/b> to the RelayState deep link and sets <b>sp_session<\/b> with <b>HttpOnly; Secure<\/b>. RelayState is untrusted input — the SP must allow-list it to prevent open redirects."},{"from":"SP","to":"User","label":"Signed in","hop":"SP → User","lede":"The browser follows the redirect with the new SP cookie and the protected page renders. From here on the SP session cookie carries the login; the assertion is spent.","devtools":"Nothing further on the wire for sign-in — subsequent requests just carry <b>sp_session<\/b>. The one-time assertion cannot be replayed: the SP cached its ID until <b>NotOnOrAfter<\/b>."}]},"tokenless-header-based-sso":{"title":"Header-Based SSO (Proxy-Injected Identity)","subtitle":"A reverse proxy authenticates the user and injects identity headers on its upstream request; the app trusts them because only the proxy can reach it. Step through both hops and the spoofing attempt.","category":"Tokenless","steps":[{"from":"User","to":"Browser","label":"Open https://app.example.com/reports","hop":"User → Browser","lede":"The user navigates to a protected app that sits behind an access gateway. The browser will only ever talk to the proxy, never the backend directly.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b>. The browser only sees the <b>browser ↔ proxy<\/b> hop — the interesting identity headers live on a server-to-server hop you cannot see here."},{"from":"Browser","to":"IdP","label":"GET /reports (no session) → 302 to IdP","hop":"Browser → Proxy","vis":"browser","lede":"With no proxy session the proxy strips any inbound identity headers and redirects to the IdP. The app is never reached.","req":{"method":"GET","url":"https://app.example.com/reports","headers":[["host","app.example.com"]]},"resp":{"status":302,"statusText":"Found","headers":[["location","https://idp.example.com/authorize?client_id=proxy&redirect_uri=https%3A%2F%2Fapp.example.com%2Fcallback"]]},"devtools":"On the <b>302<\/b> row read <b>Location<\/b> pointing at the IdP. The proxy <b>always strips<\/b> client-supplied <code>X-Forwarded-User<\/code> / <code>REMOTE_USER<\/code> before doing anything — authenticated or not. The request never reached the app."},{"from":"Browser","to":"IdP","label":"Authenticate at the IdP","hop":"Browser → IdP","vis":"browser","lede":"The user authenticates however the proxy is configured — form, OIDC, SAML, or Kerberos. On success the IdP returns the browser to the proxy's callback.","devtools":"You'll see the IdP's own login pages and a callback back to the proxy. The proxy then creates its <b>proxy session<\/b> and sets a proxy session cookie."},{"from":"Browser","to":"Server","label":"GET /reports (proxy session cookie)","hop":"Browser → Proxy","vis":"browser","lede":"After login the browser's request carries only the proxy's own session cookie — NOT any identity header. The browser must never be able to send X-Forwarded-User.","req":{"method":"GET","url":"https://app.example.com/reports","headers":[["host","app.example.com"],["cookie","proxy_session=synthAUTH-7f3a"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"user\": \"alice\", \"via\": \"proxy\" }"},"devtools":"In <b>Request Headers<\/b> you see only <b>Cookie: proxy_session=…<\/b>. There is deliberately <b>no<\/b> <code>X-Forwarded-User<\/code> here — the identity header is added by the proxy on its upstream hop, which the browser cannot observe."},{"from":"Server","to":"App","label":"Proxy injects identity headers upstream","hop":"Proxy → App","vis":"browser","lede":"The proxy validates the session, resolves the user, and makes an upstream request injecting verified identity headers. This server-to-server hop is where the real credential lives.","req":{"method":"GET","url":"http://orders-app.internal.svc/reports","headers":[["host","orders-app.internal.svc"],["x-forwarded-user","alice"],["x-auth-request-email","alice@example.com"],["x-forwarded-groups","reports-viewers,staff"],["x-forwarded-for","203.0.113.7"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"user\": \"alice\", \"via\": \"proxy\" }"},"jwt":{"title":"Proxy-injected identity headers","header":"","payload":[["X-Forwarded-User","alice","Authenticated username — valid ONLY because it came from the proxy, which stripped any inbound copy"],["X-Auth-Request-Email","alice@example.com","Verified email from the IdP — same trust boundary"],["X-Forwarded-Groups","reports-viewers,staff","Authorization groups the app maps to permissions"],["X-Forwarded-For","203.0.113.7","Original client IP — trust only because your own edge set it (RFC 5737 doc range)"]]},"devtools":"This hop is <b>not<\/b> in the browser's Network tab — it is proxy→app, server-to-server. To observe it use the proxy access log, an upstream capture, or the app's request logging. The whole security model rests on the app being reachable <i>only<\/i> from the proxy (network policy, ideally mTLS on this hop)."},{"from":"Server","to":"App","label":"Spoofed header direct to app → 403","hop":"Attacker → App","vis":"browser","lede":"An attacker who forges X-Forwarded-User straight to the app's address, bypassing the proxy, is rejected — the peer is not the proxy, so the app refuses the identity header.","req":{"method":"GET","url":"http://orders-app.internal.svc/reports","headers":[["host","orders-app.internal.svc"],["x-forwarded-user","admin"]]},"resp":{"status":403,"statusText":"Forbidden","headers":[["content-type","application/json"]],"json":"{ \"error\": \"identity header from untrusted source\" }"},"devtools":"Two defenses stop this: <b>network policy<\/b> (the app accepts connections only from the proxy, so the attacker's peer is rejected → <b>403<\/b>) and <b>inbound stripping<\/b> (even via the proxy, a client-supplied <code>X-Forwarded-User<\/code> is overwritten before the upstream request). Watch for smuggling variants — <code>X_Forwarded_User<\/code>, duplicate headers, HTTP/1.1 vs HTTP/2 casing."}]},"tokenless-http-basic-auth":{"title":"HTTP Basic Authentication","subtitle":"A 401 challenge, then the username and password base64-encoded into an Authorization header and replayed on every request. Step through it and see why base64 is encoding, not encryption.","category":"Tokenless","steps":[{"from":"Browser","to":"Server","label":"GET /metrics (no credentials)","hop":"Browser → Server","vis":"browser","lede":"The client requests a protected resource with no Authorization header. There is no session and no prior login step — Basic starts with the server challenging.","req":{"method":"GET","url":"https://api.example.com/metrics","headers":[["host","api.example.com"],["accept","*/*"]]},"resp":{"status":401,"statusText":"Unauthorized","headers":[["www-authenticate","Basic realm=\"Metrics\", charset=\"UTF-8\""],["content-type","text/plain"]],"json":"Unauthorized"},"devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b>. On the <b>401<\/b> row read <b>WWW-Authenticate: Basic realm=\"Metrics\"<\/b> in Response Headers — that is the challenge that makes the browser pop its native username/password dialog for the realm."},{"from":"Server","to":"User","label":"Browser prompts for credentials","hop":"Server → User","lede":"In response to the challenge the browser shows the native credential dialog naming the realm. The user types their username and password.","devtools":"Not a network event — the native dialog is driven by the <b>WWW-Authenticate<\/b> header. The browser will cache what you enter per <b>realm<\/b> and reuse it for matching URLs."},{"from":"Browser","to":"Server","label":"Retry with Authorization: Basic","hop":"Browser → Server","vis":"browser","lede":"The browser retries the exact same URL, now carrying Authorization: Basic base64(username:password). The credential itself — not a token derived from it — is on the wire.","req":{"method":"GET","url":"https://api.example.com/metrics","headers":[["host","api.example.com"],["authorization","Basic YWxpY2U6czNjcjN0LXN5bnRoZXRpYw=="],["accept","*/*"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/plain"]],"json":"requests_total 42\nerrors_total 0\n"},"codeTitle":"Decode the Basic header (Console or shell)","code":"atob(\"YWxpY2U6czNjcjN0LXN5bnRoZXRpYw==\")\n// → \"alice:s3cr3t-synthetic\"\n\n// or in a terminal:\nprintf 'YWxpY2U6czNjcjN0LXN5bnRoZXRpYw==' | base64 -d\n// → alice:s3cr3t-synthetic\n\n// WARNING: base64 is ENCODING, not encryption. It is fully\n// reversible and offers zero confidentiality — treat this\n// header exactly like the plaintext password. Basic MUST be TLS-only.","devtools":"In <b>Request Headers<\/b> read <b>Authorization: Basic …<\/b>. The part after <code>Basic <\/code> is <code>base64(user:pass)<\/code>. Decode it with the snippet — one command reverses it, which is the whole point: it is <b>not<\/b> encryption."},{"from":"Browser","to":"Server","label":"GET /metrics/detail (header replayed)","hop":"Browser → Server","vis":"browser","lede":"On the next request the browser re-attaches the identical Authorization header automatically. There is no session and no logout — the raw credential is sent on every call.","req":{"method":"GET","url":"https://api.example.com/metrics/detail","headers":[["host","api.example.com"],["authorization","Basic YWxpY2U6czNjcjN0LXN5bnRoZXRpYw=="],["accept","*/*"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/plain"]],"json":"detail_metric 1\n"},"devtools":"Click through several authenticated rows and confirm the <b>identical<\/b> <code>Authorization: Basic<\/code> header on each. Over plain HTTP this would expose the password repeatedly — hence Basic must be paired with TLS and HSTS."},{"from":"Server","to":"Browser","label":"No logout — credentials cached per realm","hop":"Server → Browser","lede":"Because the browser caches the credential for the realm, there is nothing to invalidate server-side. Closing the browser (or clearing the realm cache) is the only 'logout'.","devtools":"There is no <code>Set-Cookie<\/code>, no token, no session record — so no server-side revocation. A stolen Basic header is as good as the plaintext password until it is rotated. This is why Basic suits machine-to-machine and locked-down internal endpoints, not user sessions."}]},"tokenless-ip-allowlist-network-auth":{"title":"IP Allowlist / Network-Location Auth","subtitle":"The 'credential' is where you are, not who you are — the same credential-free request succeeds on-net and fails off-net. Step through it and see why an IP address is not an identity.","category":"Tokenless","steps":[{"from":"User","to":"Client","label":"Access internal admin panel","hop":"User → Client","lede":"The user opens an internal tool. Access will be decided entirely by the request's source IP — evaluated at the gateway, below the application.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>. The striking thing here is what you will <b>not<\/b> see: any credential. The deciding factor — source IP — is not an HTTP artifact visible in the request."},{"from":"Client","to":"Server","label":"On-network GET /panel → 200","hop":"Client → Gateway","vis":"browser","lede":"From an allowlisted source IP the request succeeds. Inspect it: no Authorization header, no auth cookie, no token. Nothing in the request says who is calling.","req":{"method":"GET","url":"https://admin.example.com/panel","headers":[["host","admin.example.com"],["accept","text/html"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"]],"json":"<h1>Admin Panel<\/h1>"},"jwt":{"title":"Gateway network context (NOT an HTTP artifact)","header":"","payload":[["clientSourceIp","203.0.113.7","The transport peer address the gateway actually evaluates (RFC 5737 doc range)"],["allowlist","203.0.113.0/24","Configured allowed CIDR range"],["decision","ALLOW","Peer is inside the range — request forwarded to the app"]]},"devtools":"In <b>Request Headers<\/b> confirm there is <b>no<\/b> <code>Authorization<\/code>, <b>no<\/b> auth <code>Cookie<\/code>, and no token. It succeeded solely because the source IP is allowlisted — a decision made at the gateway, invisible in the request contents."},{"from":"Client","to":"Server","label":"Off-network GET /panel → 403","hop":"Client → Gateway","vis":"browser","lede":"The exact same request — byte-for-byte identical headers — now fails from an off-network IP. The only thing that changed is the network path, which you cannot see in the request.","req":{"method":"GET","url":"https://admin.example.com/panel","headers":[["host","admin.example.com"],["accept","text/html"]]},"resp":{"status":403,"statusText":"Forbidden","headers":[["content-type","application/json"]],"json":"{ \"error\": \"not on an allowed network\" }"},"jwt":{"title":"Gateway network context","header":"","payload":[["clientSourceIp","198.51.100.23","Off-network peer (RFC 5737 doc range)"],["allowlist","203.0.113.0/24","Configured allowed CIDR range"],["decision","DENY","Peer outside the range — rejected at the gateway"]]},"devtools":"Compare this row to the previous one: identical request, different <b>status<\/b> (<b>403<\/b> vs <b>200<\/b>). Ideally the service is not even discoverable off-net — a silent connection reset / <code>net::ERR_CONNECTION_TIMED_OUT<\/code> gives scanners no signal that it exists."},{"from":"Client","to":"Server","label":"Spoofed X-Forwarded-For → still 403","hop":"Client → Gateway","vis":"browser","lede":"An attacker off-net adds X-Forwarded-For claiming an allowed IP. A correctly configured gateway ignores it and decides on the real transport peer — so the outcome is unchanged.","req":{"method":"GET","url":"https://admin.example.com/panel","headers":[["host","admin.example.com"],["x-forwarded-for","203.0.113.5"]]},"resp":{"status":403,"statusText":"Forbidden","headers":[["content-type","application/json"]],"json":"{ \"error\": \"not on an allowed network\" }"},"jwt":{"title":"Gateway network context","header":"","payload":[["clientSourceIp","198.51.100.23","The REAL transport peer the gateway uses"],["spoofedHeader","X-Forwarded-For: 203.0.113.5","Client-controlled and untrusted — ignored"],["decision","DENY","Header ignored; real peer is outside the allowlist"]]},"devtools":"Add <code>X-Forwarded-For: 203.0.113.5<\/code> and confirm the outcome does <b>not<\/b> change. A correct gateway decides on the <b>transport peer<\/b> (or a header set by infrastructure it owns), not a client-supplied one. If the outcome <i>does<\/i> change, the gateway is dangerously trusting a forgeable header."},{"from":"Client","to":"IdP","label":"Layer real authentication on top","hop":"App → IdP","lede":"Because network location is not identity, the allowlist should be defense-in-depth under real authentication: allowlist as filter, IdP as authentication, network as a conditional-access signal.","devtools":"An <b>authenticated<\/b> variant would additionally carry a <code>Cookie<\/code>, <code>Authorization<\/code>, or token you <i>would<\/i> see in the Network tab. Everything behind a shared NAT/VPN/office egress looks identical, so a <b>200<\/b> here proves only <i>network location<\/i>, never <i>who<\/i> — treat the allowlist as one layer, not the whole story."}]},"tokenless-magic-link":{"title":"Magic Link (Passwordless Email Login)","subtitle":"Request a link by email, click a single-use time-limited token, and a POST consumes it to establish a normal session cookie. Step through it and watch the token move from URL to session.","category":"Tokenless","steps":[{"from":"User","to":"Browser","label":"Enter email on login page","hop":"User → Browser","lede":"The user provides only an email address — no password. The app will email a link that proves control of the mailbox.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b> so the redirect chain survives navigation. Filter on <b>Fetch/XHR<\/b> + <b>Doc<\/b>."},{"from":"Browser","to":"Server","label":"POST /auth/magic-link (email only)","hop":"Browser → Server","vis":"browser","lede":"The browser posts the email. The server generates a high-entropy token, stores only its hash with a short TTL and single-use flag, and emails the link.","req":{"method":"POST","url":"https://app.example.com/auth/magic-link","headers":[["host","app.example.com"],["content-type","application/json"]],"json":"{ \"email\": \"alice@example.com\" }"},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"message\": \"If an account exists, check your email.\" }"},"devtools":"In <b>Payload<\/b> confirm only an email is sent — no password. The <b>200<\/b> response is a generic \"check your email\" that is <b>identical<\/b> whether or not the account exists: that is enumeration protection. Nothing sensitive is returned here."},{"from":"User","to":"Browser","label":"Click link in email","hop":"User → Browser","lede":"The user opens the emailed link, possibly on a different device than the one that requested it. The token lives in the URL query string.","devtools":"The session lands on whichever device clicks the link, not necessarily the one that made the request. Because the token is in a <b>URL<\/b>, it can leak via history, <code>Referer<\/code>, and logs — hence single-use + short TTL."},{"from":"Browser","to":"Server","label":"GET /auth/verify?token=… (does NOT consume)","hop":"Browser → Server","vis":"browser","lede":"The link opens a confirmation page. By design this GET does not consume the token, so mail scanners and link-preview bots that pre-fetch the URL cannot burn it.","req":{"method":"GET","url":"https://app.example.com/auth/verify","q":[["token","ml_SYNTHETIC_9f8e7d6c5b4a3210fedcba98"]],"headers":[["host","app.example.com"],["accept","text/html"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"]],"json":"<form method=\"POST\" action=\"/auth/verify\"><button>Confirm sign-in<\/button><\/form>"},"devtools":"Open the row's <b>Query String Parameters<\/b> to read <code>token=ml_SYNTHETIC_…<\/code>. This GET only renders the confirm page — the token is consumed by the follow-up <b>POST<\/b>, which defeats prefetching bots."},{"from":"Browser","to":"Server","label":"POST /auth/verify (consume token)","hop":"Browser → Server","vis":"browser","lede":"Clicking Confirm posts the token. The server hashes it, atomically looks-up-and-consumes it (checking expiry and single-use), then issues a rotated session cookie. From here it is an ordinary session.","req":{"method":"POST","url":"https://app.example.com/auth/verify","headers":[["host","app.example.com"],["content-type","application/x-www-form-urlencoded"]],"form":[["token","ml_SYNTHETIC_9f8e7d6c5b4a3210fedcba98"]]},"resp":{"status":303,"statusText":"See Other","headers":[["location","/dashboard"],["set-cookie","sid=s%3AsynthSESSION0a1b2c3d4e5f6071; Path=/; Max-Age=1800; HttpOnly; Secure; SameSite=Lax"]]},"jwt":{"title":"Set-Cookie attributes","header":"","payload":[["sid","s%3AsynthSESSION0a1b2c3d4e5f6071","Opaque server-side session reference — the magic link is now spent"],["Max-Age","1800","30-minute session lifetime"],["HttpOnly","set","Not readable from JavaScript"],["Secure","set","HTTPS only"],["SameSite","Lax","First-line CSRF defense"]]},"devtools":"In <b>Response Headers<\/b> see <b>Set-Cookie: sid=…; HttpOnly; Secure; SameSite=Lax<\/b> and the <b>303<\/b> to <code>/dashboard<\/code>. Replaying this POST should <b>fail<\/b> (a <code>4xx<\/code> with no new Set-Cookie) — the token is single-use."},{"from":"Browser","to":"Server","label":"Subsequent requests replay Cookie","hop":"Browser → Server","vis":"browser","lede":"The magic link is gone; from here the browser replays Cookie: sid=… on every request, exactly like classic session-cookie auth.","req":{"method":"GET","url":"https://app.example.com/dashboard","headers":[["cookie","sid=s%3AsynthSESSION0a1b2c3d4e5f6071"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"]]},"devtools":"In <b>Request Headers<\/b> the browser now attaches <b>Cookie: sid=…<\/b> automatically. The one-time token has been exchanged for a durable server-side session — see the <i>session-cookie<\/i> flow for how that cookie behaves from here."}]},"tokenless-mutual-tls":{"title":"Mutual TLS (mTLS) Client-Certificate Auth","subtitle":"The client authenticates with a certificate inside the TLS handshake — one layer below HTTP, so it never appears in the Network tab. Step through it and learn where the credential actually lives.","category":"Tokenless","steps":[{"from":"Client","to":"Server","label":"ClientHello","hop":"Client → Server (TLS handshake)","lede":"The client opens the TLS connection. Everything about client authentication happens in this handshake, below HTTP — there is no request row, header, or cookie carrying the certificate.","devtools":"This is <b>not<\/b> in the Network tab — it is the TLS handshake, one layer under HTTP. To watch it, use the browser <b>Security<\/b> panel or capture a NetLog via <code>chrome://net-export<\/code> (inspect <code>SSL_HANDSHAKE<\/code> / <code>CERT_VERIFIER<\/code> events)."},{"from":"Server","to":"Client","label":"CertificateRequest","hop":"Server → Client (TLS handshake)","lede":"The server sends its own certificate and a CertificateRequest naming acceptable CAs and signature algorithms — this is what asks the client to authenticate with a cert.","devtools":"Still handshake-level, invisible to the Network tab. The <b>server<\/b> cert is viewable under DevTools → <b>Security<\/b> → <i>View certificate<\/i>. The <b>client<\/b> cert choice is surfaced by the OS/browser cert-selection prompt, not an HTTP row."},{"from":"Client","to":"Server","label":"Client Certificate + CertificateVerify","hop":"Client → Server (TLS handshake)","lede":"The client sends its certificate chain and a CertificateVerify — a signature over the handshake transcript proving possession of the private key. In TLS 1.3 this is sent after encryption is established, so even a packet sniffer cannot see it.","codeTitle":"See the handshake with openssl (terminal, not DevTools)","code":"openssl s_client -connect api.internal.example.com:443 \\\n  -cert client.crt -key client.key -CAfile ca.crt -tls1_3 <\/dev/null \\\n  | openssl x509 -noout -subject -issuer -dates -ext subjectAltName\n\n# subject= CN=svc-orders,O=Example,OU=payments\n# issuer=  CN=Synthetic Test CA\n# notBefore=Jul 25 00:00:00 2026 GMT\n# notAfter= Oct 23 00:00:00 2026 GMT\n# X509v3 Subject Alternative Name:\n#     URI:spiffe://example.com/ns/pay/sa/orders","devtools":"Not observable in the Network tab — the signature proves key possession and cannot be replayed on another connection. Use <code>openssl s_client<\/code> to actually inspect the client cert's <b>subject<\/b>, <b>issuer<\/b>, <b>validity<\/b>, and <b>SAN<\/b> — the fields the server maps to an identity."},{"from":"Server","to":"Server","label":"Validate cert · chain · EKU · revocation","hop":"Server (local)","lede":"The server verifies the CertificateVerify signature, validates the chain to a trusted CA, checks notBefore/notAfter and that EKU contains clientAuth, then checks revocation via OCSP or CRL.","jwt":{"title":"Client certificate fields the server checks","header":"","payload":[["Subject","CN=svc-orders, O=Example, OU=payments","Mapped to an application identity — never trust CN display alone"],["Issuer","CN=Synthetic Test CA","Must chain to a pinned/trusted CA to prevent cross-CA impersonation"],["Not Before","2026-07-25T00:00:00Z","Validity window start"],["Not After","2026-10-23T00:00:00Z","Short-lived (90 days) — prefer automated rotation (e.g. SPIFFE SVIDs)"],["SAN (URI)","spiffe://example.com/ns/pay/sa/orders","The SPIFFE ID — the deliberate identity mapping"],["Extended Key Usage","clientAuth","Must be present for a client certificate"],["Revocation","OCSP / CRL: good","Checked separately — decide soft-fail vs hard-fail explicitly"]]},"devtools":"None of this is an HTTP artifact. Revocation is a policy decision: on an OCSP responder outage, hard-fail vs soft-fail must be chosen deliberately."},{"from":"Client","to":"Server","label":"GET /orders (over the mTLS connection)","hop":"Client → Server","vis":"browser","lede":"Only now does HTTP flow — and the application request carries NO credential header. Authentication already happened in the handshake, so the identity is the connection itself.","req":{"method":"GET","url":"https://api.internal.example.com/orders","headers":[["host","api.internal.example.com"],["accept","application/json"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"orders\": [], \"client\": \"svc-orders\" }"},"devtools":"This <b>is<\/b> in the Network tab — but look closely: there is <b>no<\/b> <code>Authorization<\/code> header and no auth cookie on it. By the time you see <code>GET /orders<\/code>, the client-cert authentication is already finished in the handshake."},{"from":"Server","to":"Server","label":"Proxy forwards verified-cert headers","hop":"Proxy → App","vis":"browser","lede":"When a reverse proxy terminates mTLS, it forwards the verified certificate details to the backend as HTTP headers. THESE are visible — on the proxy→app hop — and inherit the header-based-SSO trust boundary.","req":{"method":"GET","url":"http://orders-app.internal.svc/orders","headers":[["host","orders-app.internal.svc"],["x-ssl-client-verify","SUCCESS"],["x-ssl-client-s-dn","CN=svc-orders,O=Example,OU=payments"],["x-ssl-client-san-uri","spiffe://example.com/ns/pay/sa/orders"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"orders\": [], \"client\": \"svc-orders\" }"},"devtools":"On the <b>proxy→app<\/b> hop the verified cert is re-expressed as <b>X-SSL-Client-Verify<\/b>, <b>X-SSL-Client-S-DN<\/b>, and <b>X-SSL-Client-SAN-URI<\/b>. The app must accept these <i>only<\/i> from the proxy over a spoof-proof channel — the same trust boundary as <i>header-based SSO<\/i>."},{"from":"Client","to":"Server","label":"No client cert → denied","hop":"Client → Server","vis":"browser","lede":"With optional client auth, a request lacking a cert reaches the app and is denied 403. With required client auth the TLS handshake itself aborts and no HTTP response is produced at all.","req":{"method":"GET","url":"https://api.internal.example.com/orders","headers":[["host","api.internal.example.com"]]},"resp":{"status":403,"statusText":"Forbidden","headers":[["content-type","application/json"]],"json":"{ \"error\": \"client certificate required\" }"},"devtools":"With <b>optional<\/b> client auth you see this <b>403<\/b> at the app layer. With <b>required<\/b> client auth there is no HTTP response to inspect — the connection fails during the handshake with a TLS alert like <code>certificate_required<\/code>."}]},"tokenless-session-cookie":{"title":"Session Cookie Authentication","subtitle":"The classic form login: a POST establishes a server-side session, and an opaque HttpOnly cookie is replayed on every later request. Step through it and read each hop in the Network tab.","category":"Tokenless","steps":[{"from":"User","to":"Browser","label":"Navigate to /login","hop":"User → Browser","lede":"The user opens the login page. Nothing proves who they are yet — the goal of this flow is to establish a server-side session.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b> so the login redirect isn't cleared, and filter on <b>Doc<\/b> / <b>Fetch<\/b>."},{"from":"Browser","to":"Server","label":"GET /login → anonymous session","hop":"Browser → Server","vis":"browser","lede":"The server returns the login form and plants a pre-auth (anonymous) session cookie plus a CSRF token embedded in the form.","req":{"method":"GET","url":"https://app.example.com/login","headers":[["host","app.example.com"],["accept","text/html"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","text/html; charset=utf-8"],["set-cookie","sid=PRE_AUTH_0000aaaa1111bbbb2222cccc; Path=/; HttpOnly; Secure; SameSite=Lax"]],"json":"<form>...csrf_token=csrf-SYNTHETIC-3f9a...<\/form>"},"devtools":"In the <b>Response Headers<\/b> note <b>Set-Cookie: sid=PRE_AUTH_…<\/b>. Because it is <b>HttpOnly<\/b> you will <i>not<\/i> see it via <code>document.cookie<\/code> — only here and in <b>Application → Cookies<\/b>. Remember this pre-auth value; it should change at login."},{"from":"User","to":"Browser","label":"Enter username + password","hop":"User → Browser","lede":"The user types their credentials into the form. These are posted to the app itself — there is no external IdP in this pattern.","devtools":"Not a network event yet. The form also carries the hidden <code>csrf_token<\/code> the server planted on the previous response."},{"from":"Browser","to":"Server","label":"POST /login (credentials + CSRF)","hop":"Browser → Server","vis":"browser","lede":"The browser submits the credentials and CSRF token. On success the server destroys the anonymous session and issues a rotated session ID — the session-fixation defense.","req":{"method":"POST","url":"https://app.example.com/login","headers":[["content-type","application/x-www-form-urlencoded"],["cookie","sid=PRE_AUTH_0000aaaa1111bbbb2222cccc"]],"form":[["username","alice"],["password","correct-horse-battery-staple"],["csrf_token","csrf-SYNTHETIC-3f9a"]]},"resp":{"status":303,"statusText":"See Other","headers":[["location","/dashboard"],["set-cookie","sid=s%3AsynthSESSION9f8e7d6c5b4a3210; Path=/; Max-Age=1800; HttpOnly; Secure; SameSite=Lax"]]},"jwt":{"title":"Set-Cookie attributes (post-login sid)","header":"","payload":[["sid","s%3AsynthSESSION9f8e7d6c5b4a3210","Opaque reference into the server's session store — NOT a token with claims. %3A decodes to ':' (signed-cookie prefix)"],["Path","/","Cookie sent for the whole site"],["Max-Age","1800","30-minute idle/absolute lifetime"],["HttpOnly","set","Not readable from JavaScript — blunts XSS theft"],["Secure","set","Sent only over HTTPS"],["SameSite","Lax","Not sent on most cross-site requests — first-line CSRF defense"]]},"devtools":"Open the <b>Payload<\/b> tab to see <code>username<\/code>, <code>password<\/code>, <code>csrf_token<\/code>. Then compare the new <b>Set-Cookie: sid=<\/b> against the pre-auth value: it <b>changes<\/b>. That rotation kills any <code>sid<\/code> an attacker planted (session fixation)."},{"from":"Browser","to":"Server","label":"GET /api/me (Cookie replayed)","hop":"Browser → Server","vis":"browser","lede":"On every following request the browser automatically replays the session cookie. The opaque sid is the sole proof of identity; the server looks it up in its session store.","req":{"method":"GET","url":"https://app.example.com/api/me","headers":[["cookie","sid=s%3AsynthSESSION9f8e7d6c5b4a3210"],["accept","application/json"]]},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"]],"json":"{ \"user\": \"alice\", \"roles\": [\"member\"] }"},"devtools":"In <b>Request Headers<\/b> read <b>Cookie: sid=…<\/b> — the browser attached it for you. There is no <code>Authorization<\/code> header and no token; identity is entirely the server-side lookup of this opaque id. Deleting the store record revokes access instantly."},{"from":"Server","to":"Browser","label":"Session established","hop":"Server → Browser","lede":"The authenticated UI renders. State-changing POSTs from here carry the CSRF token (form field or X-CSRF-Token header) in addition to the cookie.","devtools":"Nothing more on the wire for sign-in. Inspect the live cookie and its flags under <b>Application → Storage → Cookies<\/b>. A <code>POST /logout<\/code> would return <code>Set-Cookie: sid=; Max-Age=0<\/code> and delete the store record, so replaying the old <code>sid<\/code> afterward fails."}]},"tokenless-webauthn-passkey-authentication":{"title":"WebAuthn / Passkey Authentication","subtitle":"A server challenge, a signature made inside the authenticator, and a POST the server verifies against a stored public key. Step through it and see what the browser can — and cannot — show you.","category":"Tokenless","steps":[{"from":"User","to":"Browser","label":"Click \"Sign in with passkey\"","hop":"User → Browser","lede":"The user starts the passkey ceremony. No password is involved; the proof will be a signature over a fresh server challenge scoped to this site.","devtools":"Open DevTools (<b>F12<\/b>) → <b>Network<\/b>, enable <b>Preserve log<\/b>, filter on <b>Fetch/XHR<\/b>. You will see two requests bracketing an invisible signing step."},{"from":"Browser","to":"Server","label":"POST /assertion/options (fetch challenge)","hop":"Browser → Server","vis":"browser","lede":"The browser asks for authentication options. The server returns a random single-use challenge bound to a pending login, the RP ID the credential is scoped to, and which credentials it will accept.","req":{"method":"POST","url":"https://app.example.com/webauthn/assertion/options","headers":[["host","app.example.com"],["content-type","application/json"]],"json":"{ \"username\": \"alice\" }"},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["set-cookie","webauthn_session=pending-SYNTHETIC-8899; Path=/; HttpOnly; Secure; SameSite=Lax"]],"json":"{\n  \"challenge\": \"Y2hhbGxlbmdlLVNZTlRIRVRJQy0xMjM0NTY3ODkw\",\n  \"rpId\": \"app.example.com\",\n  \"allowCredentials\": [{ \"type\": \"public-key\", \"id\": \"Y3JlZC1TWU5USEVUSUMtaWQtOTk5OA\" }],\n  \"userVerification\": \"required\",\n  \"timeout\": 60000\n}"},"jwt":{"title":"PublicKeyCredentialRequestOptions","header":"","payload":[["challenge","Y2hhbGxlbmdlLVNZTlRIRVRJQy0xMjM0NTY3ODkw","Random, single-use (base64url); bound server-side to the pending webauthn_session cookie"],["rpId","app.example.com","Relying Party ID the credential is scoped to — the phishing boundary"],["allowCredentials","[public-key id Y3JlZC1…OTk5OA]","Credential IDs the server accepts (username-first flow); empty for discoverable credentials"],["userVerification","required","Authenticator must verify the user (biometric / PIN)"],["timeout","60000","Ceremony must complete within 60s"]]},"devtools":"Read the response under <b>Preview<\/b>: note <b>challenge<\/b>, <b>rpId<\/b>, and <b>allowCredentials<\/b>. A <code>webauthn_session<\/code> cookie ties the challenge to this attempt. Copy the challenge — you'll match it inside the assertion."},{"from":"Browser","to":"User","label":"Authenticator signs the challenge","hop":"Browser → Authenticator (local)","lede":"navigator.credentials.get() hands off to the platform. The authenticator prompts for user verification, then signs authenticatorData plus a hash of clientDataJSON with the private key — all inside the device.","codeTitle":"In the page (not a network request)","code":"const assertion = await navigator.credentials.get({\n  publicKey: {\n    challenge: base64urlToBuffer(\"Y2hhbGxlbmdlLVNZTlRIRVRJQy0xMjM0NTY3ODkw\"),\n    rpId: \"app.example.com\",\n    allowCredentials: [{ type: \"public-key\", id: base64urlToBuffer(\"Y3JlZC1TWU5USEVUSUMtaWQtOTk5OA\") }],\n    userVerification: \"required\"\n  }\n});\n// The private key and the signing operation live INSIDE the authenticator\n// (Touch ID / Windows Hello / security key). They are NEVER exposed to the\n// page or the network — you only ever see the resulting signature bytes.","devtools":"This is <b>not<\/b> a network request, which is why it has no Network row — you'll just see a pause. The browser scopes the credential lookup to <b>rpId<\/b>, so a phishing look-alike domain finds no passkey. The private key never leaves the authenticator."},{"from":"Browser","to":"Server","label":"POST /assertion/verify (assertion)","hop":"Browser → Server","vis":"browser","lede":"The browser posts the assertion. The server looks up the public key by credentialId and verifies the signature, the echoed challenge, the origin, the rpIdHash, and the UP/UV flags and counter.","req":{"method":"POST","url":"https://app.example.com/webauthn/assertion/verify","headers":[["host","app.example.com"],["content-type","application/json"],["cookie","webauthn_session=pending-SYNTHETIC-8899"]],"json":"{\n  \"id\": \"Y3JlZC1TWU5USEVUSUMtaWQtOTk5OA\",\n  \"rawId\": \"Y3JlZC1TWU5USEVUSUMtaWQtOTk5OA\",\n  \"type\": \"public-key\",\n  \"response\": {\n    \"clientDataJSON\": \"eyJ0eXBlIjoid2ViYXV0aG4uZ2V0IiwiY2hhbGxlbmdlIjoiWTJoaGJHeGxibWRsTFZOWlRsUklSVlJKUXkweE1qTTBOVFkzT0RrdyIsIm9yaWdpbiI6Imh0dHBzOi8vYXBwLmV4YW1wbGUuY29tIiwiY3Jvc3NPcmlnaW4iOmZhbHNlfQ\",\n    \"authenticatorData\": \"authDataSYNTHETIC-rpIdHash-flags-counter\",\n    \"signature\": \"MEUCIQD-SYNTHETIC-signature-bytes\",\n    \"userHandle\": \"dXNlci1oYW5kbGUtU1lOVEhFVElD\"\n  }\n}"},"resp":{"status":200,"statusText":"OK","headers":[["content-type","application/json"],["set-cookie","sid=s%3AsynthSESSIONwebauthn0011; Path=/; Max-Age=1800; HttpOnly; Secure; SameSite=Lax"]],"json":"{ \"verified\": true, \"user\": \"alice\" }"},"codeTitle":"Decode clientDataJSON (base64url → JSON)","code":"const b64url = \"eyJ0eXBlIjoid2ViYXV0aG4uZ2V0Ii...SYNTHETIC...\";\nconst json = atob(b64url.replace(/-/g, \"+\").replace(/_/g, \"/\"));\nconsole.log(JSON.parse(json));\n// {\n//   \"type\": \"webauthn.get\",\n//   \"challenge\": \"Y2hhbGxlbmdlLVNZTlRIRVRJQy0xMjM0NTY3ODkw\",\n//   \"origin\": \"https://app.example.com\",\n//   \"crossOrigin\": false\n// }","jwt":{"title":"What the server verifies in the assertion","header":"","payload":[["clientDataJSON.type","webauthn.get","Must equal \"webauthn.get\""],["clientDataJSON.challenge","Y2hhbGxlbmdlL…Njc4OTA","Must equal the issued single-use challenge"],["clientDataJSON.origin","https://app.example.com","Must be an expected origin — this is the phishing check"],["authenticatorData","rpIdHash · flags · counter","rpIdHash must equal SHA-256(rpId); UP/UV flags set; counter checked"],["signature","MEUCIQD-SYNTHETIC-…","Verified over authenticatorData ‖ SHA-256(clientDataJSON) with the stored PUBLIC key"],["userHandle","dXNlci1oYW5kbGUtU1lOVEhFVElD","Maps to the account (discoverable-credential / usernameless flows)"]]},"devtools":"Open <b>Payload<\/b> and inspect the assertion fields. Decode <b>clientDataJSON<\/b> with the snippet and confirm <code>type<\/code>, <code>challenge<\/code>, and <code>origin<\/code>. You see the <b>signature<\/b> bytes but never the key that produced them. On success, <b>Set-Cookie: sid=…<\/b> begins an ordinary session."},{"from":"Server","to":"User","label":"Signed in — nothing phishable","hop":"Server → User","lede":"The server established a normal session cookie. No password crossed the wire and nothing reusable was exposed — a stolen assertion is bound to one challenge and origin.","devtools":"From here it is an ordinary <i>session cookie<\/i>: the browser replays <b>Cookie: sid=…<\/b>. Because the challenge is single-use and the origin is signed into <code>clientDataJSON<\/code>, a captured assertion cannot be replayed against another site or a later login."}]}};</script>
<script>/* Flow Explorer engine. Reads ?flow=<id> and renders models/<id>.json as an interactive
   step-through; with no flow it renders a picker from models/index.json. Self-contained. */
(function () {
  "use strict";
  var app = document.getElementById("app");

  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  function j(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
  // Prefer data inlined by the standalone build; otherwise fetch from models/.
  function getIndex(){ return window.__FLOW_INDEX__ ? Promise.resolve(window.__FLOW_INDEX__) : j("models/index.json"); }
  function getModel(id){ return (window.__FLOWS__ && window.__FLOWS__[id]) ? Promise.resolve(window.__FLOWS__[id]) : j("models/"+id+".json"); }
  var INLINE = !!window.__FLOWS__;
  function errHtml(msg){return '<div class="panel"><div class="body"><p class="lede">'+esc(msg)+'</p>'+
    '<p class="note"><a href="./" data-home="1">← Back to all flows</a></p></div></div>';}

  function route(){
    var flow = new URLSearchParams(location.search).get("flow");
    if (flow) loadFlow(flow); else loadPicker();
  }
  function go(search){ // SPA navigation so it works hosted and inlined (iframe/standalone)
    try { history.pushState({}, "", search || location.pathname); } catch (e) {}
    route();
    window.scrollTo(0, 0);
  }
  window.addEventListener("popstate", route);
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest("a[data-flow],a[data-home]");
    if (!a) return;
    e.preventDefault();
    go(a.hasAttribute("data-home") ? "" : "?flow=" + a.getAttribute("data-flow"));
  });
  route();

  function loadPicker(){
    document.title = "Flow Explorer";
    getIndex().then(function(list){
      var groups = {};
      list.forEach(function(f){ (groups[f.category]=groups[f.category]||[]).push(f); });
      var html = '<header class="top"><div>'+
        '<div class="eyebrow">Interactive · Authentication</div>'+
        '<h1>Flow Explorer</h1>'+
        '<div class="sub">Step through an authentication flow and see what each request carries — and how to read it in your browser’s Network tab. All sample values are synthetic.</div>'+
        '</div></header>';
      Object.keys(groups).sort().forEach(function(cat){
        html += '<div class="group-title">'+esc(cat)+'</div><div class="pickgrid">';
        groups[cat].sort(function(a,b){return a.title.localeCompare(b.title);}).forEach(function(f){
          html += '<a class="card" href="?flow='+encodeURIComponent(f.id)+'" data-flow="'+esc(f.id)+'">'+
            '<div class="cat">'+esc(f.category)+'</div>'+
            '<div class="t">'+esc(f.title)+'</div>'+
            '<div class="n">'+esc(f.steps||"")+(f.steps?" steps":"")+'</div></a>';
        });
        html += '</div>';
      });
      app.innerHTML = html;
    }).catch(function(){ app.innerHTML = errHtml("Could not load the flow list (models/index.json)."); });
  }

  function loadFlow(id){
    getModel(id).then(renderFlow).catch(function(){
      app.innerHTML = errHtml("Flow not found: "+id);
    });
  }

  function renderFlow(model){
    document.title = model.title + " — Flow Explorer";
    var steps = model.steps || [];
    var i = 0;

    app.innerHTML =
      '<header class="top"><div>'+
        '<div class="eyebrow"><a href="./" data-home="1">Flow Explorer</a> · '+esc(model.category||"")+'</div>'+
        '<h1>'+esc(model.title)+'</h1>'+
        '<div class="sub">'+esc(model.subtitle||"")+'</div>'+
      '</div><div class="controls">'+
        '<button class="nav" id="prev" aria-label="Previous step">← Prev</button>'+
        '<span class="counter" id="counter"></span>'+
        '<button class="nav" id="next" aria-label="Next step">Next →</button>'+
      '</div></header>'+
      '<div class="progress" aria-hidden="true"><i id="bar"></i></div>'+
      '<div class="grid"><nav aria-label="Flow steps"><ol class="timeline" id="timeline"></ol></nav>'+
      '<section id="inspector" aria-live="polite"></section></div>'+
      '<footer class="foot"><span>All values are <b>synthetic</b> — safe to share.</span>'+
      '<span>Navigate with <kbd>←</kbd> <kbd>→</kbd> or click a step.</span></footer>';

    var tl = document.getElementById("timeline");
    var insp = document.getElementById("inspector");
    var bar = document.getElementById("bar");
    var counter = document.getElementById("counter");
    var prevBtn = document.getElementById("prev");
    var nextBtn = document.getElementById("next");

    function A(n){return '<span class="chip '+esc(n)+'">'+esc(n)+"</span>";}
    function isBack(s){return s.from!==s.to && s.vis!=="browser" && (s.req||s.resp);}

    function timeline(){
      tl.innerHTML = steps.map(function(s,ix){
        return '<li><button class="step '+(ix===i?"active":"")+' '+(ix<i?"done":"")+'" data-ix="'+ix+'" '+(ix===i?'aria-current="step"':"")+'>'+
          '<span class="dot"></span>'+
          '<span class="lbl">'+esc(s.label)+(isBack(s)?'<span class="tag back">SERVER</span>':"")+'</span>'+
          '<span class="hop">'+esc(s.hop||"")+'</span></button></li>';
      }).join("");
      Array.prototype.forEach.call(tl.querySelectorAll(".step"),function(b){
        b.onclick=function(){i=+b.dataset.ix;render();};
      });
    }
    function tbl(rows){return '<div class="scroll"><table class="kv">'+rows.map(function(r){
      return '<tr><td class="k">'+esc(r[0])+'</td><td class="v">'+esc(r[1])+(r[2]?'<div class="cm">'+esc(r[2])+"</div>":"")+"</td></tr>";
    }).join("")+"</table></div>";}

    function reqCard(s){
      if(!s.req) return "";
      var b="";
      if(s.req.q&&s.req.q.length) b+='<div class="note" style="margin:2px 0 4px">Query string</div>'+tbl(s.req.q);
      if(s.req.headers&&s.req.headers.length) b+='<div class="note" style="margin:10px 0 4px">Headers</div>'+tbl(s.req.headers);
      if(s.req.form&&s.req.form.length) b+='<div class="note" style="margin:10px 0 4px">Form body (application/x-www-form-urlencoded)</div>'+tbl(s.req.form);
      if(s.req.json) b+='<div class="note" style="margin:10px 0 4px">Body</div><pre class="code">'+esc(s.req.json)+"</pre>";
      var m = s.req.method||"GET";
      return '<div class="panel"><div class="head"><span class="method '+esc(m)+'">'+esc(m)+'</span>'+
        '<span class="url">'+esc(s.req.url)+'</span></div><div class="body">'+b+"</div></div>";
    }
    function respCard(s){
      if(!s.resp) return "";
      var cls = s.resp.status<300?"ok":(s.resp.status<400?"redir":"err");
      var b="";
      if(s.resp.headers&&s.resp.headers.length) b+=tbl(s.resp.headers);
      if(s.resp.json) b+='<div class="note" style="margin:10px 0 4px">Body</div><pre class="code">'+esc(s.resp.json)+"</pre>";
      return '<div class="panel"><div class="head"><h2>Response</h2><span class="status '+cls+'">'+
        esc(s.resp.status)+" "+esc(s.resp.statusText||"")+"</span></div><div class=\"body\">"+b+"</div></div>";
    }
    function jwtCard(s){
      if(!s.jwt) return "";
      return '<div class="panel"><div class="head"><h2>'+esc(s.jwt.title||"Decoded token")+'</h2></div><div class="body">'+
        (s.jwt.header?'<div class="note" style="margin-bottom:4px">Header</div><pre class="code">'+esc(s.jwt.header)+"</pre>":"")+
        (s.jwt.payload?'<div class="note" style="margin:12px 0 4px">Claims</div>'+tbl(s.jwt.payload):"")+"</div></div>";
    }
    function codeCard(s){
      if(!s.code) return "";
      return '<div class="panel"><div class="head"><h2>'+esc(s.codeTitle||"Computed locally")+'</h2></div><div class="body"><pre class="code">'+esc(s.code)+"</pre></div></div>";
    }

    function render(){
      var s = steps[i];
      timeline();
      counter.textContent = (i+1)+" / "+steps.length;
      bar.style.width = ((i+1)/steps.length*100)+"%";
      prevBtn.disabled = i===0; nextBtn.disabled = i===steps.length-1;
      var back = isBack(s) ? '<div class="banner back"><b>Back-channel step.</b> This exchange is server-to-server (or local) and generally does <b>not</b> appear in the browser Network tab — inspect it with server logs or a proxy like mitmproxy instead.</div>' : "";
      insp.innerHTML =
        '<div class="actors">'+A(s.from)+' <span class="arrow">→</span> '+A(s.to)+"</div>"+
        '<p class="lede">'+esc(s.lede||"")+"</p>"+ back +
        codeCard(s)+reqCard(s)+respCard(s)+jwtCard(s)+
        '<div class="panel"><div class="head"><h2>In DevTools</h2></div><div class="body"><div class="devtools"><span class="ic">🔎</span><p>'+(s.devtools||"")+"</p></div></div></div>";
    }
    prevBtn.onclick=function(){if(i>0){i--;render();}};
    nextBtn.onclick=function(){if(i<steps.length-1){i++;render();}};
    document.addEventListener("keydown",function(e){
      if(e.key==="ArrowLeft"&&i>0){i--;render();}
      if(e.key==="ArrowRight"&&i<steps.length-1){i++;render();}
    });
    render();
  }
})();
</script>
</body>
</html>
