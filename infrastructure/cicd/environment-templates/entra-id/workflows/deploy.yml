# ---------------------------------------------------------------------------
# TEMPLATE — copy this file to .github/workflows/deploy.yml in your IaC repo.
#
# Microsoft Entra ID (Terraform, azuread provider) deploy pipeline:
#   - Pull request        -> terraform fmt / init / validate / plan (read-only)
#   - Push to main branch -> plan + apply, gated by protected `production` env
#
# Auth: GitHub OIDC -> Entra workload identity federation (no client secret).
#   - permissions.id-token: write lets the job request a GitHub OIDC token.
#   - azure/login exchanges it for an Entra token via the federated credential.
#   - ARM_USE_OIDC=true tells the azuread provider to use that token.
#
# Required repo/environment secrets (no client secret with OIDC):
#   AZURE_TENANT_ID, AZURE_CLIENT_ID
# Fallback only (not recommended): AZURE_CLIENT_SECRET
#
# Action versions are pinned. Review and adjust before use.
# ---------------------------------------------------------------------------

name: entra-id-terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"

# Least-privilege default; jobs opt into id-token below for OIDC.
permissions:
  contents: read

concurrency:
  group: entra-id-terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # Provider auth via OIDC federation (keyless).
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  # Terraform variables (map to var.* in variables.tf).
  TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
  TF_VAR_use_oidc: "true"

jobs:
  # -------------------------------------------------------------------------
  # PR: read-only plan for the dev environment.
  # -------------------------------------------------------------------------
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC federation
      pull-requests: write # to comment the plan
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC federated)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (dev)
        run: terraform plan -input=false -var-file=env/dev.tfvars -no-color

  # -------------------------------------------------------------------------
  # Merge to main: plan + apply against prod, gated by the protected
  # `production` environment (manual approval configured in repo settings).
  # -------------------------------------------------------------------------
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # protected: requires reviewer approval
    permissions:
      contents: read
      id-token: write # required for OIDC federation
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC federated)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan (prod)
        run: terraform plan -input=false -var-file=env/prod.tfvars -out=tfplan

      - name: Terraform apply (prod)
        run: terraform apply -input=false -auto-approve tfplan
