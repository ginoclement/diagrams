# Fly.io deployment for the training leaderboard.
# 1) flyctl launch --no-deploy --name YOUR-APP-NAME   (or edit `app` below)
# 2) flyctl volumes create leaderboard_data --size 1
# 3) flyctl deploy
# Your URL will be https://YOUR-APP-NAME.fly.dev — put that in website/static/training/training-config.js
app = "identity-training-leaderboard"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_FILE = "/data/leaderboard.json"
  # Restrict to your site origin once it works:
  ALLOW_ORIGIN = "*"

[[mounts]]
  source = "leaderboard_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "3s"
